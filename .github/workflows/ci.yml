name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: fmt, timeout: 15}
          - {lane: vet, timeout: 25}
          - {lane: generate, timeout: 30}
          - {lane: test, timeout: 40}
          - {lane: race, timeout: 40}
          - {lane: kernel, timeout: 30}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/ci-github.sh '${{ matrix.lane }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/gofmt.txt
            .cache/ci/tests.json
            .cache/ci/race-tests.json
            .cache/ci/kernel-tests.json
            .cache/ci/ebpf-objects-*.sha256
            .cache/ci/generation/
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  build:
    outputs:
      artifact-name: ${{ format('build-{0}-{1}', github.sha, github.run_attempt) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/ci-github.sh build
      # Actions artifact transport does not retain executable modes.
      - run: tar -cf .cache/ci/build.tar -C .cache/ci dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/ci/build.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    outputs:
      artifact-name: ${{ format('package-{0}-{1}', github.sha, github.run_attempt) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .cache/ci/
      - run: tar -xf .cache/ci/build.tar -C .cache/ci
      - run: bash scripts/ci-github.sh package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/ci/packages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-package-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/package-install.*
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  demo:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: .cache/ci/packages/
      - run: bash scripts/ci-github.sh demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-demo-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/demo-*
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: [package, demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: .cache/ci/packages/
      - run: bash scripts/ci-github.sh compatibility
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-compatibility-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/compatibility-*
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  local:
    needs: [package, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: .cache/ci/packages/
      - run: bash scripts/ci-github.sh local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-local-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/local-*
            .cache/ci/role-*
            .cache/ci/bootstrap-tests.log
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    if: always()
    needs: [check, build, package, demo, compatibility, local]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all eleven lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          failed = {name: job['result'] for name, job in json.loads(os.environ['RESULTS']).items()
                    if job['result'] != 'success'}
          if failed:
              print(f'Incomplete CI: {failed}', file=sys.stderr)
              sys.exit(1)
          print('All eleven CI lanes passed.')
          PY
