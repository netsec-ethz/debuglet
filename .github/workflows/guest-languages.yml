name: Experimental guest sources

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-languages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci-guest-languages.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: guest-languages-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/guest-languages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
