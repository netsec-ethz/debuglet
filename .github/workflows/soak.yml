name: Scheduled TEST schedule soak

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/ci-github.sh soak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: schedule-soak-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/soak/cleanup.json
            .cache/ci/soak/run.*/commands.txt
            .cache/ci/soak/run.*/package.log
            .cache/ci/soak/run.*/install.log
            .cache/ci/soak/run.*/verify.json
            .cache/ci/soak/run.*/tests.json
            .cache/ci/soak/run.*/observations.jsonl
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
