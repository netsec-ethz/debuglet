name: Scheduled lifecycle checks

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecycle-faults
  cancel-in-progress: false

jobs:
  faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash scripts/ci-github.sh faults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lifecycle-faults-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/ci/faults/
            .cache/ci/ci-image-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
