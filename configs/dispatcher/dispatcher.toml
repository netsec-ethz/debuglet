# Dispatcher configuration for local development, run straight from a source
# checkout: `make dispatcher` starts the daemon against this file.
#
# Wallet-free and credential-free, like the local services `dbl up` writes for
# itself. It names no private file and reaches no external network.

[server]
http_port = 9000
grpc_port = 9001

[logging]
log_level = "debug"

[scheduler]
executor_timeout = 60
scheduler_granularity_ms = 30000

# Retained output limits. Account/node bytes include 64 bytes per stored frame
# and 256 per run. These are logical storage charges, not filesystem-size bounds.
# Reaching a cap refuses new storage; it does not delete retained output.
# Owner deletion or configured payload expiry releases output charges.
# Existing output is counted on upgrade; a full store does not erase it.
[output]
control_reserve_bytes = 16777216
run_bytes = 8388608
run_frames = 16384
account_bytes = 67108864
node_bytes = 536870912

# Attribution history for probe verification: executor TESLA chains, their
# disclosed keys and which runs were active from which source address. It is
# pruned after retention_days (1 to 3650; 0 means the default of 90); verifiers see the cutoff as
# retained_from.
[attribution]
retention_days = 90
# Reverse proxies whose X-Forwarded-For the attribution rate limit trusts,
# as addresses or CIDR prefixes. Empty trusts no forwarding header.
# trusted_proxies = ["10.0.0.0/8"]

# The executor reaches this dispatcher over loopback on the same machine, so
# the control channel carries no TLS and these paths stay empty. `make
# generate-certs` writes a keypair into this directory for experiments.
[tls]
disable = true
cert_file = ""
key_file = ""

[database]
path = ".data/dispatcher.db"

# Optional operator labels for an executor, published in the executor listing
# with source "operator". Every key is optional; country is ISO 3166-1 alpha-2.
# [executors."local-executor"]
# display_name = "Local executor"
# city = "Zurich"
# country = "CH"
# network = "Loopback"

# Blockchain payments are switched off explicitly; TEST submissions keep
# working. Nothing is inferred from the empty fields below, and no keystore,
# account or network is named.
[sui]
disabled = true
network = ""
grpc_endpoint = ""
graphql_url = ""
address = ""
payment_registry_id = ""
payment_kit_package = ""
keystore_path = ""

# Account admission is separate from executor capacity and retained output.
[admission.account]
requests_per_minute = 60
queued_jobs = 128
active_jobs = 16
queued_bytes = 268435456

# Explicit finite limits for operators and ownerless local TEST runs.
[admission.operator]
requests_per_minute = 240
queued_jobs = 1024
active_jobs = 64
queued_bytes = 1073741824

[retention]
# No automatic measurement expiry until this operator chooses a period.
payload_max_age_seconds = 0

# Usage allowances cap the TEST intents of accounts at the TEST units an
# operator granted them (POST /operator/accounts/{id}/allowance). They are
# usage credits, not money; nothing grants them automatically. Enabling them
# is a deployment choice.
[allowance]
enabled = false
default_grant = 30000000
