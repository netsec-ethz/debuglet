executor_id = "local-executor"
version = "unknown"
dispatcher_addr = "localhost:9001"
dispatcher_yamux_addr = "localhost:9000"
log_level = "debug"
capacity = 1_000_000_000
tesla_delay = 30
max_debuglets = 1000
disable_tls = true
# network_interface = "veth-host"
public_host = "203.0.113.10"              # public IP or domain for TCP listeners (empty disables listening)
tcp_ports = "2022,2025-3005,56000-62000"  # allowed TCP listener ports (comma-separated ranges)

[credentials]
ca_cert = "local/configs/executor/ca.crt"
client_cert = "local/configs/executor/cert"
client_key = "local/configs/executor/key"

[database]
path = ".data/executor.db"

[pricing]
price_per_bw_s = 1
currency = "SUI"
sui_wallet = ""
trial_price_limit=100000
trial_time_limit=500
