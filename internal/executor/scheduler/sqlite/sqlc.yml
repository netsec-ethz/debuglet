version: "2"
sql:
  - engine: "sqlite"
    queries: "query.sql"
    schema: "migrations"
    gen:
      go:
        package: "edb"
        out: "edb"
        overrides:
          - column: "debuglets.addresses"
            go_type:
              import: "debuglet/internal/executor/scheduler/sqlite/models"
              type: "CommaSeparatedList"
          - column: "debuglets.args"
            go_type:
              import: "debuglet/internal/executor/scheduler/sqlite/models"
              type: "CommaSeparatedList"
          - db_type: "TIMESTAMP"
            nullable: true
            go_type:
              import: "debuglet/internal/executor/scheduler/sqlite/models"
              type: "UTCTime"
