version: "3.8"

services:
  executor:
    build:
      context: .
      dockerfile: deploy/docker/executor.Dockerfile
    volumes:
      - ./local/configs/executor:/local/configs/executor:ro
      - ./local/configs/executor.toml:/etc/debuglet/executor/executor.toml:ro
    restart: unless-stopped
    privileged: true

  dispatcher:
    build:
      context: .
      dockerfile: deploy/docker/dispatcher.Dockerfile
    volumes:
      - ./local/configs/dispatcher:/local/configs/dispatcher:ro
      - ./local/configs/dispatcher.toml:/etc/debuglet/dispatcher/dispatcher.toml:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
