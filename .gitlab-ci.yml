stages:
  - build
  - deploy

build:
  stage: build
  # ubuntu:22.04's apt libbpf-dev is 0.5.0 (2021), whose bpf_printk() macro
  # caps out at 3 format args — internal/executor/{ratelimit,tagger}/ebpf's
  # C sources use more than that. 24.04 ships libbpf-dev 1.3.0, which
  # doesn't have that limit. Verified by reproducing the build in both
  # images locally before switching.
  image: ubuntu:24.04
  variables:
    # Project-relative so GitLab CI can cache them (cache paths must live
    # under CI_PROJECT_DIR). Set GOMODCACHE explicitly rather than relying
    # on it deriving from GOPATH — some base images persist their own
    # GOMODCACHE default via `go env -w`, which would silently win over a
    # GOPATH-only override. deploy/bin/mise already localizes all of
    # mise's own state to deploy/.mise/ the same way.
    GOPATH: $CI_PROJECT_DIR/.cache/go
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    # Keyed on the files that pin tool/dependency versions, so a mise.toml
    # or go.sum bump invalidates the cache instead of silently reusing
    # stale toolchains or modules.
    key:
      files:
        - mise.toml
        - go.sum
    paths:
      - deploy/.mise/
      - .cache/go/
      - .cache/go-build/
  before_script:
    # linux-libc-dev provides the kernel UAPI headers (asm/types.h etc.) and
    # libbpf-dev provides <bpf/bpf_helpers.h> etc. that the eBPF C sources in
    # internal/executor/{ratelimit,tagger}/ebpf need (compiled via `go
    # generate` -> bpf2go -> clang). gcc is required for `gcc -print-multiarch`
    # (see Makefile's build-exec target): unlike clang's native target, its
    # bpf target never auto-probes a GCC install for the multiarch include
    # dir, so linux-libc-dev's headers are invisible to it without an
    # explicit -I — installing gcc alone does NOT fix this.
    - apt-get update && apt-get install -y curl make llvm clang gcc linux-libc-dev libbpf-dev
    - ./deploy/bin/mise install
  script:
    - ./deploy/bin/mise x -- make all
    - ./deploy/bin/mise x -- make deploy-seed-db
    - mkdir -p deploy/dist
    - cp debuglet-executor debuglet-dispatcher deploy/dist/
  artifacts:
    paths:
      - deploy/dist/

deploy:
  stage: deploy
  image: ubuntu:22.04
  only:
    - main
    - dev
  before_script:
    # ubuntu:22.04's apt `ansible` package is 2.10.8 (~2021) — too old to
    # reliably run against a target running a very new Python (hit
    # "ModuleNotFoundError: No module named 'ansible.module_utils.six.moves'"
    # against a Python 3.14 host; a modern pip-installed ansible-core
    # doesn't have this problem — verified against the real host before
    # switching).
    - apt-get update && apt-get install -y python3-pip openssh-client curl
    - python3 -m pip install ansible-core
    # Everything below differs per environment (prod vs dev): the SSH
    # deploy key, the inventory file, and the dispatcher_addr/
    # dispatcher_base_url extra-vars. Pick the _DEV-suffixed CI/CD
    # variable/file on the dev branch, the plain (prod) one everywhere
    # else. See deploy/ansible/group_vars/all.yml.
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        DEPLOY_SSH_KEY_VALUE="$DEPLOY_SSH_KEY_DEV"
        INVENTORY="hosts.dev.yml"
        DISPATCHER_ADDR_VALUE="$DISPATCHER_ADDR_DEV"
        DISPATCHER_BASE_URL_VALUE="$DISPATCHER_BASE_URL_DEV"
      else
        DEPLOY_SSH_KEY_VALUE="$DEPLOY_SSH_KEY"
        INVENTORY="hosts.yml"
        DISPATCHER_ADDR_VALUE="$DISPATCHER_ADDR"
        DISPATCHER_BASE_URL_VALUE="$DISPATCHER_BASE_URL"
      fi
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY_VALUE" | base64 -d | ssh-add -
    # Fetch the private Ansible inventory for this environment from
    # GitLab's Secure Files store — it's gitignored, see .gitignore and
    # deploy/ansible/hosts*.yml.example.
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp ".secure_files/$INVENTORY" "deploy/ansible/$INVENTORY"
    # The inventory's dispatcher host entry is a __DISPATCHER_ADDR__
    # placeholder (see hosts.yml.example) — substitute in the same value
    # used for the dispatcher_addr extra-var below, so the address is only
    # ever entered once (in the CI/CD variable), not duplicated into the
    # Secure File inventory too.
    - sed -i "s/__DISPATCHER_ADDR__/$DISPATCHER_ADDR_VALUE/" "deploy/ansible/$INVENTORY"
  script:
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - VERSION=$CI_COMMIT_SHORT_SHA
    - cd deploy/ansible && ansible-playbook -i "$INVENTORY" site.yml -e "deploy_version=$VERSION dispatcher_addr=$DISPATCHER_ADDR_VALUE dispatcher_base_url=$DISPATCHER_BASE_URL_VALUE"
  dependencies:
    - build
