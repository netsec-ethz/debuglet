stages:
  - build
  - deploy

build:
  stage: build
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y curl make
    - ./deploy/bin/mise install
  script:
    - ./deploy/bin/mise x -- make all
    - mkdir -p deploy/dist
    - cp debuglet-executor debuglet-dispatcher deploy/dist/
  artifacts:
    paths:
      - deploy/dist/

deploy:
  stage: deploy
  image: ubuntu:latest
  only:
    - dev
  before_script:
    - apt-get update && apt-get install -y ansible openssh-client
    - eval $(ssh-agent -s)
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
  script:
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - cd deploy/ansible && ansible-playbook -i hosts.yml site.yml
  dependencies:
    - build
