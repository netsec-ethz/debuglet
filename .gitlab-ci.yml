stages:
  - build
  - deploy

build:
  stage: build
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y curl make
    - ./deploy/bin/mise install
  script:
    - ./deploy/bin/mise x -- make all
  artifacts:
    paths:
      - debuglet-executor
      - debuglet-dispatcher

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - dev
    - add-gitlab-action
  before_script:
    - apk add --no-cache ansible openssh-client openssh-keygen
    - eval $(ssh-agent -s)
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | ssh-add -
    - export ANSIBLE_HOST_KEY_CHECKING=false
  script:
    - ansible-playbook -i deploy/hosts.ini deploy/deploy.yml
  dependencies:
    - build
