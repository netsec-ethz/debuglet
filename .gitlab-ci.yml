# GitLab is the private deployment plane for the public Debuglet repository.
# Images and release artifacts are built on its shared Kubernetes runners.
# Inventories, host identities, and SSH keys remain GitLab Secure Files or
# protected file-type variables and are never committed or retained as artifacts.

stages:
  - images
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - when: never

# Kaniko is a temporary bridge for shared runners that prohibit rootless
# BuildKit's user namespaces. It needs neither a Docker socket nor privilege.
# Image tags are immutable commit SHAs; jobs never consume a mutable tag.
.kaniko:
  stage: images
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n'
      "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json

build_ci_tools:
  extends: .kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/deploy/ci"
      --dockerfile "$CI_PROJECT_DIR/deploy/ci/Dockerfile"
      --build-arg TOOLS_IMAGE="$CI_REGISTRY_IMAGE/ci-tools:$CI_COMMIT_SHA"
      --destination "$CI_REGISTRY_IMAGE/ci-tools:$CI_COMMIT_SHA"

build_provisioner:
  extends: .kaniko
  script:
    - set -a; . deploy/provisioner.env; set +a
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/deploy/docker/provisioner.Dockerfile"
      --build-arg BASE_IMAGE="$DEBUGLET_PROVISIONER_BASE_IMAGE"
      --build-arg BASE_DIGEST="$DEBUGLET_PROVISIONER_BASE_DIGEST"
      --build-arg ANSIBLE_CORE_VERSION="$DEBUGLET_ANSIBLE_CORE_VERSION"
      --build-arg COLLECTION_COMMUNITY_GENERAL_VERSION="$DEBUGLET_COLLECTION_COMMUNITY_GENERAL_VERSION"
      --build-arg COLLECTION_COMMUNITY_GENERAL_SHA256="$DEBUGLET_COLLECTION_COMMUNITY_GENERAL_SHA256"
      --build-arg COLLECTION_LIBRARY_INVENTORY_FILTERING_VERSION="$DEBUGLET_COLLECTION_LIBRARY_INVENTORY_FILTERING_VERSION"
      --build-arg COLLECTION_LIBRARY_INVENTORY_FILTERING_SHA256="$DEBUGLET_COLLECTION_LIBRARY_INVENTORY_FILTERING_SHA256"
      --build-arg REQUIREMENTS_SHA256="$DEBUGLET_PROVISIONER_REQUIREMENTS_SHA256"
      --build-arg COLLECTIONS_SHA256="$DEBUGLET_PROVISIONER_COLLECTIONS_SHA256"
      --build-arg GOOSE_VERSION="$DEBUGLET_GOOSE_VERSION"
      --build-arg GOOSE_SHA256="$DEBUGLET_GOOSE_SHA256"
      --destination "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA"

build_release:
  stage: build
  needs: [build_ci_tools]
  image:
    name: $CI_REGISTRY_IMAGE/ci-tools:$CI_COMMIT_SHA
    entrypoint: [""]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - go run -mod=readonly ./internal/packaging build -dist .cache/ci/dist
    - bash scripts/ci-package.sh
    - mkdir -p deploy/dist
    - cp .cache/ci/packages/debuglet-v*-linux-amd64.tar.gz .cache/ci/packages/SHA256SUMS .cache/ci/packages/install.sh deploy/dist/
    - archive=$(basename .cache/ci/packages/debuglet-v*-linux-amd64.tar.gz)
    - tar -xOzf "deploy/dist/$archive" --wildcards '*/share/debuglet/manifest.json' > deploy/dist/manifest.json
    - |
      python3 - "$archive" <<'PY'
      import hashlib, json, pathlib, sys
      dist = pathlib.Path("deploy/dist")
      manifest = json.loads((dist / "manifest.json").read_text())
      archive = sys.argv[1]
      def sha256(name):
          return hashlib.sha256((dist / name).read_bytes()).hexdigest()
      version = archive.removeprefix("debuglet-").removesuffix("-linux-amd64.tar.gz")
      (dist / "release.json").write_text(json.dumps({
          "schema_version": 1,
          "version": version,
          "source_sha": manifest["source_sha"],
          "go_version": manifest["go_version"],
          "archive": archive,
          "archive_sha256": sha256(archive),
          "installer_sha256": sha256("install.sh"),
      }, indent=2) + "\n")
      PY
    - (cd deploy/dist && sha256sum --check SHA256SUMS)
  artifacts:
    expire_in: 7 days
    paths: [deploy/dist/]

build_seed_databases:
  stage: build
  needs: [build_release, build_provisioner]
  image:
    name: $CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA
    entrypoint: [""]
  script:
    - goose -dir internal/executor/database/migrations sqlite3 deploy/dist/executor-seed.db up
    - goose -dir internal/dispatcher/database/migrations sqlite3 deploy/dist/dispatcher-seed.db up
  artifacts:
    expire_in: 7 days
    paths: [deploy/dist/]

.deploy:
  stage: deploy
  needs:
    - job: build_seed_databases
      artifacts: true
  image:
    name: $CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA
    entrypoint: [""]
  before_script:
    - test -n "$INVENTORY"
    - test -n "$KNOWN_HOSTS"
    - test -n "$DEPLOY_ENV"
    - test -n "$DEPLOY_SSH_KEY"
    - test -f "$DEPLOY_SSH_KEY"
    - mkdir -p .secure_files deploy/ansible
    - |
      python3 - "$CI_API_V4_URL" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" "$INVENTORY" "$KNOWN_HOSTS" <<'PY'
      import json, pathlib, sys, urllib.request
      api, project, token, *wanted = sys.argv[1:]
      headers = {"JOB-TOKEN": token}
      def get(url):
          return urllib.request.urlopen(urllib.request.Request(url, headers=headers)).read()
      files = json.loads(get(f"{api}/projects/{project}/secure_files"))
      by_name = {item["name"]: item["id"] for item in files}
      missing = [name for name in wanted if name not in by_name]
      if missing:
          raise SystemExit(f"missing GitLab Secure File(s): {', '.join(missing)}")
      target = pathlib.Path(".secure_files")
      for name in wanted:
          (target / name).write_bytes(get(f"{api}/projects/{project}/secure_files/{by_name[name]}/download"))
      PY
    - install -m 0600 ".secure_files/$INVENTORY" "deploy/ansible/$INVENTORY"
    - install -m 0600 ".secure_files/$KNOWN_HOSTS" "deploy/ansible/$KNOWN_HOSTS"
    - cd deploy/ansible
  after_script:
    - cd "$CI_PROJECT_DIR"
    - rm -rf .secure_files
    - rm -f "deploy/ansible/${INVENTORY:-}" "deploy/ansible/${KNOWN_HOSTS:-}"
  interruptible: false

.deploy_dev:
  extends: .deploy
  variables:
    DEPLOY_ENV: dev
    INVENTORY: hosts.dev.yml
    KNOWN_HOSTS: known_hosts.dev
    DEPLOY_SSH_KEY: $DEPLOY_SSH_KEY_DEV

.deploy_prod:
  extends: .deploy
  variables:
    DEPLOY_ENV: prod
    INVENTORY: hosts.yml
    KNOWN_HOSTS: known_hosts
    DEPLOY_SSH_KEY: $DEPLOY_SSH_KEY_PROD

deploy_dev_dispatcher:
  extends: .deploy_dev
  script:
    - >-
      ansible-playbook --private-key "$DEPLOY_SSH_KEY"
      -i "$INVENTORY"
      -e "@vars/$DEPLOY_ENV.yml"
      -e "known_hosts_file={{ playbook_dir }}/$KNOWN_HOSTS"
      -e "deploy_version=$CI_COMMIT_SHORT_SHA"
      deploy-dispatcher.yml
  environment:
    name: development/dispatcher
    deployment_tier: development
  resource_group: development-dispatcher
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "dev"'

deploy_dev_executors:
  extends: .deploy_dev
  script:
    - |
      limit_args=()
      if [ -n "${DEV_EXECUTOR_LIMIT:-}" ]; then
        limit_args=(--limit "$DEV_EXECUTOR_LIMIT")
      fi
      ansible-playbook --private-key "$DEPLOY_SSH_KEY" \
        -i "$INVENTORY" \
        -e "@vars/$DEPLOY_ENV.yml" \
        -e "known_hosts_file={{ playbook_dir }}/$KNOWN_HOSTS" \
        -e "deploy_version=$CI_COMMIT_SHORT_SHA" \
        deploy-executors.yml \
        "${limit_args[@]}"
  environment:
    name: development/executors
    deployment_tier: development
  resource_group: development-executors
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "dev"'
      when: manual
  allow_failure: true

deploy_prod_dispatcher:
  extends: .deploy_prod
  script:
    - export DEPLOY_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - >-
      ansible-playbook --private-key "$DEPLOY_SSH_KEY"
      -i "$INVENTORY"
      -e "@vars/$DEPLOY_ENV.yml"
      -e "known_hosts_file={{ playbook_dir }}/$KNOWN_HOSTS"
      -e "deploy_version=$DEPLOY_VERSION"
      deploy-dispatcher.yml
  environment:
    name: production/dispatcher
    deployment_tier: production
  resource_group: production-dispatcher
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG)'
      when: manual
  allow_failure: true

deploy_prod_executors:
  extends: .deploy_prod
  script:
    - |
      limit_args=()
      if [ -n "${PROD_EXECUTOR_LIMIT:-}" ]; then
        limit_args=(--limit "$PROD_EXECUTOR_LIMIT")
      fi
      DEPLOY_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      ansible-playbook --private-key "$DEPLOY_SSH_KEY" \
        -i "$INVENTORY" \
        -e "@vars/$DEPLOY_ENV.yml" \
        -e "known_hosts_file={{ playbook_dir }}/$KNOWN_HOSTS" \
        -e "deploy_version=$DEPLOY_VERSION" \
        deploy-executors.yml \
        "${limit_args[@]}"
  environment:
    name: production/executors
    deployment_tier: production
  resource_group: production-executors
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG)'
      when: manual
  allow_failure: true
