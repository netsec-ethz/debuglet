stages:
  - build
  - deploy

build:
  stage: build
  image: docker:latest
  before_script:
    - echo "Building debuglet binaries..."
  script:
    - make deploy-build
  artifacts:
    paths:
      - deploy/dist/

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - dev
  before_script:
    - apk add --no-cache ansible openssh-client openssh-keygen
    - eval $(ssh-agent -s)
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | ssh-add -
    - export ANSIBLE_HOST_KEY_CHECKING=false
  script:
    - ansible-playbook -i deploy/hosts.ini deploy/deploy.yml
  dependencies:
    - build
