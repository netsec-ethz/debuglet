stages:
  - build
  - deploy

build:
  stage: build
  image: ubuntu:22.04
  before_script:
    # linux-libc-dev provides the kernel UAPI headers (asm/types.h etc.) that
    # the eBPF C sources in internal/executor/{ratelimit,tagger}/ebpf need
    # (compiled via `go generate` -> bpf2go -> clang). gcc is required too:
    # clang locates the multiarch header dir (/usr/include/x86_64-linux-gnu,
    # where linux-libc-dev puts them) by probing for a GCC installation, and
    # without one it never searches that path even though the headers exist.
    - apt-get update && apt-get install -y curl make llvm clang gcc linux-libc-dev
    - ./deploy/bin/mise install
  script:
    - ./deploy/bin/mise x -- make all
    - ./deploy/bin/mise x -- make deploy-seed-db
    - mkdir -p deploy/dist
    - cp debuglet-executor debuglet-dispatcher deploy/dist/
  artifacts:
    paths:
      - deploy/dist/

deploy:
  stage: deploy
  image: ubuntu:22.04
  only:
    - main
    - dev
  before_script:
    - apt-get update && apt-get install -y ansible openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$ANSIBLE_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    # Fetch private deployment files (hosts.yml, group_vars/all.yml) from
    # GitLab's Secure Files store — they're gitignored, see .gitignore and
    # deploy/ansible/{hosts.yml.example,group_vars/all.yml.example}.
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp .secure_files/hosts.yml deploy/ansible/hosts.yml
    - cp .secure_files/all.yml deploy/ansible/group_vars/all.yml
  script:
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - VERSION=$CI_COMMIT_SHORT_SHA
    - cd deploy/ansible && ansible-playbook -i hosts.yml site.yml -e "deploy_version=$VERSION"
  dependencies:
    - build
