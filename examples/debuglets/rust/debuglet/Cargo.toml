[package]
name = "debuglet"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Rust client library for writing Debuglet WASM measurement programs"
license = "Apache-2.0"
repository = "https://github.com/netsec-ethz/debuglet"
# Maintained with the repository as experimental; no separate release or
# version promise. Depend on it by path or by git, not through a registry.
publish = false

[lib]
name = "debuglet"
path = "src/lib.rs"

