syntax = "proto3";
package debuglet.protocol;

import "google/protobuf/timestamp.proto";

option go_package = "/protocol";

// ============================================================
// ==================== CONTROL MESSAGES ======================
// ============================================================

// ================ EXECUTOR -> DISPATCHER =====================

message HeartbeatRequest {
  string executor_id = 1;
  int64 timestamp_ns = 2;
  int64 tesla_key_epoch = 3;
  bytes tesla_key = 4;
}
message HeartbeatResponse {}

message ResourcesRequest {
  string executor_id = 1;
  int64 bandwidth_capacity = 2; // Bandwidth capacity (bits/s) the executor can handle
}
message ResourcesResponse {}

// ================ DISPATCHER -> EXECUTOR =====================

message HelloRequest {}
message HelloResponse {
  string executor_id = 1; // Unique ID for this executor instance
  string version = 2; // Optional: software version or capabilities
  string source_ip = 3; // Source IP for packet attribution
  int64 tesla_delay_sec = 4; // TESLA epoch delay in seconds
  int64 tesla_anchor_timestamp_ns = 5; // Reference wall-clock time for epoch 0
  bytes tesla_anchor_key = 6; // Public anchor k_0 = H^L(seed); used to verify disclosed keys
  double price_per_bw = 7; // Price per bit/s of bandwidth
}

message DebugletPolicy {
  int64 floor_bw = 1; // min bits/s required
  int64 ceil_bw = 2; // max bits/s it could use
  int64 timeout_ms = 3; // timeout in ms
  int64 price_per_bw = 4;
  repeated string addresses = 5; // e.g., SCION or network endpoints
}

message UploadRequest {
  string id = 1;
  optional google.protobuf.Timestamp start_time = 2;
  bytes wasm = 3;
  repeated string args = 4;

  DebugletPolicy policy = 5;
}
message UploadResponse {}

message AbortRequest {
  string debuglet_id = 1;
  string reason = 2;
}
message AbortResponse {}

message DestinationLimit {
  string address = 1;
  int64 bits_limit = 2;
}

message BandwidthRequest {
  repeated DestinationLimit limits = 1;
}
message BandwidthResponse {}

// ============================================================
// ================ DEBUGLET STREAM MESSAGES ==================
// ============================================================

// ================ EXECUTOR -> DISPATCHER ====================

// The states of a debuglet from when a debuglet is set to start until before it exits
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_INITIALIZING = 1;
  RUN_STATE_STARTED = 2;
}

message DebugletStateRequest {
  string debuglet_id = 1;
  string executor_id = 2;
  RunState state = 3;
}
message DebugletStateResponse {}

message DebugletAllocateRequest {
  string debuglet_id = 1;
  string executor_id = 2;
  DebugletPolicy policy = 3;
}
// The dispatcher may directly respond with updated limits
message DebugletAllocateResponse {
    repeated DestinationLimit allocated_limits = 1;
}

message DebugletExitRequest {
  string debuglet_id = 1;
  int32 exit_code = 2;
  optional string error_message = 3;
}
message DebugletExitResponse {}

// Initially sent through a debuglet stream to identify the debuglet and executor. After that, the debuglet can send output messages through the same stream.
message DebugletIdent {
  string debuglet_id = 1;
  string executor_id = 2;
}
message DebugletOutput {
  bytes output = 1;
}
message DebugletStreamRequest {
  oneof msg {
    DebugletIdent ident = 1;
    DebugletOutput output = 2;
  }
}

// ================ DISPATCHER -> DEBUGLET ====================

message DebugletStreamResponse {}

// ============================================================
// ====================== SERVICE DEFS ========================
// ============================================================

service DispatcherService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Resources(ResourcesRequest) returns (ResourcesResponse);

  rpc DebugletState(DebugletStateRequest) returns (DebugletStateResponse);
  // Request resource allocation before a debuglet starts. The dispatcher can then have the caller wait until the resources have been allocated.
  rpc DebugletAllocate(DebugletAllocateRequest) returns (DebugletAllocateResponse);
  rpc DebugletExit(DebugletExitRequest) returns (DebugletExitResponse);
  rpc DebugletStream(stream DebugletStreamRequest) returns (stream DebugletStreamResponse);
}

service ExecutorService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
  rpc Bandwidth(BandwidthRequest) returns (BandwidthResponse);
}
