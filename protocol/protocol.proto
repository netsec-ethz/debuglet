syntax = "proto3";
package debuglet.protocol;

import "google/protobuf/timestamp.proto";

option go_package = "/protocol";

// ============================================================
// ================ CONTROL STREAM MESSAGES ====================
// ============================================================

// ================ EXECUTOR -> DISPATCHER =====================

message ExecutorHello {
  string executor_id = 1; // Unique ID for this executor instance
  string version = 2; // Optional: software version or capabilities
  string source_ip = 3; // Source IP for packet attribution
  int64 tesla_delay_sec = 4; // TESLA epoch delay in seconds
  int64 tesla_anchor_timestamp_ns = 5; // Reference wall-clock time for epoch 0
  bytes tesla_anchor_key = 6; // Public anchor k_0 = H^L(seed); used to verify disclosed keys
}

message ExecutorHeartbeat {
  int64 timestamp_ns = 2;
  int64 tesla_key_epoch = 3;
  bytes tesla_key = 4;
}

message ExecutorResources {
  int64 bandwidth_capacity = 1; // Bandwidth capacity the executor can handle per second
}

// Errors on the executor side before a debuglet is started, i.e. during uploading
message ExecutorError {
  optional string debuglet_id = 1;
  string error = 2;
}

// Executor -> Dispatcher
message ExecutorControlMessage {
  oneof msg {
    ExecutorHello hello = 1;
    ExecutorHeartbeat heartbeat = 2;
    ExecutorError error = 3;
    ExecutorResources resources = 4;
  }
}

// ================ DISPATCHER -> EXECUTOR =====================

message DebugletPolicy {
  int64 floor_bw = 1; // min bits/s required
  int64 ceil_bw = 2; // max bits/s it could use
  int64 timeout_ms = 3; // timeout in ms
  repeated string addresses = 4; // e.g., SCION or network endpoints
}

message DebugletUploadSpec {
  string id = 1;
  optional google.protobuf.Timestamp start_time = 2;
  bytes wasm = 3;

  DebugletPolicy policy = 5;
}

message AbortDebuglet {
  string debuglet_id = 1;
  string reason = 2;
}

message DestinationUpdates {
  repeated DestinationLimit limits = 1;

  message DestinationLimit {
    string address = 1;
    int64 bits_limit = 2;
  }
}

// Dispatcher -> Executor
message DispatcherControlMessage {
  oneof msg {
    DebugletUploadSpec upload = 1;
    AbortDebuglet abort = 2;
    DestinationUpdates updates = 3;
  }
}

// ============================================================
// ================ DEBUGLET STREAM MESSAGES ====================
// ============================================================

// ================ EXECUTOR -> DISPATCHER =====================

// The states of a debuglet from when a debuglet is set to start until before it exits
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_INITIALIZING = 1;
  RUN_STATE_STARTED = 2;
}

message DebugletState {
  string debuglet_id = 1;
  string executor_id = 2;
  RunState state = 3;
  optional DebugletPolicy policy = 4;
}

message DebugletOutput {
  string debuglet_id = 1;
  bytes output = 2;
}

message DebugletExit {
  string debuglet_id = 1;
  int32 exit_code = 2;
  optional string error_message = 3;
}

message ExecutorDebugletMessage {
  oneof msg {
    DebugletState state = 1;
    DebugletOutput output = 2;
    DebugletExit exit = 3;
  }
}

// ================ DISPATCHER -> EXECUTOR =====================

message DispatcherDebugletMessage {}

// ============================================================
// ====================== SERVICE DEFS =========================
// ============================================================

service DispatcherService {
  // Persistent control channel for executor registration, heartbeat, and task assignment
  rpc ControlStream(stream ExecutorControlMessage) returns (stream DispatcherControlMessage);

  // Per-session bidirectional stream for debuglet execution
  rpc DebugletStream(stream ExecutorDebugletMessage) returns (stream DispatcherDebugletMessage);
}
