syntax = "proto3";
package debuglet.protocol;

import "google/protobuf/timestamp.proto";

option go_package = "/protocol";

// ============================================================
// ==================== CONTROL MESSAGES ======================
// ============================================================

// ================ DISPATCHER -> EXECUTOR =====================

message HelloRequest {
  uint32 control_version = 1;
  string dispatcher_incarnation = 2;
  string session_id = 3;
  bytes session_token = 4; // Private offer token; never persist or log.
  int64 lease_duration_ms = 5; // Strict v3 control lease; receiver clocks only.
  uint32 output_version = 6;
}
message HelloResponse {
  string executor_id = 1; // Unique ID for this executor instance
  string version = 2; // Optional: software version or capabilities
  string source_ip = 3; // Source IP for packet attribution
  int64 tesla_delay_sec = 4; // TESLA epoch length I in seconds (historical name; not the disclosure delay)
  int64 tesla_anchor_timestamp_ns = 5; // Reference wall-clock time for epoch 0
  bytes tesla_anchor_key = 6; // Public anchor k_0 = H^L(seed); used to verify disclosed keys
  bool icmp_enabled = 7; // Whether the executor can handle ICMP packets
  int64 price_per_bw_s = 8; // Price per bit/s of bandwidth
  string currency = 9;
  optional string public_host = 10; // Optional: public host for the executor at which debuglet listeners can be contacted
  optional string sui_wallet = 11;
  uint32 control_version = 12; // Selected control protocol version
  string dispatcher_incarnation = 13; // Echoed dispatcher identity
  string session_id = 14; // Echoed session identity
  int64 lease_duration_ms = 15; // Exact echo of the offered duration.
  // Single-use enrollment credential, presented only until this node's
  // certificate is bound to its executor ID. Never persist or log it.
  optional string enrollment_token = 16;
  uint32 output_version = 17;
  ExecutorCapabilities capabilities = 18; // Optional additive discovery observation.
  VantagePointReport vantage_point = 19; // Optional; sent with capabilities.
  // TESLA disclosure delay d: the key of epoch i is disclosed once epoch i+d
  // starts, at tesla_anchor_timestamp_ns + (i+d)*tesla_delay_sec. At least 2;
  // zero from an executor that predates it, which disclosed after one epoch.
  int64 tesla_disclosure_delay_epochs = 20;
  // TESLA chain length L: the chain serves epochs below it. Zero from an
  // executor that predates it; the schedule's length is then unknown.
  int64 tesla_chain_length = 21;
  uint32 bandwidth_version = 22; // 1 supports ordered full allocation snapshots.
}

message DebugletPolicy {
  int64 floor_bw = 1; // min bits/s required
  int64 ceil_bw = 2; // max bits/s it could use
  int64 timeout_ms = 3; // timeout in ms
  repeated string addresses = 4; // e.g., SCION or network endpoints
  bool require_icmp = 5; // whether ICMP is required
  bool listen_udp = 6; // whether the debuglet should setup a UDP listening server
  bool listen_tcp = 7; // whether the debuglet should setup a TCP listening server
  bool listen_scion = 8; // whether the debuglet should setup a SCION listening server
}

message UploadRequest {
  string id = 1;
  optional google.protobuf.Timestamp start_time = 2;
  bytes wasm = 3;
  repeated string args = 4;

  DebugletPolicy policy = 5;
  string transaction_id = 6;
  ControlBinding control_binding = 7;
}
message UploadResponse {}

message AbortRequest {
  string debuglet_id = 1;
  string reason = 2;
}
message AbortResponse {}

message DestinationLimit {
  string address = 1;
  int64 bits_limit = 2;
}

message BandwidthRequest {
  repeated DestinationLimit limits = 1;
  uint64 revision = 2; // Session-local full snapshot revision; zero is legacy.
}
message BandwidthResponse {
  uint64 revision = 1; // Latest full snapshot applied by this session.
}

// ============================================================
// ================ DEBUGLET STREAM MESSAGES ==================
// ============================================================

// ================ EXECUTOR -> DISPATCHER ====================

message HeartbeatRequest {
  string executor_id = 1;
  int64 timestamp_ns = 2;
  int64 tesla_key_epoch = 3;
  bytes tesla_key = 4;
  ExecutorCapabilities capabilities = 5; // Absent means no new observation.
  VantagePointReport vantage_point = 6; // Absent means no new observation.
  // Anchor k_0 of the chain tesla_key belongs to. Empty means the chain this
  // session announced in its hello. A different anchor names an earlier chain
  // of this executor that the dispatcher has on record, so the tail of a chain
  // can still be disclosed after the executor restarted onto a new one.
  bytes tesla_key_anchor = 7;
  // Keys of earlier chains of this executor that are due now, beside the
  // current chain's key above: after a restart, the tail of the chain it
  // retired. Each names its chain by anchor, as tesla_key_anchor does.
  repeated TeslaDisclosure extra_disclosures = 8;
}
// One disclosed chain key k_epoch of the chain whose anchor k_0 is anchor.
message TeslaDisclosure {
  bytes anchor = 1;
  int64 epoch = 2;
  bytes key = 3;
}
message HeartbeatResponse {}

message ResourcesRequest {
  string executor_id = 1;
  int64 bandwidth_capacity = 2; // Bandwidth capacity (bits/s) the executor can handle
}
message ResourcesResponse {}

// The states of a debuglet from when a debuglet is set to start until before it exits
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_INITIALIZING = 1;
  RUN_STATE_STARTED = 2;
}

message DebugletStateRequest {
  string debuglet_id = 1;
  string executor_id = 2;
  RunState state = 3;
  ListenerEndpoint tcp_listener = 4; // Bound run listener; not evidence of external reachability.
}
message ListenerEndpoint { string address = 1; }
message DebugletStateResponse {}

message DebugletAllocateRequest {
  string debuglet_id = 1;
  string executor_id = 2;
  string transaction_id = 3;
  DebugletPolicy policy = 4;
}
// The dispatcher may directly respond with updated limits
message DebugletAllocateResponse {
  repeated DestinationLimit allocated_limits = 1;
}

message DebugletExitRequest {
  string debuglet_id = 1;
  int32 exit_code = 2;
  optional string error_message = 3;
}
message DebugletExitResponse {}

// Initially sent through a debuglet stream to identify the debuglet and executor. After that, the debuglet can send output messages through the same stream.
message DebugletIdent {
  string debuglet_id = 1;
  string executor_id = 2;
  ControlBinding original_binding = 3;
}
message DebugletOutput {
  bytes output = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 sequence = 3;
}
enum DebugletOutputStatus {
  DEBUGLET_OUTPUT_STATUS_UNSPECIFIED = 0;
  DEBUGLET_OUTPUT_STATUS_COMPLETE = 1;
  DEBUGLET_OUTPUT_STATUS_TRUNCATED = 2;
}
message DebugletOutputEnd {
  int64 last_sequence = 1;
  DebugletOutputStatus status = 2;
  string reason = 3;
}
message DebugletStreamRequest {
  oneof msg {
    DebugletIdent ident = 1;
    DebugletOutput output = 2;
    DebugletOutputEnd end = 3;
  }
}

// ================ DISPATCHER -> DEBUGLET ====================

message DebugletStreamResponse {
  int64 committed_sequence = 1;
  DebugletOutputEnd end = 2;
}

// Nonsecret immutable run ownership. The bearer token stays in transport state.
message ControlBinding {
  string dispatcher_incarnation = 1;
  string session_id = 2;
}

// Confirmation uses binding metadata on the separate direct channel.
message BindSessionRequest {
  string executor_id = 1;
}
message BindSessionResponse {
  int64 lease_duration_ms = 1; // Original initial lease; repeats never rearm it.
}

// Binding metadata selects the executor/session. Zero is reserved for Bind;
// ordinary renewal sequences strictly increase within that session.
message RenewLeaseRequest {
  uint64 sequence = 1;
}
message RenewLeaseResponse {
  uint64 sequence = 1;
  int64 lease_duration_ms = 2;
}
message ProbeSessionRequest {
  uint64 sequence = 1;
}
message ProbeSessionResponse {
  uint64 sequence = 1;
}

// =============== RETAINED RUN INSPECTION ====================

// Why a retained-run lookup produced no metadata. A filtered miss means the
// executor holds a row it deliberately excluded; it is not proof that the
// requested work never existed.
enum RetainedRunStatus {
  RETAINED_RUN_STATUS_UNSPECIFIED = 0;
  RETAINED_RUN_STATUS_FOUND = 1;
  RETAINED_RUN_STATUS_FILTERED = 2;
  RETAINED_RUN_STATUS_ABSENT = 3;
}

// Identity, original ownership and start marker of one stored run. Inspection
// never reads the stored program or its arguments.
message RetainedRun {
  string debuglet_id = 1;
  ControlBinding original_binding = 2; // Empty fields for rows stored before run bindings existed.
  string transaction_id = 3;
  bool started = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp start_time = 6;
}

message InspectRetainedRunRequest {
  string debuglet_id = 1;
  ControlBinding control_binding = 2; // The caller's own current session.
}
message InspectRetainedRunResponse {
  RetainedRunStatus status = 1;
  optional RetainedRun run = 2; // Present exactly when status is FOUND.
}

// Pre-disclosure verification of one packet group (docs/verification.md, server method).
// The executor answers for the whole group and never returns tags or keys.
message VerifyTagsRequest {
  ControlBinding control_binding = 1; // Same rule as InspectRetainedRun: names the armed session.
  bytes chain_anchor = 2;             // k_0 of the chain the epoch belongs to.
  int64 epoch = 3;                    // The epoch the packets were captured in (verifier's mapping).
  repeated string candidate_run_ids = 4; // At most 32 canonical lowercase run IDs active from the source.
  repeated bytes packets = 5;         // At most 256 entries, each the first min(64, Total Length) bytes of the captured IPv4 packet, tag in place.
}
message VerifyTagsResponse {
  string verdict = 1; // matched, unmatched, ambiguous or unsupported.
  string run_id = 2;  // The one candidate that reproduces every tag, when matched.
  string reason = 3;  // For unsupported: unknown_chain, epoch_unavailable, attribution_unavailable, too_many, malformed.
}

// ============================================================
// ====================== SERVICE DEFS ========================
// ============================================================

service DispatcherService {
  // Optional address reflection on this dispatcher's authenticated listener.
  // It returns only the caller's peer address; it cannot initiate a connection.
  rpc ReflectAddress(ReflectAddressRequest) returns (ReflectAddressResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Resources(ResourcesRequest) returns (ResourcesResponse);

  rpc DebugletState(DebugletStateRequest) returns (DebugletStateResponse);
  // Request resource allocation before a debuglet starts. The dispatcher can then have the caller wait until the resources have been allocated.
  rpc DebugletAllocate(DebugletAllocateRequest) returns (DebugletAllocateResponse);
  rpc DebugletExit(DebugletExitRequest) returns (DebugletExitResponse);
  rpc DebugletStream(stream DebugletStreamRequest) returns (stream DebugletStreamResponse);
  rpc BindSession(BindSessionRequest) returns (BindSessionResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
}

service ExecutorService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
  rpc Bandwidth(BandwidthRequest) returns (BandwidthResponse);
  rpc ProbeSession(ProbeSessionRequest) returns (ProbeSessionResponse);
  // Optional. Reads one retained run without scheduling, starting, finalizing
  // or deleting it. An executor without inspection answers UNIMPLEMENTED,
  // which is never a missing-row answer.
  rpc InspectRetainedRun(InspectRetainedRunRequest) returns (InspectRetainedRunResponse);
  rpc VerifyTags(VerifyTagsRequest) returns (VerifyTagsResponse);
}

// Positive process capabilities observed by this executor. These are not
// destination reachability or admission guarantees. Unknown versions are ignored.
message ExecutorCapabilities {
  uint32 schema_version = 1;
  repeated string protocols = 2;
  string enforcement_mode = 3; // Actual packet counter: ebpf or fallback; empty unknown.
  // Additive within schema version 1: absent from older executors, which
  // leaves attribution unknown.
  AttributionState attribution = 4;
  // Additive within schema version 1: absent from older executors, which
  // leaves the tagging mode unknown.
  TaggingMode tagging = 5;
  // Additive within schema version 1; empty or absent is unknown.
  // Why the counter is fallback: configured, no_interface, not_permitted,
  // unsupported or attach_failed. Empty when enforcement_mode is ebpf.
  string enforcement_reason = 6;
  ProbeState icmp = 7; // Raw ICMPv4 socket probe of this process.
}

// A local probe outcome. Opening a socket sends nothing.
message ProbeState {
  string state = 1;  // available or unavailable.
  string reason = 2; // Empty when available; disabled, not_permitted, ping_socket_only or unsupported.
}

// How the packets of a run on this executor are tagged, per address family
// and for SCION: ebpf (the kernel tagger, every packet of a marked socket),
// userspace (the pure-Go tagger, IPv4 UDP and ICMP datagrams only) or none.
// It is the node's capability, the mode a run on this executor is set up to
// get, not the mode of any particular run. IPv6 and SCION are none in this
// build.
message TaggingMode {
  string ipv4 = 1;
  string ipv6 = 2;
  string scion = 3;
  // Additive: the packet-tag specification of every tagged family,
  // debuglet-tag-v1 in this build (docs/tag-spec.md). Empty is unknown,
  // including executors that predate it; it is set even when no family is
  // tagged.
  string tag_spec = 4;
}

// Whether packets tagged now can be attributed once their TESLA key is
// disclosed, and the kernel key-refresh state that decides it. Ages are
// measured on the executor's clock when the report was built.
message AttributionState {
  string state = 1;  // available or unavailable.
  string reason = 2; // Empty when available; epoch_zero, chain_exhausted, refresh_failing, disclosure_held, clock_unready or clock_drift.
  int64 epoch = 3;   // Current key-schedule epoch.
  optional int64 installed_epoch = 4;     // Oldest epoch a kernel tagger slot may still sign with; absent when none holds a key.
  optional int64 last_refresh_age_ms = 5; // Since the oldest last successful kernel key install; absent without one.
  string refresh_error = 6;               // Short error of a failing kernel key refresh, at most 128 bytes; empty when none fails.
  optional int64 disclosure_held_ms = 7;  // How long an installed key has held disclosure back; absent when not held.
}

// Executor-reported network context, a versioned sibling of
// ExecutorCapabilities on the same cadence. Every field is a claim of the
// executor; the dispatcher never labels it verified.
message VantagePointReport {
  uint32 schema_version = 1;
  string scion_isd_as = 2; // Local ISD-AS from the SCION daemon; empty unknown.
  repeated string listeners = 3; // Listener transports it can open: tcp, udp, scion.
  // Additive within schema version 1; absent is unknown. The dispatcher
  // clears a malformed field alone and keeps the rest of the report.
  ClockState clock = 4;
  HostPlatform platform = 5; // Operator only; never in the public executor listing.
  bool location_opt_out = 6; // Suppress automatic GeoIP publication; false for older peers.
  ConnectivityReport connectivity = 7; // Optional bounded observation attempt.
  string scion_host = 8; // Local host selected toward the configured SCION control service.
  string scion_path_target = 9; // Operator-configured remote ISD-AS; empty untested.
  ProbeState scion_paths = 10; // Daemon path availability, not data-plane reachability.
  HostResources resources = 11; // Process and state-filesystem observations; operator metrics only.
  string counter_attachment = 12; // present, missing or unknown: owned TCX links, not proof of packet policing.
}

message HostResourceValue {
  optional uint64 value = 1;
  string unavailable = 2; // missing, permission, read, limit, invalid or unsupported; empty with value.
}

// Collected sequentially, not an atomic host snapshot. A missing field is unknown.
message HostResources {
  HostResourceValue process_rss_bytes = 1;
  HostResourceValue open_fds = 2;
  HostResourceValue state_available_bytes = 3;
  HostResourceValue state_capacity_bytes = 4;
}

message ReflectAddressRequest {
  string executor_id = 1;
  bytes nonce = 2; // 32 random bytes linking this receipt to one report; never published.
}
message ReflectAddressResponse { string address = 1; }

message EgressTest {
  string state = 1; // reachable, unreachable or untested.
  string reason = 2;
  bytes nonce = 3; // Correlated with a directly received ReflectAddress call.
}
message ListenerChallenge {
  string transport = 1; // tcp or udp.
  uint32 port = 2; // Sampled from the executor's actual guest listener pool.
  bytes token = 3; // 32 random bytes proving this temporary listener; never published.
}
message ConnectivityReport {
  EgressTest ipv4 = 1;
  EgressTest ipv6 = 2;
  repeated ListenerChallenge listeners = 3; // At most one TCP and one UDP sample.
  bool listeners_enabled = 4; // False means no connect-back test was requested.
  string tcp_reason = 5; // disabled or bind_failed when no challenge is present.
  string udp_reason = 6;
}

// The kernel clock discipline as read by adjtimex without changing it.
message ClockState {
  string state = 1;                      // synced, unsynced or unknown.
  optional int64 estimated_error_ns = 2; // Kernel esterror; absent unknown.
  optional int64 max_error_ns = 3;       // Kernel maxerror; absent unknown.
  int64 error_bound_ns = 4;              // The operator's configured bound on estimated_error_ns.
  string readiness = 5;                  // ready, degraded or unknown.
  string reason = 6;                     // Empty unless degraded: unsynced or error_exceeds_bound.
}

// Host platform facts. Empty or zero fields are unknown.
message HostPlatform {
  string os = 1;             // Go GOOS.
  string arch = 2;           // Go GOARCH.
  string kernel_release = 3; // uname release.
  uint32 cpus = 4;           // Logical CPUs usable by the process.
  optional uint64 memory_bytes = 5; // Total physical memory.
  string build_version = 6;  // Executor build version.
}
