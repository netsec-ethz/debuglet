  /debuglet:
    put:
      operationId: "submitDebuglets"
      summary: "Submit a paid batch of debuglets."
      description: "Admits the debuglets of one completed transaction. The server hashes the decoded debuglets array and rejects any batch that differs from the one the payment intent was created for. An identical resubmission of a batch this dispatcher already admitted answers 200 with the run IDs it recorded and admits nothing again. The encoded request body must not exceed 33554432 bytes. Explicit retries require API 1.12 and preserve one parent/request identity across intent and submission; reusing that identity with the same frozen request recovers the existing attempt."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDebugletsRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: "string"
      responses:
        "200":
          description: "The debuglet IDs, in the order of the submitted batch."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugletIDList"
        "400":
          description: "Malformed body (invalid_request), a batch that does not match the intent (intent_mismatch), an unpaid transaction (payment_incomplete), an unsupported payment method (unsupported_payment_method), an invalid debuglet (invalid_request), an executor that is not registered or no longer available (unknown_executor), or a policy the dispatcher does not admit, including a reserved window that does not fit or a capability the executor lacks (invalid_policy)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unknown transaction, wrong auth key, a transaction that belongs to another account, or a missing, expired or revoked credential (unauthorized). The four are deliberately indistinguishable."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The scheduler cannot admit the batch within the executor's remaining capacity (capacity_exhausted)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit. Also returned for more than 128 orders, a decoded module over 24 MiB, or a logical stored run over 32 MiB."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The dispatcher could not complete submission (internal_error). When admission committed, admitted_ids contains every durable run ID in request order. Inspect each run state or recovery record; these IDs do not prove upload, execution, cancellation or completion. A missing list leaves admission unknown; do not automatically replay the batch."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The transaction is backed by a chain payment method while blockchain payments are disabled (payments_disabled), or an operator has stopped the admission of new submissions on this dispatcher (service_unavailable). Nothing is admitted or scheduled either way; a payment order that was already paid is refunded, which spends it, so the same batch is refused from then on. When the refund could not be performed the message says the order is still paid and the batch can be submitted again once admission resumes. Output storage capacity exhaustion also answers service_unavailable before upload; inspect the payment order before retrying."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Account request, queued/active reservation or queued-byte quota reached (account_quota_exceeded). Retry-After seconds only for request rate; no time promise for work quota."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
            Retry-After:
              description: "Optional integer seconds for request-rate refusal only; absent for work reservation quota."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: "cancelDebuglet"
      summary: "Ask the dispatcher to abort a debuglet."
      description: "A 204 acknowledges the cancellation request and says that its result is recorded, or that the debuglet already had a terminal result, which is kept. It does not certify remote termination."
