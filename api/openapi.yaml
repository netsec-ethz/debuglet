      description: "Entries, workload state and output finality come from one database snapshot. A terminal workload does not imply complete output. Output metadata was added in API 1.6; older servers omit it."
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Canonical 36-character debuglet UUID, in lowercase as submission returns it."
