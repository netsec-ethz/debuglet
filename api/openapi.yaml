                $ref: "#/components/schemas/UserIDList"
        "400":
          description: "The Debuglet-API-Version request header requires a contract version this dispatcher does not serve (unsupported_api_version). This route has no other documented 400."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request presented no credential, or one that is unknown, expired or revoked (unauthorized). A dispatcher serving the local development profile also serves this route without a credential."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The authenticated account is not an operator (forbidden), or a cookie-authenticated state change did not repeat its CSRF token."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The UUIDs could not be read."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /connection:
    get:
      operationId: "getConnection"
      summary: "Read the local control listeners announced by the dispatcher."
      description: "Optional route. It exists only when the dispatcher was started with local connection metadata; other deployments answer 404. It is not a dispatcher directory and grants no access."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "The announced local listeners."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionInfo"
        "400":
          description: "The Debuglet-API-Version request header requires a contract version this dispatcher does not serve (unsupported_api_version). This route has no other documented 400."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The dispatcher announces no local connection metadata."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "A session token from /auth/login, presented as \"Authorization: Bearer <token>\". This is what a native client uses; it is not ambient authority, so it needs no CSRF token."
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "session_token"
      description: "The same session token in a cookie, for a browser client. A state-changing request authenticated this way must repeat the session's CSRF token, returned as csrf_token and set in the session_csrf cookie, in the X-Debuglet-CSRF header."
  schemas:
    Error:
      type: object
      description: "Error envelope of every failure. Branch on code; message is a bounded diagnostic for a human and must not be parsed. A minor version may add codes, so treat an unknown code as a plain failure of the status it arrived with."
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Stable machine-readable failure code."
          enum:
            - "invalid_request"
            - "invalid_policy"
            - "unknown_executor"
            - "intent_mismatch"
            - "payment_incomplete"
            - "unsupported_payment_method"
            - "payments_disabled"
            - "unsupported_api_version"
            - "unauthorized"
            - "forbidden"
            - "not_found"
            - "capacity_exhausted"
            - "cancel_refused"
            - "method_not_allowed"
            - "unsupported_media_type"
            - "payload_too_large"
            - "internal_error"
            - "service_unavailable"
        message:
          type: string
          description: "Bounded human-readable diagnostic. Never carries a credential, a stack trace or internal database or transport detail."
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - api_version
        - api_versions
        - binary_version
        - protocol_version
      properties:
        version:
          type: string
          description: "The dispatcher's configured version string. Retained for clients written before the API contract was versioned; equal to binary_version unless the build sets a distribution version."
        api_version:
          type: string
          description: "Version of this HTTP contract, as major.minor."
        api_versions:
          type: array
          description: "Major contract versions this dispatcher serves."
          items:
            type: string
        binary_version:
          type: string
          description: "Distribution version of the dispatcher binary."
        binary_revision:
          type: string
          description: "Source revision of the dispatcher binary. Absent when the build did not record one."
        protocol_version:
          type: string
          description: "Executor control protocol version spoken by this dispatcher. It is not part of the HTTP contract."
    ProbeResponse:
      type: object
      additionalProperties: false
      description: "Answer of the liveness and readiness probes. status is ok when the probe passes and unready when it does not. reasons lists the failed checks with fixed identifiers, admission_paused, storage_unavailable and control_unavailable, and is present only on a refusal; a minor version may add identifiers."
      required:
        - status
      properties:
        status:
          type: string
        reasons:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      additionalProperties: false
      description: "Health observations of one dispatcher. live is true in every served answer, because reaching the route is the liveness check. ready is the decision GET /readyz answers with and reasons its failed checks, empty while ready, with the identifiers of ProbeResponse. storage is ok or degraded, control is ok or unavailable. executors.registered counts the executor registry and executors.eligible the subset whose control session lease is valid now. Nothing here is read from a readiness file or from executor heartbeat telemetry."
      required:
        - live
        - ready
        - reasons
        - storage
        - control
        - executors
      properties:
        live:
          type: boolean
        ready:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        storage:
          type: string
        control:
          type: string
        executors:
          type: object
          additionalProperties: false
          required:
            - eligible
            - registered
          properties:
            eligible:
              type: integer
            registered:
              type: integer
    DebugletPolicyRequest:
      type: object
      description: "Requested network policy. Bandwidth is bits per second."
      additionalProperties: false
      required:
        - floor_bw
        - ceil_bw
        - timeout_ms
      properties:
        floor_bw:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Reserved bandwidth in bits per second, at most 1000000000000000 (1 Pbit/s)."
        ceil_bw:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Maximum bandwidth in bits per second, at most 1000000000000000 (1 Pbit/s). Must be at least floor_bw."
        timeout_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854
          description: "Run budget in milliseconds. Must be positive and at most 9223372036854. The window the run reserves is the start time plus this budget plus ten seconds for the executor's processing delay, and that window must end no later than 2262-04-11. The maximum admits a budget, not a submission: a request whose window does not fit is answered 400 with code invalid_policy even when every field is within its own bounds."
        addresses:
          type: array
          nullable: true
          description: "Destination hosts the debuglet may address. An accidental port is stripped."
          items:
            type: string
        require_icmp:
          type: boolean
        listen_udp:
          type: boolean
        listen_tcp:
          type: boolean
        listen_scion:
          type: boolean
    DebugletRequest:
      type: object
      additionalProperties: false
      required:
        - order_id
        - executor_id
        - wasm
        - policy
      properties:
        order_id:
          type: integer
          format: int64
          description: "Unique within one batch."
        start_time:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9223372036
          description: "Optional start time as Unix seconds, at most 9223372036 (2262-04-11). Absent or null starts the run as soon as the schedule allows, and so does a start time already in the past. The maximum admits a start time, not a submission: the reserved window of start time, timeout_ms and ten seconds must still end no later than 2262-04-11, so a start time near the maximum is admissible only with a budget that fits before it."
        executor_id:
          type: string
          description: "ID of a registered executor."
        args:
          type: array
          description: "Guest arguments. Absent when empty."
          items:
            type: string
        wasm:
          type: string
          format: byte
          description: "Base64-encoded guest module."
        policy:
          $ref: "#/components/schemas/DebugletPolicyRequest"
    SubmitDebugletsRequest:
      type: object
      additionalProperties: false
      required:
        - debuglets
        - transaction_id
        - auth_key
      properties:
        debuglets:
          type: array
          description: "The identical debuglets array the payment intent was created for. It must contain at least one debuglet; an empty array is answered 400 invalid_request."
          items:
            $ref: "#/components/schemas/DebugletRequest"
        transaction_id:
          type: string
        auth_key:
          type: string
          description: "Auth key of the transaction. Empty for TEST transactions."
    DebugletIDList:
      type: array
      description: "Debuglet IDs in the order of the submitted batch."
      items:
        type: string
        format: uuid
    DebugletDeleteRequest:
      type: object
      additionalProperties: false
      required:
        - debuglet_id
        - executor_id
      properties:
        debuglet_id:
          type: string
          format: uuid
        executor_id:
          type: string
    DebugletStateResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - error
        - executor_id
      properties:
        state:
          type: string
          description: "Opaque run state. RunStateExited is terminal."
        error:
          type: string
          description: "Recorded workload error: one line of at most 512 bytes, followed by '...' when it was cut, for results recorded by this version; earlier results are returned as stored. Empty when the run has not failed."
        executor_id:
          type: string
    DebugletLogsResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - after
        - logs
        - has_more
      properties:
        state:
          type: string
          description: "Opaque run state at the time of the query."
        error:
          type: string
          description: "Recorded workload error: one line of at most 512 bytes, followed by '...' when it was cut, for results recorded by this version; earlier results are returned as stored. Absent when empty."
        after:
          type: integer
          format: int64
          description: "Cursor for the next page: the ID of the last returned entry, or the requested cursor for an empty page."
        logs:
          type: array
          nullable: true
          description: "Stored output entries with strictly increasing IDs. Null when the page is empty."
          items:
            $ref: "#/components/schemas/DebugletLogEntry"
        has_more:
          type: boolean
          description: "True when the page was filled to the limit. A full page may report true although no later entry exists."
    DebugletLogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - timestamp
        - output
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          description: "Server timestamp in UTC, formatted as 2006-01-02T15:04:05Z."
        output:
          type: string
          format: byte
          description: "Base64-encoded guest output bytes."
    DebugletResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - start_time
        - end_time
        - usage
        - executor_id
        - addresses
        - state
      properties:
        id:
          type: string
          format: uuid
        start_time:
          type: integer
          format: int64
          description: "Scheduled start as Unix seconds."
        end_time:
          type: integer
          format: int64
          description: "Scheduled end as Unix seconds."
        usage:
          type: integer
          format: int64
          description: "Bandwidth reserved for the run, in bits per second. It is the floor_bw the debuglet was admitted with, not a measured consumption."
        executor_id:
          type: string
        addresses:
          type: array
          nullable: true
          items:
            type: string
        state:
          type: string
    DebugletList:
      type: array
      items:
        $ref: "#/components/schemas/DebugletResponse"
    ExecutorResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - ready
        - last_seen
        - version
        - tesla_delay_sec
        - tesla_anchor_timestamp_ns
        - tesla_anchor_key
        - price_per_bw
        - currency
      properties:
        id:
          type: string
        ready:
          type: boolean
        last_seen:
          type: integer
          format: int64
          description: "Unix seconds of the last observed contact."
        version:
          type: string
          description: "Version string announced by the executor."
        tesla_delay_sec:
          type: integer
          format: int64
          description: "TESLA epoch duration in seconds."
        tesla_anchor_timestamp_ns:
          type: integer
          format: int64
          description: "Unix nanoseconds of TESLA epoch 0."
        tesla_anchor_key:
          type: string
          format: byte
          nullable: true
          description: "Base64-encoded public chain anchor k_0. Null when the executor announced none."
        price_per_bw:
          type: integer
          format: int64
          description: "Price per bit per second and second of run time, in the executor's currency. An order costs price_per_bw × floor_bw × timeout_ms / 1000, rounded up to the next whole unit."
        currency:
          type: string
    ExecutorList:
      type: array
      nullable: true
      description: "Null when no executor is registered."
      items:
        $ref: "#/components/schemas/ExecutorResponse"
    ExecutorByIPResponse:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - debuglet_ids
      properties:
        executor_id:
          type: string
        debuglet_ids:
          type: array
          description: "Most recent debuglet IDs, newest first. An executor with no dispatch history reports an empty array."
          items:
            type: string
            format: uuid
    ExecutorTeslaResponse:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - anchor_key
        - anchor_timestamp_ns
        - delay_sec
        - disclosed_epoch
        - disclosed_key
      properties:
        executor_id:
          type: string
        anchor_key:
          type: string
          format: byte
          description: "Base64-encoded k_0. Empty when the executor announced none."
        anchor_timestamp_ns:
          type: integer
          format: int64
          description: "Unix nanoseconds of epoch 0."
        delay_sec:
          type: integer
          format: int64
          description: "Epoch duration in seconds."
        disclosed_epoch:
          type: integer
          format: int64
          description: "Index of the latest disclosed key, 0 when none was disclosed."
        disclosed_key:
          type: string
          format: byte
          description: "Base64-encoded latest disclosed key. Empty when none was disclosed."
    DestinationLimitRequest:
      type: object
      additionalProperties: false
      required:
        - destination
        - limit
      properties:
        destination:
          type: string
        limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Bandwidth limit in bits per second, at most 1000000000000000 (1 Pbit/s). It becomes the capacity the runs of the destination are shared out of, so it is held to the same range as the bandwidth of a policy."
    PaymentIntentRequest:
      type: object
      additionalProperties: false
      required:
        - debuglets
        - payment_method
      properties:
        debuglets:
          type: array
          description: "The debuglets the intent pays for. It must contain at least one debuglet; an empty array is answered 400 invalid_request."
          items:
            $ref: "#/components/schemas/DebugletRequest"
        payment_method:
          type: string
          description: "TEST for the local alpha's bookkeeping-only method, or USDC."
        refund_address:
          type: string
          description: "Chain address for refunds. Empty for TEST."
    IntentResponse:
      type: object
      additionalProperties: false
      required:
        - method
        - intent
      properties:
        method:
          type: string
          description: "The payment method the intent was created for."
        intent:
          description: "Method-specific intent."
          oneOf:
            - $ref: "#/components/schemas/DummyIntent"
            - $ref: "#/components/schemas/SuiIntent"
    DummyIntent:
      type: object
      description: "Intent of the TEST method. It records bookkeeping only and moves no funds."
      additionalProperties: false
      required:
        - transaction_id
        - auth_key
      properties:
        transaction_id:
          type: string
          description: "16 random bytes, hex-encoded."
        auth_key:
          type: string
          description: "Empty for TEST transactions."
    SuiIntent:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - auth_key
        - price
        - coin_type
        - expires_at_s
        - registry_address
        - receiver_address
      properties:
        transaction_id:
          type: string
        auth_key:
          type: string
          description: "Secret that authorizes the following submission. Never log or echo it."
        price:
          type: integer
          format: int64
        coin_type:
          type: string
        expires_at_s:
          type: integer
          format: int64
          description: "Expiry as Unix seconds."
        registry_address:
          type: string
        receiver_address:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          description: "What the account may do. An ordinary account reaches its own runs; an operator additionally reaches the dispatcher-wide operations. The value is a report, not a credential, and a minor version may add roles."
          enum:
            - "user"
            - "operator"
    AccountResponse:
      type: object
      description: "An account together with the credentials just issued for it. Both credentials are returned exactly once, by the operation that minted them. Store them where only their owner can read them; the dispatcher keeps only their digests."
      additionalProperties: false
      required:
        - id
        - name
        - role
        - account_key
        - recovery_code
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - "user"
            - "operator"
        account_key:
          type: string
          description: "The long-lived credential of this account, exchanged for a session at /auth/login. It is not a session and is never presented on an ordinary request."
        recovery_code:
          type: string
          description: "The credential that replaces both credentials of this account at /auth/recover. It names this account and can name no other."
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - account_key
      properties:
        account_key:
          type: string
          description: "The account key to exchange for a session. An empty value asks a dispatcher serving the local development profile for a credential for its own local account; every other dispatcher answers 401."
    RecoverRequest:
      type: object
      additionalProperties: false
      required:
        - recovery_code
      properties:
        recovery_code:
          type: string
          description: "The recovery code of the account whose credentials are to be replaced."
    EmptyRequest:
      type: object
      description: "A body with no fields. The route reads nothing from it."
      additionalProperties: false
    SessionResponse:
      type: object
      description: "An issued session. It expires at expires_at and is not extended by use."
      additionalProperties: false
      required:
        - token
        - csrf_token
        - expires_at
        - id
        - name
        - role
      properties:
        token:
          type: string
          description: "The session credential. A native client repeats it as an Authorization bearer token; the same value is also set in the session_token cookie."
        csrf_token:
          type: string
          description: "The token a cookie-authenticated client repeats in the X-Debuglet-CSRF header of every state-changing request. It authenticates nothing on its own, and a bearer client does not need it."
        expires_at:
          type: integer
          format: int64
          description: "Unix seconds at which this session stops being accepted."
        id:
          type: string
          format: uuid
          description: "Identifier of the account this session acts as."
        name:
          type: string
        role:
          type: string
          enum:
            - "user"
            - "operator"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    UserIDList:
      type: array
      items:
        type: string
        format: uuid
    ConnectionInfo:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - mode
        - grpc_address
        - yamux_address
      properties:
        schema_version:
          type: integer
          description: "Currently 1."
        mode:
          type: string
          description: "Currently local-test."
        grpc_address:
          type: string
          description: "Loopback host:port of the control gRPC listener."
        yamux_address:
          type: string
          description: "Loopback host:port of the multiplexed control listener."
