  /auth/login:
    post:
      operationId: "login"
      summary: "Exchange an account key for a session."
      description: "Verifies the account key of one account and issues a session for it. The returned token is the bearer credential a native client repeats in the Authorization header; the same token is also set in the session_token cookie, together with the session's CSRF token in session_csrf, for a browser client. A session expires 12 hours after it was issued and is not extended by use: a client logs in again. Nothing else is a login credential: a user identifier, a debuglet identifier and a payment auth key are all refused here. An empty account_key is the local development bootstrap and is served only by a dispatcher explicitly configured for local development."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "The issued session."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: "Malformed body, or a contract version this dispatcher does not serve."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The account key is unknown, or it is empty on a dispatcher that does not serve the local development profile. The two are deliberately indistinguishable."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The session could not be issued."
          headers:
