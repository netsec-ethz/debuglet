  /destination:
    patch:
      operationId: "setDestinationLimit"
      summary: "Set the bandwidth limit of one destination."
      description: "An operator operation outside the researcher-facing flow. It records the limit, which applies to admission at once, and pushes the share it recomputes to every executor holding an allocation on the destination, with a five-second delivery timeout. Repeating the request records the same limit and pushes it again. Pushes are unversioned: concurrent updates can arrive out of order, so an older share can overwrite a newer, lower one at an executor. This route does not guarantee revocation."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationLimitRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      responses:
        "204":
          description: "The limit was recorded and every executor holding an allocation on the destination acknowledged the recomputed share."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
        "400":
          description: "Malformed body (invalid_request) or a limit outside its documented range (invalid_policy)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request presented no credential, or one that is unknown, expired or revoked (unauthorized). A dispatcher serving the local development profile also serves this route without a credential."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The authenticated account is not an operator (forbidden), or a cookie-authenticated state change did not repeat its CSRF token."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The limit is below the floors admitted on the destination, charged to active allocations or reserved by the scheduler for admitted runs (capacity_exhausted). Nothing was recorded or pushed; the runs keep their floors, and the limit can be lowered once they release them."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The limit was recorded but at least one executor holding an allocation on the destination did not acknowledge the recomputed share (internal_error). The request may be repeated."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
