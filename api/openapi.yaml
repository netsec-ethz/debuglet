  /destination:
    patch:
      operationId: "setDestinationLimit"
      summary: "Set the bandwidth limit of one destination."
      description: "An operator operation outside the researcher-facing flow. It records the limit, which applies to admission at once, and pushes the share it recomputes to every executor holding an allocation on the destination, with a five-second delivery timeout. Repeating the request records the same limit and pushes it again. Current executors apply acknowledged full snapshots in session revision order, so an older delivery cannot overwrite a newer one. Failed application stays pending and is retried on that exact session’s heartbeat. Legacy executors may receive the limit but cannot confirm ordered application; the response instructs the operator to upgrade them. This route does not guarantee workload revocation."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationLimitRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      responses:
        "204":
          description: "The limit was recorded and every executor holding an allocation on the destination acknowledged the recomputed share."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
        "400":
          description: "Malformed body (invalid_request) or a limit outside its documented range (invalid_policy)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request presented no credential, or one that is unknown, expired or revoked (unauthorized). A dispatcher serving the local development profile also serves this route without a credential."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The authenticated account is not an operator (forbidden), or a cookie-authenticated state change did not repeat its CSRF token."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The limit is below the floors admitted on the destination, charged to active allocations or reserved by the scheduler for admitted runs (capacity_exhausted). Nothing was recorded or pushed; the runs keep their floors, and the limit can be lowered once they release them."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The limit was recorded but at least one executor did not acknowledge ordered application (internal_error). Pending delivery is retried on heartbeat; the request may also be repeated. Legacy peers require an executor upgrade first."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payment/intent:
    put:
      operationId: "createPaymentIntent"
      summary: "Create a payment intent for a batch of debuglets."
      description: "Prices the batch and, once every order has been validated and priced, stores one outstanding order per debuglet and returns the transaction ID and auth key used by the following submission. The HTTP API admits the methods TEST and USDC; TEST is the local alpha's bookkeeping-only method. The encoded request body must not exceed 33554432 bytes. Explicit retries require API 1.12 and preserve one parent/request identity across intent and submission; reusing that identity with the same frozen request recovers the existing attempt."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: "string"
      responses:
        "200":
          description: "The created intent."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponse"
        "400":
          description: "Malformed body, an empty batch, or a missing or invalid USDC refund_address (invalid_request; an address refusal includes field_errors with field refund_address and code invalid_address), an unsupported payment method (unsupported_payment_method), an unknown executor (unknown_executor), or an invalid policy, a repeated order_id or a price that does not fit a signed 64-bit integer (invalid_policy). Nothing is written in any of these cases."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request presented no credential, or one that is unknown, expired or revoked (unauthorized). A dispatcher serving the local development profile also serves this route without a credential."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit. Also returned for more than 128 orders, a decoded module over 24 MiB, or a logical stored run over 32 MiB."
          headers:
            Debuglet-API-Version:
