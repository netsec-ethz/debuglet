                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: "logout"
      summary: "Revoke the session the request authenticated with."
      description: "Revokes the presented session before its expiry and clears the browser cookies. The token is refused from then on. A request that authenticated with no session revokes nothing."
