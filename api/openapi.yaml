      operationId: "startGitHubLogin"
      summary: "Start browser login with GitHub."
      description: "When GitHub OAuth is enabled, sets a short-lived HttpOnly state cookie and redirects to GitHub. The callback and final console URL are fixed by deployment configuration."
      security: []
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: string
      responses:
