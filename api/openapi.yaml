  /debuglet/{id}/payload:
    delete:
      operationId: "deleteDebugletPayload"
      summary: "Delete a completed measurement payload while preserving identity and outcome."
      description: "API 1.12. Owner-only; operator read privilege does not grant deletion of another account. Ownerless local TEST runs require the explicit local profile. Requires terminal state, authenticated executor retirement and final output. Repeated deletion returns 204. Cancellation is a separate operation. Payload removal preserves immutable digest tombstones, run/order/transaction/ownership references and the original outcome."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
        - name: "X-Debuglet-CSRF"
          in: "header"
          required: false
          description: "Required for cookie-authenticated mutations; not for bearer requests."
          schema:
            type: "string"
      responses:
        "204":
          description: "Payload deleted or already deleted."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
        "400":
          description: "Invalid canonical UUID or unsupported API version."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "No valid credential (unauthorized)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Missing or invalid CSRF token (forbidden)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Unknown run or caller is not its owner (not_found)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Completed output or confirmed executor retirement is missing (payload_not_deletable)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body exceeds 33554432 bytes (payload_too_large)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Storage/retention could not be checked or committed (internal_error)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "A session token from /auth/login, presented as \"Authorization: Bearer <token>\". This is what a native client uses; it is not ambient authority, so it needs no CSRF token."
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "session_token"
      description: "The same session token in a cookie, for a browser client. A state-changing request authenticated this way must repeat the session's CSRF token, returned as csrf_token and set in the session_csrf cookie, in the X-Debuglet-CSRF header."
  schemas:
    OwnedExecutor:
      type: "object"
      required:
        - "id"
        - "name"
        - "status"
        - "ready"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          pattern: "^.{1,80}$"
        status:
          type: "string"
          description: "pending means no certificate is bound; offline means enrolled without a ready control session; online means ready. Clients must tolerate future values."
        ready:
          type: "boolean"
        last_seen:
          type: "integer"
          format: "int64"
          description: "Unix seconds of the last available executor observation. Omitted when unknown."
        version:
          type: "string"
    OwnedExecutorList:
      type: "object"
      required:
        - "enabled"
        - "executors"
      properties:
        enabled:
          type: "boolean"
          description: "Whether this dispatcher permits self-service enrollment."
        dispatcher_url:
          type: "string"
          description: "Deployment-configured HTTPS API base URL used by the join command."
        executors:
          type: "array"
          items:
            $ref: "#/components/schemas/OwnedExecutor"
    CreateOwnedExecutor:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          pattern: "^.{1,80}$"
    ExecutorSetup:
      type: "object"
      required:
        - "executor"
        - "token"
        - "expires_at"
        - "dispatcher_url"
      properties:
        executor:
          $ref: "#/components/schemas/OwnedExecutor"
        token:
          type: "string"
          description: "Single-use machine setup credential; keep secret and never place in URL arguments."
        expires_at:
          type: "integer"
          format: "int64"
          description: "Token expiry in Unix seconds."
        dispatcher_url:
          type: "string"
    ExecutorEnrollmentRequest:
      type: "object"
      required:
        - "executor_id"
        - "token"
        - "csr"
      properties:
        executor_id:
          type: "string"
          format: "uuid"
        token:
          type: "string"
          pattern: "^.{1,128}$"
        csr:
          type: "string"
          description: "PEM-encoded certificate signing request, signed with the executor's local private key."
    ExecutorEnrollment:
      type: "object"
      required:
        - "executor_id"
        - "certificate_pem"
        - "ca_pem"
        - "grpc_address"
        - "yamux_address"
      properties:
        executor_id:
          type: "string"
          format: "uuid"
        certificate_pem:
          type: "string"
          description: "PEM client certificate. Its public key matches the submitted CSR."
        ca_pem:
          type: "string"
          description: "PEM CA certificates for validating the returned client certificate. The joining client also preserves the trust used to authenticate the HTTPS dispatcher."
        grpc_address:
          type: "string"
          description: "Deployment-configured host:port for the direct control connection."
        yamux_address:
          type: "string"
          description: "Deployment-configured host:port for the reverse control connection."
    AuthProviders:
      type: "object"
      additionalProperties: false
      required:
        - "providers"
        - "audience"
        - "device_verification_uri"
      properties:
        providers:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "id"
              - "name"
              - "login_url"
              - "enabled"
            properties:
              id:
                type: "string"
              name:
                type: "string"
              login_url:
                type: "string"
              enabled:
                type: "boolean"
        audience:
          type: "string"
        device_verification_uri:
          type: "string"
    IdentityList:
      type: "object"
      additionalProperties: false
      required:
        - "identities"
        - "pending"
        - "reauthentication_required"
      properties:
        identities:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "provider"
              - "issuer"
              - "login"
              - "linked_at"
              - "enabled"
            properties:
              provider:
                type: "string"
              issuer:
                type: "string"
              login:
                type: "string"
              linked_at:
                type: "integer"
                format: "int64"
              enabled:
                type: "boolean"
        pending:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "provider"
              - "login"
              - "expires_at"
            properties:
              provider:
                type: "string"
              login:
                type: "string"
              expires_at:
                type: "integer"
                format: "int64"
        reauthentication_required:
          type: "boolean"
    IdentityConfirmation:
      type: "object"
      additionalProperties: false
      required:
        - "confirm"
      properties:
        confirm:
          type: "boolean"
    IdentityAuthorization:
      type: "object"
      additionalProperties: false
      required:
        - "authorization_url"
      properties:
        authorization_url:
          type: "string"
    CredentialRequest:
      type: "object"
      additionalProperties: false
      required:
        - "audience"
        - "scopes"
        - "label"
      properties:
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        label:
          type: "string"
    CredentialInfo:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "kind"
        - "audience"
        - "scopes"
        - "label"
        - "created_at"
        - "expires_at"
        - "current"
      properties:
        id:
          type: "string"
        kind:
          type: "string"
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        label:
          type: "string"
        created_at:
          type: "integer"
          format: "int64"
        expires_at:
          type: "integer"
          format: "int64"
        current:
          type: "boolean"
    CredentialStatus:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "kind"
        - "audience"
        - "scopes"
        - "created_at"
        - "expires_at"
      properties:
        id:
          type: "string"
        kind:
          type: "string"
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        created_at:
          type: "integer"
          format: "int64"
        expires_at:
          type: "integer"
          format: "int64"
    CredentialList:
      type: "array"
      items:
        $ref: "#/components/schemas/CredentialInfo"
    IssuedCredential:
      type: "object"
      additionalProperties: false
      required:
        - "token"
        - "credential_id"
        - "audience"
        - "scopes"
        - "expires_at"
        - "id"
        - "name"
        - "role"
      properties:
        token:
          type: "string"
        credential_id:
          type: "string"
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        expires_at:
          type: "integer"
          format: "int64"
        id:
          type: "string"
        name:
          type: "string"
        role:
          type: "string"
    DeviceLoginStart:
      type: "object"
      additionalProperties: false
      required:
        - "device_code"
        - "user_code"
        - "verification_uri"
        - "audience"
        - "scopes"
        - "expires_at"
        - "interval"
      properties:
        device_code:
          type: "string"
        user_code:
          type: "string"
        verification_uri:
          type: "string"
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        expires_at:
          type: "integer"
          format: "int64"
        interval:
          type: "integer"
          format: "int64"
    DeviceLoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "device_code"
        - "audience"
      properties:
        device_code:
          type: "string"
        audience:
          type: "string"
    DeviceApprovalRequest:
      type: "object"
      additionalProperties: false
      required:
        - "user_code"
        - "audience"
      properties:
        user_code:
          type: "string"
        audience:
          type: "string"
        confirm:
          type: "boolean"
    DeviceLoginInfo:
      type: "object"
      additionalProperties: false
      required:
        - "user_code"
        - "audience"
        - "scopes"
        - "label"
        - "expires_at"
        - "state"
      properties:
        user_code:
          type: "string"
        audience:
          type: "string"
        scopes:
          type: "array"
          items:
            type: "string"
            enum:
              - "account:read"
              - "executors:read"
              - "executors:write"
              - "measurements:read"
              - "measurements:write"
        label:
          type: "string"
        expires_at:
          type: "integer"
          format: "int64"
        state:
          type: "string"
    DeviceLoginPoll:
      type: "object"
      additionalProperties: false
      required:
        - "state"
      properties:
        state:
          type: "string"
        interval:
          type: "integer"
          format: "int64"
        credential:
          $ref: "#/components/schemas/IssuedCredential"
    Error:
      type: "object"
      description: "Error envelope of every failure. Branch on code; message is a bounded diagnostic for a human and must not be parsed. A minor version may add codes, so treat an unknown code as a plain failure of the status it arrived with."
      additionalProperties: false
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "string"
          description: "Stable machine-readable failure code."
          enum:
            - "invalid_request"
            - "invalid_policy"
            - "unknown_executor"
            - "intent_mismatch"
            - "payment_incomplete"
            - "unsupported_payment_method"
            - "payments_disabled"
            - "unsupported_api_version"
            - "unauthorized"
            - "forbidden"
            - "not_found"
            - "identity_conflict"
            - "capacity_exhausted"
            - "cancel_refused"
            - "method_not_allowed"
            - "unsupported_media_type"
            - "payload_too_large"
            - "internal_error"
            - "service_unavailable"
            - "payload_deleted"
            - "payload_not_deletable"
            - "account_quota_exceeded"
            - "rate_limited"
            - "allowance_exceeded"
            - "conflict"
            - "allowance_out_of_range"
        message:
          type: "string"
          description: "Bounded human-readable diagnostic. Never carries a credential, a stack trace or internal database or transport detail."
        field_errors:
          type: "array"
          description: "At most 16 optional request field failures. Code and field identify a refusal without parsing its message; order_id identifies the order when available."
          items:
            $ref: "#/components/schemas/FieldError"
        admitted_ids:
          type: "array"
          description: "Present only on PUT /debuglet internal_error after durable admission, in request order. Inspect each run for its disposition; admission does not prove execution or completion. Clients must retain uncertainty when this list is absent or invalid."
          items:
            type: "string"
            format: "uuid"
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: "Dotted request field of at most 128 bytes, for example policy.listen_tcp."
        code:
          type: string
          description: "Stable refusal reason of at most 64 bytes. Clients must tolerate new reason codes."
        message:
          type: string
          description: "Human-readable explanation of at most 512 bytes."
        order_id:
          type: integer
          format: int64
    VersionResponse:
      type: object
      additionalProperties: false
      required:
        - version
        - api_version
        - api_versions
        - binary_version
        - protocol_version
      properties:
        version:
          type: string
          description: "The dispatcher's configured version string. Retained for clients written before the API contract was versioned; equal to binary_version unless the build sets a distribution version."
        api_version:
          type: string
          description: "Version of this HTTP contract, as major.minor."
        api_versions:
          type: array
          description: "Major contract versions this dispatcher serves."
          items:
            type: string
        binary_version:
          type: string
          description: "Distribution version of the dispatcher binary."
        binary_revision:
          type: string
          description: "Source revision of the dispatcher binary. Absent when the build did not record one."
        protocol_version:
          type: string
          description: "Executor control protocol version spoken by this dispatcher. It is not part of the HTTP contract."
    ProbeResponse:
      type: object
      additionalProperties: false
      description: "Answer of the liveness and readiness probes. status is ok when the probe passes and unready when it does not. reasons lists the failed checks with fixed identifiers, admission_paused, storage_unavailable and control_unavailable, and is present only on a refusal; a minor version may add identifiers."
      required:
        - status
      properties:
        status:
          type: string
        reasons:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      additionalProperties: false
      description: "Health observations of one dispatcher. live is true in every served answer, because reaching the route is the liveness check. ready is the decision GET /readyz answers with and reasons its failed checks, empty while ready, with the identifiers of ProbeResponse. storage is ok or degraded, control is ok or unavailable. executors.registered counts the executor registry and executors.eligible the subset whose control session lease is valid now. Nothing here is read from a readiness file or from executor heartbeat telemetry."
      required:
        - live
        - ready
        - reasons
        - storage
        - control
        - executors
      properties:
        live:
          type: boolean
        ready:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        storage:
          type: string
        control:
          type: string
        executors:
          type: object
          additionalProperties: false
          required:
            - eligible
            - registered
          properties:
            eligible:
              type: integer
            registered:
              type: integer
    DebugletPolicyRequest:
      type: object
      description: "Requested network policy. Bandwidth is bits per second."
      additionalProperties: false
      required:
        - floor_bw
        - ceil_bw
        - timeout_ms
      properties:
        floor_bw:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Reserved bandwidth in bits per second, at most 1000000000000000 (1 Pbit/s)."
        ceil_bw:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Maximum bandwidth in bits per second, at most 1000000000000000 (1 Pbit/s). Must be at least floor_bw."
        timeout_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854
          description: "Run budget in milliseconds. Must be positive and at most 9223372036854. The window the run reserves is the start time plus this budget plus ten seconds for the executor's processing delay, and that window must end no later than 2262-04-11. The maximum admits a budget, not a submission: a request whose window does not fit is answered 400 with code invalid_policy even when every field is within its own bounds."
        addresses:
          type: array
          nullable: true
          description: "Destination hosts the debuglet may address. An accidental port is stripped."
          items:
            type: string
        require_icmp:
          type: boolean
        listen_udp:
          type: boolean
        listen_tcp:
          type: boolean
        listen_scion:
          type: boolean
    DebugletRequest:
      type: object
      additionalProperties: false
      required:
        - order_id
        - executor_id
        - wasm
        - policy
      properties:
        order_id:
          type: integer
          format: int64
          description: "Unique within one batch."
        start_time:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 9223372036
          description: "Optional start time as Unix seconds, at most 9223372036 (2262-04-11). Absent or null starts the run as soon as the schedule allows, and so does a start time already in the past. The maximum admits a start time, not a submission: the reserved window of start time, timeout_ms and ten seconds must still end no later than 2262-04-11, so a start time near the maximum is admissible only with a budget that fits before it."
        executor_id:
          type: string
          description: "ID of a registered executor."
        args:
          type: array
          description: "Guest arguments. Absent when empty."
          items:
            type: string
        wasm:
          type: string
          format: byte
          description: "Base64-encoded guest module."
        policy:
          $ref: "#/components/schemas/DebugletPolicyRequest"
        "label":
          "type": "string"
          "description": "Optional user label, at most120 UTF-8 bytes."
        "program_name":
          "type": "string"
          "description": "Optional program display name, at most256 UTF-8 bytes."
    SubmitDebugletsRequest:
      type: "object"
      additionalProperties: false
      required:
        - "debuglets"
        - "transaction_id"
        - "auth_key"
      properties:
        debuglets:
          type: "array"
          description: "The identical debuglets array the payment intent was created for. It must contain at least one debuglet; an empty array is answered 400 invalid_request."
          items:
            $ref: "#/components/schemas/DebugletRequest"
        transaction_id:
          type: "string"
        auth_key:
          type: "string"
          description: "Auth key of the transaction. Empty for TEST transactions."
        retry:
          $ref: "#/components/schemas/RetryLink"
    DebugletIDList:
      type: array
      description: "Debuglet IDs in the order of the submitted batch."
      items:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    DebugletDeleteRequest:
      type: object
      additionalProperties: false
      required:
        - debuglet_id
        - executor_id
      properties:
        debuglet_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        executor_id:
          type: string
    DebugletStateResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - error
        - executor_id
      properties:
        state:
          type: string
          description: "Opaque run state. RunStateExited is terminal. RunStateUnreconciled means the dispatcher failed the submission the run belongs to and could not confirm the run's cancellation, because the executor refused it or it was not delivered; the run may still execute, a later report from its executor supersedes the state, and nothing is replayed. A RunStateUploading or RunStateUploaded that no longer changes is of the same uncertain outcome. Window expiry reclaims local allocation capacity without changing the stored state or outcome. Recovery.allocation_reclaimed_at records that separate accounting fact; it does not permit replay or settle payments. A run recorded without a binding is not reclaimed automatically."
        error:
          type: string
          description: "Recorded workload error: one line of at most 512 bytes, followed by '...' when it was cut, for results recorded by this version; earlier results are returned as stored. Empty when the run has not failed."
        executor_id:
          type: string
    Cancellation:
      type: object
      additionalProperties: false
      required:
        - id
        - request_id
        - executor_id
        - original_binding
        - requested_at
        - attempted_at
        - acknowledged_at
        - checked_at
        - disposition
        - reason
        - state
        - error
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          description: "Stable identity of the first cancellation request for this run."
        executor_id:
          type: string
        original_binding:
          $ref: "#/components/schemas/RecoveryOriginalBinding"
        requested_at:
          type: string
          format: date-time
        attempted_at:
          type: string
          format: date-time
          nullable: true
          description: "First recorded delivery attempt; does not establish executor receipt."
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
          description: "Persisted successful executor Abort reply. Null means acknowledgement is unknown."
        checked_at:
          type: string
          format: date-time
        disposition:
          type: string
          description: "requested, delivery_attempted, acknowledged, not_needed (the run was already terminal; reason already_terminal) or unresolved. Unknown future values remain observations, never replay advice."
        reason:
          type: string
          description: "Empty or a bounded code: already_terminal (no delivery needed), original_binding_unavailable, transport_outcome_unknown or executor_refused."
        state:
          type: string
          description: "Stored run state, independently of the cancellation acknowledgement."
        error:
          type: string
          description: "Stored run result, never replaced by inspection."
    Recovery:
      type: object
      additionalProperties: false
      required:
        - id
        - executor_id
        - state
        - error
        - checked_at
        - original_binding
        - control_status
        - observation
      properties:
        id:
          type: string
          format: uuid
        executor_id:
          type: string
        state:
          type: string
          description: "Last stored run state, independent of control availability."
        error:
          type: string
          description: "Last stored workload error, unchanged by inspection."
        checked_at:
          type: string
          format: date-time
          description: "Dispatcher UTC time of the final availability check."
        original_binding:
          $ref: "#/components/schemas/RecoveryOriginalBinding"
        control_status:
          type: string
          description: "current: original session available at check; unavailable: original session unavailable; legacy: no complete original binding. Unknown future strings do not authorize replay."
        allocation_reclaimed_at:
          type: string
          format: date-time
          description: "Added in API 1.14. Local allocation/floor capacity was reclaimed after the reserved window; this does not assert a workload outcome, permit replay, release retained-work quotas or settle payment. Absent until recorded."
        observation:
          $ref: "#/components/schemas/RecoveryObservation"
    RecoveryOriginalBinding:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - dispatcher_incarnation
        - session_id
      properties:
        dispatcher_incarnation:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
    RecoveryObservation:
      type: object
      additionalProperties: false
      required:
        - classification
        - observer
        - received_at
        - current_at_check
        - retained
      properties:
        classification:
          type: string
          description: "not_attempted, unavailable, unsupported, failed and invalid carry null provenance. retained_unstarted, started_unknown and legacy carry validated retained metadata. absent and filtered carry valid reply provenance but no retained metadata; neither proves work never executed. Future classifications must be preserved and never treated as permission to replay."
        observer:
          $ref: "#/components/schemas/RecoveryObserver"
        received_at:
          type: string
          format: date-time
          nullable: true
          description: "Dispatcher UTC receive time of the validated reply; null without one."
        current_at_check:
          type: boolean
          nullable: true
          description: "Whether the captured observer remained current at checked_at. False preserves a historical reply; null without a validated reply."
        retained:
          $ref: "#/components/schemas/RetainedRun"
    RecoveryObserver:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - executor_id
        - binding
      properties:
        executor_id:
          type: string
        binding:
          type: object
          additionalProperties: false
          required:
            - dispatcher_incarnation
            - session_id
          properties:
            dispatcher_incarnation:
              type: string
              format: uuid
            session_id:
              type: string
              format: uuid
    RetainedRun:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - original_binding
        - started
        - started_at
        - start_time
      properties:
        original_binding:
          $ref: "#/components/schemas/RecoveryOriginalBinding"
        started:
          type: boolean
          description: "Durable start marker, not proof that the guest ran."
        started_at:
          type: string
          format: date-time
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
    DebugletLogsResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - after
        - logs
        - has_more
        - output
      properties:
        state:
          type: string
          description: "Opaque run state at the time of the query, with the meaning described for DebugletStateResponse.state: RunStateUnreconciled, or a RunStateUploading or RunStateUploaded that no longer changes, is of uncertain outcome, and local allocation reclamation after the reserved window does not change that stored outcome."
        error:
          type: string
          description: "Recorded workload error: one line of at most 512 bytes, followed by '...' when it was cut, for results recorded by this version; earlier results are returned as stored. Absent when empty."
        after:
          type: integer
          format: int64
          description: "Cursor for the next page: the ID of the last returned entry, or the requested cursor for an empty page."
        logs:
          type: array
          nullable: true
          description: "Stored output entries with strictly increasing IDs. Null when the page is empty."
          items:
            $ref: "#/components/schemas/DebugletLogEntry"
        has_more:
          type: boolean
          description: "True when the page was filled to the limit. A full page may report true although no later entry exists."
        output:
          $ref: "#/components/schemas/OutputStatus"
    OutputStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - final_cursor
        - loss_reason
      properties:
        state:
          type: string
          description: "Open string: unknown for legacy output, pending while durable delivery is unfinished, complete for the entire output, or truncated for a retained prefix. Unknown future values never establish completeness. Independent of workload state."
        final_cursor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "Immutable final log ID for complete or truncated output; zero for an empty prefix. Null for unknown or pending output. Drain through this ID before finishing, even after workload exit."
        loss_reason:
          type: string
          description: "At most 64 bytes. Empty except for truncated output: output_limit, spool_limit, storage_limit, executor_interrupted or producer_failed. Future reasons remain incomplete. This is a fixed classification, never guest or host error text."
    DebugletLogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - timestamp
        - output
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          description: "Server timestamp in UTC, formatted as 2006-01-02T15:04:05Z."
        output:
          type: string
          format: byte
          description: "Base64-encoded guest output bytes."
    DebugletResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - start_time
        - end_time
        - usage
        - executor_id
        - addresses
        - state
      properties:
        id:
          type: string
          format: uuid
        start_time:
          type: integer
          format: int64
          description: "Scheduled start as Unix seconds."
        end_time:
          type: integer
          format: int64
          description: "Scheduled end as Unix seconds."
        usage:
          type: integer
          format: int64
          description: "Bandwidth reserved for the run, in bits per second. It is the floor_bw the debuglet was admitted with, not a measured consumption."
        executor_id:
          type: string
        addresses:
          type: array
          nullable: true
          items:
            type: string
        state:
          type: string
    DebugletList:
      type: array
      items:
        $ref: "#/components/schemas/DebugletResponse"
    ExecutorCapabilities:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - observed_at
        - protocols
        - enforcement_mode
        - advertised_capacity_bps
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        observed_at:
          type: integer
          format: int64
          description: "Dispatcher receipt time in Unix seconds of the latest capability observation; stale reports are omitted."
        protocols:
          type: array
          items:
            type: string
            enum:
              - tcp
              - tls
              - udp
              - icmp
              - scion
          description: "Distinct positively observed, operator-enabled protocols. ICMP means IPv4; SCION indicates local daemon readiness, not destination reachability."
        enforcement_mode:
          type: string
          enum:
            - ""
            - ebpf
            - fallback
          description: "Actual packet-counter mode. Empty means unknown; this does not establish packet attribution or measurement truth."
        enforcement_reason:
          $ref: "#/components/schemas/EnforcementReason"
        icmp:
          $ref: "#/components/schemas/ICMPProbe"
        attribution:
          $ref: "#/components/schemas/ExecutorAttribution"
        tagging:
          $ref: "#/components/schemas/ExecutorTagging"
        advertised_capacity_bps:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "Advertised total capacity in bits per second, or null if unobserved. This is not free capacity or an admission guarantee for a destination and time window."
    EnforcementReason:
      type: string
      enum:
        - ""
        - configured
        - no_interface
        - not_permitted
        - unsupported
        - attach_failed
      description: "Added in API 1.9. Why the executor uses the fallback counter: configured (packet_counter = fallback), no_interface (no interface to attach to), not_permitted (the eBPF attach was refused for lack of privilege), unsupported (the kernel or platform lacks eBPF support) or attach_failed (another eBPF failure; the executor log has the error). Empty when enforcement_mode is ebpf or the reason is unknown, including older executors. Executor-reported."
    ICMPProbe:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - state
        - reason
      properties:
        state:
          type: string
          enum:
            - available
            - unavailable
        reason:
          type: string
          enum:
            - ""
            - disabled
            - not_permitted
            - ping_socket_only
            - unsupported
          description: "Empty when available. disabled: the operator's network.policy.icmp switch is off and no socket was opened. not_permitted: raw ICMPv4 sockets need CAP_NET_RAW. ping_socket_only: raw sockets are refused but an unprivileged ping socket opens; guests need raw sockets, so ICMP stays unavailable. unsupported: the raw socket failed for another reason."
      description: "Added in API 1.9. The executor's own probe, on startup and every capability report, of whether it can open the raw ICMPv4 socket guests use. Opening the socket sends nothing. Agrees with icmp in protocols. Null when unknown, including older executors and a malformed report. Executor-reported."
    ClockReport:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - state
        - estimated_error_ns
        - max_error_ns
        - error_bound_ns
        - readiness
        - reason
      properties:
        state:
          type: string
          enum:
            - synced
            - unsynced
            - unknown
          description: "Kernel clock discipline read with adjtimex (read only). unsynced: the kernel reports STA_UNSYNC or TIME_ERROR. unknown: not Linux or the read failed."
        estimated_error_ns:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "Kernel esterror, maintained by the host's time daemon; an estimate, not a measured bound. Null unless synced."
        max_error_ns:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "Kernel maxerror; null unless synced."
        error_bound_ns:
          type: integer
          format: int64
          minimum: 1
          description: "The executor operator's clock.max_error_ms bound on estimated_error_ns."
        readiness:
          type: string
          enum:
            - ready
            - degraded
            - unknown
          description: "degraded when unsynced or the estimated error exceeds the bound. Reported only; admission is not refused."
        reason:
          type: string
          enum:
            - ""
            - unsynced
            - error_exceeds_bound
          description: "Empty unless degraded."
    ObservedClock:
      type: object
      additionalProperties: false
      required:
        - value
        - source
        - observed_at
      properties:
        value:
          $ref: "#/components/schemas/ClockReport"
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: integer
          format: int64
          nullable: true
          description: "Dispatcher receipt time of the report in Unix seconds."
      description: "Added in API 1.9. Executor-reported kernel clock state. All fields are null together: unknown, including older executors, a malformed clock report and reports older than 90 s."
    ExecutorAttribution:
      type: object
      nullable: true
      additionalProperties: false
      description: "Executor-reported TESLA attribution state: whether packets it tags now can be attributed once their key is disclosed. Absent or null means unknown, including executors and dispatchers that predate it and a malformed report of it. Available is an executor claim, not a verification. Times are the dispatcher receipt time minus an executor-reported age, in Unix seconds."
      required:
        - state
        - reason
        - epoch
        - installed_epoch
        - last_refresh_at
        - refresh_error
        - disclosure_held_since
      properties:
        state:
          type: string
          enum:
            - available
            - unavailable
        reason:
          type: string
          enum:
            - ""
            - epoch_zero
            - chain_exhausted
            - refresh_failing
            - disclosure_held
            - clock_unready
            - clock_drift
          description: "Empty when available. epoch_zero: the public anchor k_0 never signs, so nothing sent in epoch 0 is attributable. chain_exhausted: the key chain has ended. refresh_failing: a kernel tagger's latest key refresh failed. disclosure_held: an installed key has held disclosure back for longer than one epoch. clock_unready: the host clock was not ready when the key chain started, so its announced origin is not trusted until the executor restarts. clock_drift: the executor's wall clock has moved away from the monotonic clock its epochs advance on by more than min(epoch length / 2, 1 s) since the chain started."
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: "Current key-schedule epoch."
        installed_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "Oldest epoch a kernel tagger slot may still sign with; null when none holds a key, including the fallback tagger and an executor without running measurements."
        last_refresh_at:
          type: integer
          format: int64
          nullable: true
          description: "Oldest last successful kernel key install; null without one."
        refresh_error:
          type: string
          description: "Short error of a failing kernel key refresh, at most 128 bytes of UTF-8 without control characters; empty when none fails."
        disclosure_held_since:
          type: integer
          format: int64
          nullable: true
          description: "When an installed key started holding disclosure back, the end of its epoch; null when not held. A hold until the refresh at each epoch boundary is ordinary."
    ExecutorTagging:
      type: object
      nullable: true
      additionalProperties: false
      description: "Executor-reported packet tagging per address family and for SCION: the node's capability, the mode a run on this executor is set up to get (ebpf where the eBPF packet counter loaded on the configured interface), not the mode of any particular run. A run whose kernel tagger fails to load falls back to the pure-Go tagger without changing this report. ebpf is the kernel tagger, which tags every packet of a marked socket; userspace is the pure-Go tagger, which tags IPv4 UDP and ICMP datagrams only and leaves TCP and TLS untagged; none is untagged. A run whose IPv4 mode is ebpf refuses IPv6 destinations and peers and binds its listeners to IPv4 only; SCION traffic is always untagged. Absent or null means unknown, including executors and dispatchers that predate it and a malformed report of it. An executor claim, not a verification. Clients must tolerate values not listed here."
      required:
        - ipv4
        - ipv6
        - scion
      properties:
        ipv4:
          type: string
          enum:
            - ebpf
            - userspace
            - none
        ipv6:
          type: string
          enum:
            - ebpf
            - userspace
            - none
          description: "none in this API version: no tagger tags IPv6 yet."
        scion:
          type: string
          enum:
            - ebpf
            - userspace
            - none
          description: "none in this API version: SCION sockets cannot be marked, so SCION traffic is untagged."
        tag_spec:
          type: string
          description: "Added within API 1.9. The packet-tag specification the tagged families follow: debuglet-tag-v1 (docs/tag-spec.md) from this release on. Absent is unknown, including executors and dispatchers that predate it; a value that is not at most 64 of the characters a-z, 0-9, '-' and '.' is dropped alone. Tags of one specification do not verify under another, and a fleet runs one version. Clients must tolerate values not listed here."
    ExecutorResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - ready
        - last_seen
        - version
        - tesla_delay_sec
        - tesla_anchor_timestamp_ns
        - tesla_anchor_key
        - price_per_bw
        - currency
      properties:
        connectivity:
          $ref: "#/components/schemas/ExecutorConnectivity"
        admission_limits:
          $ref: "#/components/schemas/ExecutorAdmissionLimits"
        capability_observation:
          $ref: "#/components/schemas/CapabilityObservation"
        id:
          type: string
        ready:
          type: boolean
          description: "True once the current control session has sent a heartbeat."
        admission:
          type: string
          enum:
            - ready
            - maintenance
            - offline
          description: "Added in API 1.9. offline: no heartbeat on the current control session yet; maintenance: the dispatcher operator stopped submission admission; ready otherwise. Executors whose control session ended are not listed. Normal admission still decides each submission. Absent from older dispatchers."
        display:
          $ref: "#/components/schemas/ExecutorDisplay"
        ip_metadata:
          $ref: "#/components/schemas/IPMetadata"
        scion_isd_as:
          $ref: "#/components/schemas/ObservedString"
        listeners:
          $ref: "#/components/schemas/ObservedList"
        clock:
          $ref: "#/components/schemas/ObservedClock"
        is_public:
          type: boolean
          nullable: true
          description: "Added in API 1.16. False when the executor set metadata.address_opt_out: the public listing then withholds address_v4 and address_v6, and nothing else. Prefixes, ASNs, location and every other field stay public, as for a private RIPE Atlas probe. An established operator always sees the addresses. True by default, including for executors that predate the setting."
        address_v4:
          type: string
          nullable: true
          description: "Added in API 1.16. The last IPv4 address the dispatcher itself observed for the executor: the peer of its control connection, or of an authenticated address reflection call over IPv4 (address_observations.v4 says which and when). Never the executor's own claim such as public_host. Null when none was observed in the current control session, or when is_public is false and the caller is not an operator. It may be a non-global address when the executor reaches the dispatcher over a private network."
        address_v6:
          type: string
          nullable: true
          description: "Added in API 1.16. As address_v4, for IPv6."
        prefix_v4:
          type: string
          nullable: true
          description: "Added in API 1.16. The prefix of the offline ASN database record covering the observed IPv4 address. Public even when is_public is false. Null when the address is unknown, not global or not in the database."
        prefix_v6:
          type: string
          nullable: true
          description: "Added in API 1.16. As prefix_v4, for IPv6."
        asn_v4:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: "Added in API 1.16. The origin ASN of prefix_v4. Public even when is_public is false."
        asn_v6:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: "Added in API 1.16. As asn_v4, for IPv6."
        address_observations:
          $ref: "#/components/schemas/AddressObservations"
        status:
          $ref: "#/components/schemas/ProbeStatusName"
        status_since:
          type: integer
          format: int64
          nullable: true
          description: "Added in API 1.17. Unix seconds the current status began; equals status.since. Null for never_connected."
        first_connected:
          type: integer
          format: int64
          nullable: true
          description: "Added in API 1.17. Unix seconds of the first registration the dispatcher recorded (from schema 24, or the executor's first recorded TESLA chain). Null for never_connected."
        last_connected:
          type: integer
          format: int64
          nullable: true
          description: "Added in API 1.17. Unix seconds the executor was last known connected: its last heartbeat while connected, recorded at most a minute apart. Null for never_connected."
        total_uptime:
          type: integer
          format: int64
          nullable: true
          description: "Added in API 1.17. Seconds the executor has been connected since the dispatcher began recording it (schema 24), at one-minute resolution. Null for never_connected."
        tags:
          type: array
          nullable: true
          items:
            type: string
          description: "Added in API 1.17. The host tags the executor set in its configuration, from the fixed vocabulary home, office, datacentre, academic, cloud, dsl, cable, fibre, wifi, mobile, satellite and nat, then the system tags the dispatcher derives, which start with system-: system-ipv4-works, system-ipv6-works, system-ipv4-capable, system-ipv6-capable, system-ipv4-rfc1918, system-resolves-a-correctly, system-resolves-aaaa-correctly and system-ipv4/ipv6-stable-1d/30d/90d. System tags are derived only for connected executors. Clients must ignore unknown tags."
        last_seen:
          type: integer
          format: int64
          description: "Unix seconds of the last observed contact."
        version:
          type: string
          description: "Version string announced by the executor."
        tesla_delay_sec:
          type: integer
          format: int64
          description: "TESLA epoch duration in seconds."
        tesla_anchor_timestamp_ns:
          type: integer
          format: int64
          description: "Unix nanoseconds of TESLA epoch 0."
        tesla_anchor_key:
          type: string
          format: byte
          nullable: true
          description: "Base64-encoded public chain anchor k_0. Null when the executor announced none."
        price_per_bw:
          type: integer
          format: int64
          description: "Price per bit per second and second of run time, in the executor's currency. An order costs price_per_bw × floor_bw × timeout_ms / 1000, computed exactly and rounded up to the next whole unit. A batch costs the sum of its orders. An order or a batch whose price exceeds 9223372036854775807 is refused with invalid_policy, and nothing is written."
        currency:
          type: string
        capabilities:
          $ref: "#/components/schemas/ExecutorCapabilities"
    ExecutorDisplay:
      type: object
      additionalProperties: false
      required:
        - display_name
        - city
        - country
        - network
      properties:
        display_name:
          $ref: "#/components/schemas/ResultLabelledString"
        city:
          $ref: "#/components/schemas/ResultLabelledString"
        country:
          $ref: "#/components/schemas/ResultLabelledString"
        network:
          $ref: "#/components/schemas/ResultLabelledString"
      description: "Added in API 1.9. Optional presentation metadata from the dispatcher configuration ([executors.\"<id>\"]), labelled operator. Country is an ISO 3166-1 alpha-2 code; location is never finer than city and is never inferred in these fields. Unconfigured values are null. Clients may derive an approximate fallback separately from ip_metadata. Not verified against the executor."
    IPMetadata:
      type: object
      additionalProperties: false
      required:
        - observed
        - advertised
        - location_opt_out
        - disagreements
      properties:
        reported:
          $ref: "#/components/schemas/AddressMetadata"
        observed:
          $ref: "#/components/schemas/AddressMetadata"
        advertised:
          $ref: "#/components/schemas/AddressMetadata"
        location_opt_out:
          type: boolean
        disagreements:
          type: array
          items:
            type: string
            enum:
              - observed_advertised_asn
              - observed_advertised_location
              - operator_location
      description: "Offline lookups at registration. No DNS or online lookup; addresses themselves are private and remain in result source_ip/public_host. Reconnect replaces live observations; admission snapshots never change. Omitted in older responses and result 1.1 files."
    AddressMetadata:
      type: object
      additionalProperties: false
      required:
        - address_source
        - asn
        - location
      properties:
        address_source:
          type: string
          enum:
            - dispatcher-observed
            - executor-reported
        asn:
          $ref: "#/components/schemas/ASNLookup"
        location:
          $ref: "#/components/schemas/LocationLookup"
    ASNLookup:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "reason"
      properties:
        value:
          $ref: "#/components/schemas/ASInfo"
        source:
          type: "string"
          nullable: true
          pattern: "^database:[^@\\s]+@[1-9][0-9]*$"
        observed_at:
          type: "integer"
          format: "int64"
          description: "Unix seconds at registration, retained in admission snapshots."
        reason:
          type: "string"
          enum:
            - ""
            - "no_database"
            - "no_address"
            - "not_ip"
            - "non_global"
            - "opted_out"
            - "not_found"
            - "lookup_error"
            - "invalid_record"
      description: "Value is null when reason is nonempty. Source identifies the database even for a negative lookup, but is null when no lookup occurred."
    LocationLookup:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "reason"
      properties:
        value:
          $ref: "#/components/schemas/GeoLocation"
        source:
          type: "string"
          nullable: true
          pattern: "^database:[^@\\s]+@[1-9][0-9]*$"
        observed_at:
          type: "integer"
          format: "int64"
          description: "Unix seconds at registration, retained in admission snapshots."
        reason:
          type: "string"
          enum:
            - ""
            - "no_database"
            - "no_address"
            - "not_ip"
            - "non_global"
            - "opted_out"
            - "not_found"
            - "lookup_error"
            - "invalid_record"
      description: "Value is null when reason is nonempty. Source identifies the database even for a negative lookup, but is null when no lookup occurred."
    ASInfo:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - number
        - name
        - prefix
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 4294967295
        name:
          type: string
        prefix:
          type: string
      description: "Origin ASN, organisation name and covering MMDB prefix."
    GeoLocation:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - country
        - city
        - precision
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        city:
          type: string
        precision:
          type: string
          enum:
            - country
            - city
      description: "Approximate location, at most city. Empty city means country precision; no coordinates are exposed."
    ObservedString:
      type: object
      additionalProperties: false
      required:
        - value
        - source
        - observed_at
      properties:
        value:
          type: string
          nullable: true
          description: "Canonical SCION ISD-AS reported by the executor from its SCION daemon, such as 1-ff00:0:110. Null when unknown, including older executors, SCION disabled by the operator and reports older than 90 s."
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: integer
          format: int64
          nullable: true
          description: "Dispatcher receipt time of the report in Unix seconds."
      description: "Added in API 1.9. All fields are null together."
    ObservedList:
      type: object
      additionalProperties: false
      required:
        - value
        - source
        - observed_at
      properties:
        value:
          type: array
          nullable: true
          items:
            type: string
            enum:
              - tcp
              - udp
              - scion
          description: "Transports on which the executor reports it can open run listeners: tcp and udp need the operator's inbound and transport switches plus public_host and public_ports; scion needs the SCION switch and a local SCION observation. Neither the address nor external reachability is reported or tested. Null when unknown; empty when none."
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: integer
          format: int64
          nullable: true
          description: "Dispatcher receipt time of the report in Unix seconds."
      description: "Added in API 1.9. All fields are null together."
    ProbeStatusName:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - name
        - since
      properties:
        name:
          type: string
          enum:
            - connected
            - disconnected
            - abandoned
            - never_connected
          description: "connected: the executor has a control session (its admission may still be offline until the first heartbeat). disconnected: it has none and was last connected at most 30 days ago. abandoned: it was last connected more than 30 days ago. never_connected: it was enrolled but has never registered. Clients must treat an unknown name as not connected."
        since:
          type: integer
          format: int64
          nullable: true
          description: "Unix seconds the status began: the start of the connected streak, last_connected for disconnected, last_connected plus 30 days for abandoned, null for never_connected."
      description: "Added in API 1.17. The executor's status, after RIPE Atlas's probe status."
    AddressObservations:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - v4
        - v6
      properties:
        v4:
          $ref: "#/components/schemas/AddressObservation"
        v6:
          $ref: "#/components/schemas/AddressObservation"
      description: "Added in API 1.16. How and when address_v4 and address_v6 were observed, one record per family. It never carries the address, so it is the same for public and private executors."
    AddressObservation:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - source
        - via
        - observed_at
        - lookup_source
        - lookup_reason
      properties:
        source:
          type: string
          enum:
            - dispatcher-observed
        via:
          type: string
          enum:
            - control
            - reflection
          description: "control: the peer address of the executor's control connection, preferred for its family. reflection: the peer address of the executor's last authenticated ReflectAddress call over this family."
        observed_at:
          type: integer
          format: int64
          description: "Unix seconds of the last observation: the last heartbeat of the control session that carries the control address, or the receipt of the last reflection call."
        lookup_source:
          type: string
          nullable: true
          pattern: "^database:[^@\\s]+@[1-9][0-9]*$"
          description: "The offline ASN database the prefix and ASN come from. Null when no lookup happened."
        lookup_reason:
          type: string
          enum:
            - ""
            - "no_database"
            - "no_address"
            - "not_ip"
            - "non_global"
            - "opted_out"
            - "not_found"
            - "lookup_error"
            - "invalid_record"
          description: "Empty when the database knew the address; otherwise why the prefix and ASN are null."
      description: "Null when no address of the family was observed: for a connected executor, in its current control session; for another, ever, within the retained history."
    ProbeAddressing:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - is_public
        - address_v4
        - address_v6
        - prefix_v4
        - prefix_v6
        - asn_v4
        - asn_v6
        - address_observations
      properties:
        is_public:
          type: boolean
          nullable: true
        address_v4:
          type: string
          nullable: true
        address_v6:
          type: string
          nullable: true
        prefix_v4:
          type: string
          nullable: true
        prefix_v6:
          type: string
          nullable: true
        asn_v4:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
        asn_v6:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
        address_observations:
          $ref: "#/components/schemas/AddressObservations"
      description: "The listing's RIPE Atlas-style addressing fields (see ExecutorResponse) as known at admission. The addresses are recorded for a private executor too, since a result is visible only to the run's owner and operators."
    ExecutorList:
      type: array
      nullable: true
      description: "Null when no executor is registered."
      items:
        $ref: "#/components/schemas/ExecutorResponse"
    ExecutorByIPResponse:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - debuglet_ids
      properties:
        executor_id:
          type: string
        debuglet_ids:
          type: array
          description: "Most recent debuglet IDs, newest first. An executor with no dispatch history reports an empty array."
          items:
            type: string
            format: uuid
    ExecutorTeslaResponse:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - anchor_key
        - anchor_timestamp_ns
        - delay_sec
        - epoch_seconds
        - disclosure_delay_epochs
        - disclosure_delay_seconds
        - disclosed_epoch
        - disclosed_key
        - next_disclosure_epoch
        - next_disclosure_at_ns
      properties:
        executor_id:
          type: string
        anchor_key:
          type: string
          format: byte
          description: "Base64-encoded k_0. Empty when the executor announced none."
        anchor_timestamp_ns:
          type: integer
          format: int64
          description: "Unix nanoseconds of epoch 0."
        delay_sec:
          type: integer
          format: int64
          deprecated: true
          description: "Deprecated name of epoch_seconds, with the same value. It is the epoch length, not the disclosure delay."
        epoch_seconds:
          type: integer
          format: int64
          description: "Epoch length I in seconds. Epoch t starts at anchor_timestamp_ns + t * epoch_seconds."
        disclosure_delay_epochs:
          type: integer
          format: int64
          description: "Disclosure delay d in epochs: the key of epoch t is disclosed no earlier than the start of epoch t + d, which the dispatcher enforces. At least 2; 0 for an executor that predates it, which disclosed after one epoch and whose tags a verifier must not accept."
        disclosure_delay_seconds:
          type: integer
          format: int64
          description: "disclosure_delay_epochs * epoch_seconds. A verifier accepts the key of a packet's epoch t or t - 1 only while it was still secret at the capture time, allowing for clock skew."
        disclosed_epoch:
          type: integer
          format: int64
          description: "Index of the latest disclosed key that verified against the chain anchor, 0 when none has verified."
        disclosed_key:
          type: string
          format: byte
          description: "Base64-encoded latest disclosed key that verified against the chain anchor. Empty when none has verified."
        next_disclosure_epoch:
          type: integer
          format: int64
          description: "disclosed_epoch + 1, the epoch whose key is disclosed next."
        next_disclosure_at_ns:
          type: integer
          format: int64
          description: "Earliest Unix nanoseconds the key of next_disclosure_epoch may be disclosed, anchor_timestamp_ns + (next_disclosure_epoch + d) * epoch_seconds with d = 1 for an executor that reported none; 0 when the schedule is unknown. Disclosure follows on the next executor heartbeat."
    AttributionSchedule:
      type: object
      additionalProperties: false
      description: "Added in API 1.11. Public TESLA schedule of one chain; the names follow GET /executors/{id}/tesla. The key of epoch t covers packets sent from t0_unix_ns + t * epoch_seconds to t0_unix_ns + (t + 1) * epoch_seconds and is disclosed no earlier than t0_unix_ns + (t + disclosure_delay_epochs) * epoch_seconds."
      required:
        - chain_id
        - k0
        - t0_unix_ns
        - epoch_seconds
        - disclosure_delay_epochs
        - chain_length
        - tag_spec
      properties:
        chain_id:
          type: string
          description: "Chain identifier, the lowercase hex of the first 16 bytes of SHA-256(k0)."
        k0:
          type: string
          format: byte
          description: "Base64-encoded chain anchor, the key of epoch 0. Every disclosed key hashes to it."
        t0_unix_ns:
          type: integer
          format: int64
          description: "Start of epoch 0 in Unix nanoseconds."
        epoch_seconds:
          type: integer
          format: int64
          description: "Epoch length I in seconds."
        disclosure_delay_epochs:
          type: integer
          format: int64
          description: "Disclosure delay d in epochs. 0 for an executor that predates it, whose tags a verifier must not accept."
        chain_length:
          type: integer
          format: int64
          description: "Chain length L: the chain tags epochs below it. 0 when the executor did not report it."
        tag_spec:
          type: integer
          format: int64
          minimum: 0
          description: "Tag specification version the executor reported when it registered the chain: 1 is debuglet-tag-v1 (docs/tag-spec.md); 0 is legacy, an executor that did not report debuglet-tag-v1, including every executor that predates the report, whose pre-v1 tags a verifier of tag spec v1 must report as unsupported rather than as a mismatch. Clients must tolerate higher values."
    AttributionCandidate:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - run_id
        - active_from
        - active_to
        - ip_source
        - schedule
        - disclosed_through
        - disclosed_through_at_ns
        - next_disclosure_at_ns
      properties:
        executor_id:
          type: string
        run_id:
          type: string
          format: uuid
          description: "Run identifier. It grants no access to owner routes; the account is never disclosed."
        active_from:
          type: string
          format: date-time
          description: "Start of the run's reserved window."
        active_to:
          type: string
          format: date-time
          description: "End of the run's reserved window, or the time the dispatcher recorded its exit if earlier."
        ip_source:
          type: string
          enum:
            - "observed"
            - "advertised"
          description: "observed when the address is the peer of the executor's control connection, advertised when it is the executor's own claim."
        schedule:
          $ref: "#/components/schemas/AttributionSchedule"
        disclosed_through:
          type: integer
          format: int64
          description: "Latest epoch of the chain whose disclosed key is on record, 0 when none is."
        disclosed_through_at_ns:
          type: integer
          format: int64
          description: "Unix nanoseconds at which the dispatcher recorded the key of disclosed_through; 0 when none is on record. The key may have been public from then on."
        next_disclosure_at_ns:
          type: integer
          format: int64
          description: "Earliest Unix nanoseconds the key of epoch disclosed_through + 1 may be disclosed, t0_unix_ns + (disclosed_through + 1 + d) * epoch_seconds with d = 1 for an executor that reported none; 0 when the schedule is unknown. Disclosure follows on the next executor heartbeat."
    AttributionCandidates:
      type: object
      additionalProperties: false
      required:
        - ip
        - at
        - retained_from
        - candidates
        - truncated
      properties:
        ip:
          type: string
          description: "The queried address in canonical form."
        at:
          type: string
          format: date-time
        retained_from:
          type: string
          format: date-time
          description: "Start of the retained attribution history. Before it the history was pruned or never recorded, so no candidate there is no evidence either way."
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/AttributionCandidate"
        truncated:
          type: boolean
          description: "More than 32 runs matched; candidates lists the first 32."
    AttributionKey:
      type: object
      additionalProperties: false
      required:
        - epoch
        - key
      properties:
        epoch:
          type: integer
          format: int64
        key:
          type: string
          format: byte
          description: "Base64-encoded disclosed key k_epoch."
    AttributionKeys:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - chain_id
        - keys
        - next_epoch
      properties:
        executor_id:
          type: string
        chain_id:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/AttributionKey"
        next_epoch:
          type: integer
          format: int64
          nullable: true
          description: "from_epoch of the next page; null on the last page."
    DestinationLimitRequest:
      type: object
      additionalProperties: false
      required:
        - destination
        - limit
      properties:
        destination:
          type: string
        limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Bandwidth limit in bits per second, at most 1000000000000000 (1 Pbit/s). It becomes the capacity the runs of the destination are shared out of, so it is held to the same range as the bandwidth of a policy."
    PaymentIntentRequest:
      type: "object"
      additionalProperties: false
      required:
        - "debuglets"
        - "payment_method"
      properties:
        debuglets:
          type: "array"
          description: "The debuglets the intent pays for. It must contain at least one debuglet; an empty array is answered 400 invalid_request."
          items:
            $ref: "#/components/schemas/DebugletRequest"
        payment_method:
          type: "string"
          description: "TEST for the local alpha's bookkeeping-only method, or USDC."
        refund_address:
          type: "string"
          description: "Required when creating a USDC intent: a Sui address, 0x followed by 1 to 64 hexadecimal digits (short addresses are accepted). Missing or invalid values answer 400 invalid_request with field_errors naming refund_address and code invalid_address, before intent or order writes. Disabled chain payments still answer 503 payments_disabled first. TEST does not validate this field and it may be omitted or empty. The quote endpoint does not evaluate this field."
        retry:
          $ref: "#/components/schemas/RetryLink"
    IntentResponse:
      type: "object"
      additionalProperties: false
      required:
        - "method"
        - "intent"
      properties:
        method:
          type: "string"
          description: "The payment method the intent was created for."
        intent:
          description: "Method-specific intent."
          oneOf:
            - $ref: "#/components/schemas/DummyIntent"
            - $ref: "#/components/schemas/SuiIntent"
        retry:
          $ref: "#/components/schemas/RetryReceipt"
        quote:
          $ref: "#/components/schemas/Quote"
    DummyIntent:
      type: object
      description: "Intent of the TEST method. It records bookkeeping only and moves no funds."
      additionalProperties: false
      required:
        - transaction_id
        - auth_key
      properties:
        transaction_id:
          type: string
          description: "16 random bytes, hex-encoded."
        auth_key:
          type: string
          description: "Empty for TEST transactions."
    SuiIntent:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - auth_key
        - price
        - coin_type
        - expires_at_s
        - registry_address
        - receiver_address
      properties:
        transaction_id:
          type: string
        auth_key:
          type: string
          description: "Secret that authorizes the following submission. Never log or echo it."
        price:
          type: integer
          format: int64
        coin_type:
          type: string
        expires_at_s:
          type: integer
          format: int64
          description: "Expiry as Unix seconds."
        registry_address:
          type: string
        receiver_address:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          description: "What the account may do. An ordinary account reaches its own runs; an operator additionally reaches the dispatcher-wide operations. The value is a report, not a credential, and a minor version may add roles."
          enum:
            - "user"
            - "operator"
        economics:
          $ref: "#/components/schemas/Economics"
    Economics:
      type: object
      description: "Added in API 1.15. The payment features this dispatcher offers the account now, so a client can hide what is unavailable. It reports configuration, not a balance."
      additionalProperties: false
      required:
        - payment_methods
        - chain_payments
        - allowances
      properties:
        payment_methods:
          type: array
          description: "The methods PUT /payment/intent admits now: TEST, and USDC when blockchain payments are enabled."
          items:
            type: string
        chain_payments:
          type: boolean
          description: "Whether blockchain payments are enabled on this dispatcher."
        allowances:
          type: boolean
          description: "Whether usage allowances are enabled: an account's TEST intents are then capped by the TEST units an operator granted it, and GET /me/allowance reports them."
    Quote:
      type: object
      description: "Added in API 1.15. The price of a batch. Amounts are decimal strings of integer base units of currency. A quote is not a reservation; the intent prices again when it is created."
      additionalProperties: false
      required:
        - pricing_rule
        - currency
        - unit
        - total
        - orders
        - errors
      properties:
        pricing_rule:
          type: string
          description: "Name of the pricing rule, bw-s-ceil-ms-v1 in this version. A changed rule has a new name."
        currency:
          type: string
          description: "The requested payment method, which is the currency of every order."
        unit:
          type: string
          description: "The base unit of the amounts: TEST units, micro-USDC or base units."
        total:
          type: string
          description: "The sum of the order prices. Empty unless every order was priced."
        orders:
          type: array
          description: "One entry per requested debuglet, in request order."
          items:
            $ref: "#/components/schemas/QuotedOrder"
        errors:
          type: array
          description: "Problems of the batch as a whole, such as an empty batch or a total that does not fit a signed 64-bit integer."
          items:
            $ref: "#/components/schemas/FieldError"
    QuotedOrder:
      type: object
      additionalProperties: false
      required:
        - order_id
        - executor_id
        - price
        - errors
      properties:
        order_id:
          type: integer
          format: int64
        executor_id:
          type: string
        price:
          type: string
          description: "The order's price, empty when it could not be priced."
        errors:
          type: array
          description: "Why the order could not be priced or admitted in this batch; empty when it can."
          items:
            $ref: "#/components/schemas/FieldError"
    Allowance:
      type: object
      description: "Added in API 1.15. An account's usage allowance: non-transferable usage credits in TEST units, not money. Amounts are decimal strings of TEST units. remaining is granted - consumed - reserved and is negative when the account used more before its grants than it was granted since."
      additionalProperties: false
      required:
        - currency
        - granted
        - reserved
        - consumed
        - remaining
        - pricing_rule
      properties:
        currency:
          type: string
          description: "Always TEST."
        granted:
          type: string
          description: "The sum of the account's grants."
        reserved:
          type: string
          description: "The price of the account's TEST orders of paid intents whose run has no settled outcome yet, admitted or not."
        consumed:
          type: string
          description: "The price of the account's TEST orders whose run has a settled outcome, credited or refunded alike."
        remaining:
          type: string
        pricing_rule:
          type: string
          description: "The pricing rule intents are priced with now."
    AllowanceGrantRequest:
      type: object
      description: "Added in API 1.15."
      additionalProperties: false
      required:
        - reason
        - idempotency_key
      properties:
        amount:
          type: string
          description: "A positive decimal number of TEST units. Omitted or empty grants the dispatcher's configured default grant."
        reason:
          type: string
          description: "Why the grant is issued, 1 to 200 characters."
        idempotency_key:
          type: string
          description: "1 to 128 characters; a repeated request with the same key issues the grant once."
    AllowanceGrant:
      type: object
      description: "Added in API 1.15. One recorded grant. Grants are never changed or removed."
      additionalProperties: false
      required:
        - id
        - amount
        - currency
        - reason
        - idempotency_key
        - granted_by
        - granted_at
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: string
          description: "A decimal string of TEST units."
        currency:
          type: string
        reason:
          type: string
        idempotency_key:
          type: string
        granted_by:
          type: string
          format: uuid
          description: "The operator account that issued the grant."
        granted_at:
          type: string
          format: date-time
    AllowanceGrantResult:
      type: object
      description: "Added in API 1.15. A grant and the account's allowance after it."
      additionalProperties: false
      required:
        - grant
        - allowance
      properties:
        grant:
          $ref: "#/components/schemas/AllowanceGrant"
        allowance:
          $ref: "#/components/schemas/Allowance"
    ExecutorEarnings:
      type: object
      description: "Added in API 1.15. What an executor has earned, as the dispatcher records it, and the outbound chain transfers that name it. Amounts are decimal strings of base units of currency."
      additionalProperties: false
      required:
        - currency
        - total_income
        - current_balance
        - transfers
        - payouts
      properties:
        currency:
          type: string
          description: "Empty when the executor has earned nothing and is not connected."
        total_income:
          type: string
        current_balance:
          type: string
          description: "Earned and not yet reserved for a payout."
        transfers:
          type: array
          description: "Up to 100 transfers, newest first."
          items:
            $ref: "#/components/schemas/ChainTransfer"
        payouts:
          type: string
          description: "disabled while blockchain payments are disabled; nothing is paid out then."
          enum:
            - "enabled"
            - "disabled"
    ChainTransfer:
      type: object
      description: "Added in API 1.15. One outbound chain transfer."
      additionalProperties: false
      required:
        - id
        - kind
        - amount
        - currency
        - receiver
        - state
        - digest
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - "payout"
            - "refund"
        amount:
          type: string
        currency:
          type: string
        receiver:
          type: string
        state:
          type: string
          description: "reserved before the chain call; sent, confirmed or failed after it; unknown while the outcome is not known, which is never a failure."
          enum:
            - "reserved"
            - "sent"
            - "confirmed"
            - "failed"
            - "unknown"
        digest:
          type: string
          description: "The chain transaction digest; empty before one is known."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderHistory:
      type: object
      description: "Added in API 1.15. One page of the account's payment intents."
      additionalProperties: false
      required:
        - intents
        - next
      properties:
        intents:
          type: array
          items:
            $ref: "#/components/schemas/OrderHistoryIntent"
        next:
          type: string
          description: "The before value of the following page; empty on the last page."
    OrderHistoryIntent:
      type: object
      additionalProperties: false
      required:
        - id
        - method
        - status
        - price
        - currency
        - pricing_rule
        - expires_at
        - orders
      properties:
        id:
          type: string
          description: "The transaction ID the intent returned."
        method:
          type: string
        status:
          type: string
          description: "outstanding, paid, refunded, expired or aborted; unknown for a state this version does not name. Clients must tolerate new values."
        price:
          type: string
          description: "The recorded total, a decimal string of base units."
        currency:
          type: string
          description: "The recorded currency. Empty for a TEST intent recorded before 0.2.0-rc.2."
        pricing_rule:
          type: string
          description: "The pricing rule the intent was priced with; empty when the dispatcher did not record it."
        expires_at:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderHistoryOrder"
    OrderHistoryOrder:
      type: object
      additionalProperties: false
      required:
        - order_id
        - executor_id
        - price
        - currency
        - settlement
      properties:
        order_id:
          type: integer
          format: int64
        executor_id:
          type: string
        price:
          type: string
          description: "The reserved price, a decimal string of base units."
        currency:
          type: string
        settlement:
          type: string
          description: "pending until the run's outcome is settled, then credited to the executor or refunded, as in RunCost."
          enum:
            - "pending"
            - "credited"
            - "refunded"
        run_id:
          type: string
          format: uuid
          description: "The run the order admitted; absent until it is admitted."
    AccountResponse:
      type: object
      description: "An account together with the credentials just issued for it. Both credentials are returned exactly once, by the operation that minted them. Store them where only their owner can read them; the dispatcher keeps only their digests."
      additionalProperties: false
      required:
        - id
        - name
        - role
        - account_key
        - recovery_code
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - "user"
            - "operator"
        account_key:
          type: string
          description: "The long-lived credential of this account, exchanged for a session at /auth/login. It is not a session and is never presented on an ordinary request."
        recovery_code:
          type: string
          description: "The credential that replaces both credentials of this account at /auth/recover. It names this account and can name no other."
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - account_key
      properties:
        account_key:
          type: string
          description: "The account key to exchange for a session. An empty value asks a dispatcher serving the local development profile for a credential for its own local account; every other dispatcher answers 401."
    RecoverRequest:
      type: object
      additionalProperties: false
      required:
        - recovery_code
      properties:
        recovery_code:
          type: string
          description: "The recovery code of the account whose credentials are to be replaced."
    EmptyRequest:
      type: object
      description: "A body with no fields. The route reads nothing from it."
      additionalProperties: false
    SessionResponse:
      type: object
      description: "An issued session. It expires at expires_at and is not extended by use."
      additionalProperties: false
      required:
        - token
        - csrf_token
        - expires_at
        - id
        - name
        - role
      properties:
        token:
          type: string
          description: "The session credential. A native client repeats it as an Authorization bearer token; the same value is also set in the session_token cookie."
        csrf_token:
          type: string
          description: "The token a cookie-authenticated client repeats in the X-Debuglet-CSRF header of every state-changing request. It authenticates nothing on its own, and a bearer client does not need it."
        expires_at:
          type: integer
          format: int64
          description: "Unix seconds at which this session stops being accepted."
        id:
          type: string
          format: uuid
          description: "Identifier of the account this session acts as."
        name:
          type: string
        role:
          type: string
          enum:
            - "user"
            - "operator"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    UserIDList:
      type: array
      items:
        type: string
        format: uuid
    ConnectionInfo:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - mode
        - grpc_address
        - yamux_address
      properties:
        schema_version:
          type: integer
          description: "Currently 1."
        mode:
          type: string
          description: "Currently local-test."
        grpc_address:
          type: string
          description: "Loopback host:port of the control gRPC listener."
        yamux_address:
          type: string
          description: "Loopback host:port of the multiplexed control listener."

    PortableResult:
      type: "object"
      additionalProperties: false
      required:
        - "format"
        - "version"
        - "run_id"
        - "executor_id"
        - "attempt"
        - "provenance"
        - "outcome"
        - "timing"
        - "output"
        - "verification"
      properties:
        format:
          type: "string"
          enum:
            - "debuglet-result"
        version:
          type: "string"
          enum:
            - "1.0"
            - "1.1"
            - "1.2"
          description: "Ordinary results remain 1.1 (historical 1.0 is readable); 1.2 requires a valid immutable retry link in provenance. Unknown outcomes remain unchanged; the parent is never resumed or edited."
        run_id:
          type: "string"
          format: "uuid"
        executor_id:
          type: "string"
        attempt:
          $ref: "#/components/schemas/RecoveryOriginalBinding"
        provenance:
          $ref: "#/components/schemas/ResultProvenance"
        outcome:
          $ref: "#/components/schemas/ResultOutcome"
        timing:
          $ref: "#/components/schemas/ResultTiming"
        output:
          $ref: "#/components/schemas/ResultOutput"
        verification:
          $ref: "#/components/schemas/ResultVerification"
      description: "Portable format 1.1 for ordinary runs and 1.2 for explicit retries; historical 1.0 remains readable. One consistent retained-run snapshot, not a signed attestation. Missing historical provenance remains null. Output may be pending, unknown or truncated."
    ResultProvenance:
      type: "object"
      additionalProperties: false
      required:
        - "run_id"
        - "executor_id"
        - "attempt"
        - "admitted_at"
        - "workload_sha256"
        - "arguments"
        - "admitted_policy"
        - "host_policy"
        - "executor_software"
        - "dispatcher_software"
        - "dispatcher_revision"
        - "certificate_sha256"
        - "vantage_point"
      properties:
        run_id:
          type: "string"
          format: "uuid"
        executor_id:
          type: "string"
        attempt:
          $ref: "#/components/schemas/ResultBinding"
        admitted_at:
          type: "string"
          format: "date-time"
          description: "Dispatcher admission time in UTC."
        workload_sha256:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
          description: "Lowercase SHA-256 of the exact admitted WASM bytes."
        arguments:
          type: "array"
          items:
            type: "string"
        admitted_policy:
          $ref: "#/components/schemas/DebugletPolicyRequest"
        host_policy:
          type: "string"
          enum:
            - "unknown"
          description: "Actual host enforcement was not measured; never inferred from the admitted request."
        executor_software:
          type: "string"
          description: "Executor-reported version at admission; null if unavailable."
          nullable: true
        dispatcher_software:
          type: "string"
          description: "Dispatcher build version at admission; null if unavailable."
          nullable: true
        dispatcher_revision:
          type: "string"
          description: "Dispatcher build revision at admission; null if unavailable."
          nullable: true
        certificate_sha256:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
          description: "Enrolled credential fingerprint at admission, not a signature over this export; null for an unenrolled session."
          nullable: true
        vantage_point:
          $ref: "#/components/schemas/ResultVantagePoint"
        retry:
          $ref: "#/components/schemas/RetryLink"
      description: "Immutable facts recorded with admission in the same database transaction. Current executor metadata never replaces historical facts. Null for runs admitted before this record existed."
      nullable: true
    ResultVantagePoint:
      type: "object"
      additionalProperties: false
      required:
        - "schema_version"
        - "capabilities"
        - "source_ip"
        - "public_host"
      properties:
        connectivity:
          $ref: "#/components/schemas/ExecutorConnectivity"
        reported_source_ip:
          $ref: "#/components/schemas/ResultLabelledString"
        schema_version:
          type: "integer"
          enum:
            - 1
          description: "Later facts (ASN, geolocation, reachability) are added under schema_version 1 as new fields."
        capabilities:
          $ref: "#/components/schemas/ResultVantageCapabilities"
        source_ip:
          $ref: "#/components/schemas/ResultLabelledString"
        public_host:
          $ref: "#/components/schemas/ResultLabelledString"
        ip_metadata:
          $ref: "#/components/schemas/IPMetadata"
        scion_isd_as:
          $ref: "#/components/schemas/ResultLabelledObservation"
        display:
          $ref: "#/components/schemas/ExecutorDisplay"
        clock:
          $ref: "#/components/schemas/ResultLabelledClock"
        platform:
          $ref: "#/components/schemas/ResultLabelledPlatform"
        addressing:
          $ref: "#/components/schemas/ProbeAddressing"
      description: "Added in format 1.1. Where the run was to execute, as known at admission. Each value names its source; no label means verified. Null for runs admitted before format 1.1, and always absent from 1.0 files."
      nullable: true
    ResultSourceLabel:
      type: "string"
      enum:
        - "operator"
        - "executor-reported"
        - "dispatcher-observed"
      description: "Who asserted the value. Database lookup sources are recorded separately in ip_metadata. Null exactly when the value is null."
      nullable: true
    ResultLabelledString:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
      properties:
        value:
          type: "string"
          nullable: true
          description: "Null when not recorded; never guessed."
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
    ResultLabelledObservation:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "stale"
      properties:
        value:
          type: "string"
          nullable: true
          description: "Executor-reported canonical SCION ISD-AS at admission; null when there was none."
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Dispatcher receipt time of the report."
        stale:
          type: "boolean"
          nullable: true
          description: "True when the report had outlived its 90 s lifetime at admission."
      description: "Added within vantage_point schema 1 (API 1.9); a 1.1 file written before it omits the field, which reads as null. All fields are null together."
    ResultLabelledClock:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "stale"
      properties:
        value:
          $ref: "#/components/schemas/ClockReport"
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Dispatcher receipt time of the report."
        stale:
          type: "boolean"
          nullable: true
          description: "True when the report had outlived its 90 s lifetime at admission."
      description: "Added within vantage_point schema 1 (API 1.9). The executor-reported kernel clock state last known at admission; not a bound on the run's timestamps, so timing.clock_uncertainty_ns stays null. A file written before it omits the field, which reads as null. All fields are null together."
    ResultLabelledPlatform:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "stale"
      properties:
        value:
          $ref: "#/components/schemas/HostPlatform"
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Dispatcher receipt time of the report."
        stale:
          type: "boolean"
          nullable: true
          description: "True when the report had outlived its 90 s lifetime at admission."
      description: "Added within vantage_point schema 1 (API 1.9). Operator-only host platform detail, recorded here because a result is readable only by the run's owner and operators; GET /executors never lists it. A file written before it omits the field, which reads as null. All fields are null together."
    HostPlatform:
      type: "object"
      nullable: true
      additionalProperties: false
      required:
        - "os"
        - "arch"
        - "kernel_release"
        - "cpus"
        - "memory_bytes"
        - "build_version"
      properties:
        os:
          type: "string"
          nullable: true
          description: "Go GOOS, such as linux."
        arch:
          type: "string"
          nullable: true
          description: "Go GOARCH, such as amd64."
        kernel_release:
          type: "string"
          nullable: true
          description: "uname release."
        cpus:
          type: "integer"
          format: "int64"
          minimum: 1
          nullable: true
          description: "Logical CPUs usable by the executor process."
        memory_bytes:
          type: "integer"
          format: "int64"
          minimum: 1
          nullable: true
          description: "Total physical memory."
        build_version:
          type: "string"
          nullable: true
          description: "Executor build version."
      description: "Executor-reported host platform. Null values are unknown."
    ResultVantageCapabilities:
      type: "object"
      additionalProperties: false
      required:
        - "value"
        - "source"
        - "observed_at"
        - "stale"
      properties:
        value:
          type: "object"
          additionalProperties: false
          nullable: true
          required:
            - "schema_version"
            - "protocols"
            - "enforcement_mode"
          properties:
            schema_version:
              type: "integer"
              enum:
                - 1
            protocols:
              type: "array"
              items:
                type: "string"
            enforcement_mode:
              type: "string"
              enum:
                - ""
                - "ebpf"
                - "fallback"
            tagging:
              $ref: "#/components/schemas/ExecutorTagging"
            enforcement_reason:
              $ref: "#/components/schemas/EnforcementReason"
            icmp:
              $ref: "#/components/schemas/ICMPProbe"
          description: "Last validated executor capability report at admission; null when there was none. Its tagging is the executor's reported node capability at admission, the tagging the run was set up to get, not a measurement of the run's packets; it is absent or null when the report had none. enforcement_reason and icmp were added within vantage_point schema 1 (API 1.9); earlier files omit them, which reads as empty and null."
        source:
          $ref: "#/components/schemas/ResultSourceLabel"
        observed_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Dispatcher receipt time of the report."
        stale:
          type: "boolean"
          nullable: true
          description: "True when the report had outlived its 90 s lifetime at admission."
    ResultBinding:
      type: "object"
      additionalProperties: false
      required:
        - "dispatcher_incarnation"
        - "session_id"
      properties:
        dispatcher_incarnation:
          type: "string"
          format: "uuid"
        session_id:
          type: "string"
          format: "uuid"
      description: "Original control-session binding. Together with run_id it identifies the attempt; no retry number is invented."
    ResultOutcome:
      type: "object"
      additionalProperties: false
      required:
        - "state"
        - "error"
        - "exit_code"
      properties:
        state:
          type: "string"
          description: "Stored workload state, independent of output finality; open string."
        error:
          type: "string"
          description: "Stored bounded error classification."
        exit_code:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Always null in formats 1.0 and 1.1, which do not record exit codes. Exited state alone does not establish exit code zero."
    ResultTiming:
      type: "object"
      additionalProperties: false
      required:
        - "observed_at"
        - "scheduled_start"
        - "reserved_until"
        - "started_at"
        - "finished_at"
        - "clock_uncertainty_ns"
      properties:
        observed_at:
          type: "string"
          format: "date-time"
          description: "Dispatcher UTC time of this read snapshot."
        scheduled_start:
          type: "string"
          format: "date-time"
          description: "Reserved start time; not evidence of actual execution."
          nullable: true
        reserved_until:
          type: "string"
          format: "date-time"
          description: "Reserved end time; not evidence of actual execution."
          nullable: true
        started_at:
          type: "string"
          format: "date-time"
          description: "Actual start; always null in formats 1.0 and 1.1."
          nullable: true
        finished_at:
          type: "string"
          format: "date-time"
          description: "Actual finish; always null in formats 1.0 and 1.1."
          nullable: true
        clock_uncertainty_ns:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Measured clock-error bound, not timestamp resolution; always null in formats 1.0 and 1.1."
          minimum: 0
    ResultOutput:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "entries"
      properties:
        status:
          $ref: "#/components/schemas/OutputStatus"
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/ResultLogEntry"
      description: "All retained entries in increasing ID order. Known finality requires final_cursor to equal the final entry ID (zero for empty output); a truncated record is still incomplete. Payload bytes are base64."
    ResultLogEntry:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "timestamp"
        - "output"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        timestamp:
          type: "string"
          format: "date-time"
          description: "Stored UTC timestamp in RFC3339 with available fractional seconds."
        output:
          type: "string"
          format: "byte"
          description: "Base64-encoded guest output bytes."
    ResultVerification:
      type: "object"
      additionalProperties: false
      required:
        - "attribution"
        - "packet_evidence"
        - "measurement_truth"
      properties:
        attribution:
          type: "string"
          enum:
            - "unknown"
            - "unenrolled_session"
            - "enrolled_at_admission"
          description: "Admission identity status only: unknown without provenance, unenrolled_session, or enrolled_at_admission. Enrollment does not verify measurement truth."
        packet_evidence:
          type: "string"
          enum:
            - "unverified"
        measurement_truth:
          type: "string"
          enum:
            - "unverified"
    "ProfileProgram":
      "type": "object"
      "additionalProperties": false
      "required":
        - "sha256"
        - "wasm"
      "properties":
        "sha256":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
        "wasm":
          "type": "string"
          "format": "byte"
    "TemplateReference":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "version"
      "properties":
        "id":
          "type": "string"
          "enum":
            - "http"
            - "tcp"
            - "service"
        "version":
          "type": "integer"
          "enum":
            - 1
    "ProfileConfig":
      "type": "object"
      "additionalProperties": false
      "required":
        - "version"
        - "name"
        - "program"
        - "executor_id"
        - "args"
        - "policy"
      "properties":
        "version":
          "type": "integer"
          "enum":
            - 1
        "name":
          "type": "string"
          "description": "Bounds: minLength=1, maxLength=120."
        "program":
          "$ref": "#/components/schemas/ProfileProgram"
        "executor_id":
          "type": "string"
          "description": "Bounds: minLength=1, maxLength=256."
        "args":
          "type": "array"
          "items":
            "type": "string"
          "description": "Bounds: maxItems=256."
        "policy":
          "$ref": "#/components/schemas/DebugletPolicyRequest"
        "template":
          "$ref": "#/components/schemas/TemplateReference"
    "MeasurementProfile":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "config"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "config":
          "$ref": "#/components/schemas/ProfileConfig"
    "ProfileSummary":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "name"
        - "program_sha256"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "program_sha256":
          "type": "string"
    "TemplateArgument":
      "type": "object"
      "additionalProperties": false
      "required":
        - "type"
        - "description"
        - "default"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "string"
        "description":
          "type": "string"
        "default":
          "type": "string"
    "TemplateArguments":
      "type": "object"
      "additionalProperties": false
      "required":
        - "type"
        - "properties"
        - "required"
        - "additionalProperties"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "object"
        "properties":
          "type": "object"
          "additionalProperties": false
          "properties":
            "target":
              "$ref": "#/components/schemas/TemplateArgument"
            "max_ms":
              "$ref": "#/components/schemas/TemplateArgument"
            "check":
              "$ref": "#/components/schemas/TemplateArgument"
            "contains":
              "$ref": "#/components/schemas/TemplateArgument"
        "required":
          "type": "array"
          "items":
            "type": "string"
        "additionalProperties":
          "type": "boolean"
          "enum":
            - false
    "MeasurementTemplate":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "version"
        - "name"
        - "description"
        - "program_sha256"
        - "program_asset"
        - "arguments"
        - "required_transports"
        - "default_policy"
      "properties":
        "id":
          "type": "string"
        "version":
          "type": "integer"
          "enum":
            - 1
        "name":
          "type": "string"
        "description":
          "type": "string"
        "program_sha256":
          "type": "string"
        "program_asset":
          "type": "string"
        "arguments":
          "$ref": "#/components/schemas/TemplateArguments"
        "required_transports":
          "type": "array"
          "items":
            "type": "string"
        "default_policy":
          "$ref": "#/components/schemas/DebugletPolicyRequest"
    "SubmittedConfiguration":
      "type": "object"
      "additionalProperties": false
      "required":
        - "label"
        - "program_name"
        - "requested_start"
        - "args"
        - "policy"
      "properties":
        "label":
          "type": "string"
        "program_name":
          "type": "string"
        "requested_start":
          "type": "integer"
          "format": "int64"
          "nullable": true
        "args":
          "type": "array"
          "items":
            "type": "string"
        "policy":
          "$ref": "#/components/schemas/DebugletPolicyRequest"
      "nullable": true
    "RunCost":
      "type": "object"
      "additionalProperties": false
      "required":
        - "currency"
        - "unit"
        - "reserved"
        - "charged"
        - "settlement"
      "properties":
        "currency":
          "type": "string"
        "unit":
          "type": "string"
        "reserved":
          "type": "string"
        "charged":
          "type": "string"
          "nullable": true
        "settlement":
          "type": "string"
          "enum":
            - "pending"
            - "credited"
            - "refunded"
      "nullable": true
    RunDetail:
      type: "object"
      additionalProperties: false
      required:
        - "run_id"
        - "executor_id"
        - "batch_id"
        - "order_id"
        - "submitted"
        - "provenance"
        - "outcome"
        - "timing"
        - "cost"
        - "execution"
      properties:
        run_id:
          type: "string"
          format: "uuid"
        executor_id:
          type: "string"
        batch_id:
          type: "string"
        order_id:
          type: "integer"
          format: "int64"
        submitted:
          $ref: "#/components/schemas/SubmittedConfiguration"
        provenance:
          $ref: "#/components/schemas/ResultProvenance"
        outcome:
          $ref: "#/components/schemas/ResultOutcome"
        timing:
          $ref: "#/components/schemas/ResultTiming"
        cost:
          $ref: "#/components/schemas/RunCost"
        execution:
          $ref: "#/components/schemas/RunExecution"
    "MeasurementSummary":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "label"
        - "state"
        - "children"
        - "scheduled_start"
      "properties":
        "id":
          "type": "string"
        "label":
          "type": "string"
        "state":
          "type": "string"
          "enum":
            - "running"
            - "unknown"
            - "failed"
            - "succeeded"
        "children":
          "type": "integer"
          "format": "int64"
        "scheduled_start":
          "type": "string"
          "format": "date-time"
    "MeasurementPage":
      "type": "object"
      "additionalProperties": false
      "required":
        - "measurements"
        - "total"
        - "counts"
        - "limit"
        - "offset"
      "properties":
        "measurements":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/MeasurementSummary"
        "total":
          "type": "integer"
          "format": "int64"
        "counts":
          "type": "object"
          "additionalProperties": false
          "required":
            - "running"
            - "succeeded"
            - "failed"
            - "unknown"
          "properties":
            "running":
              "type": "integer"
              "format": "int64"
            "succeeded":
              "type": "integer"
              "format": "int64"
            "failed":
              "type": "integer"
              "format": "int64"
            "unknown":
              "type": "integer"
              "format": "int64"
        "limit":
          "type": "integer"
          "format": "int64"
        "offset":
          "type": "integer"
          "format": "int64"
    "Measurement":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "runs"
        - "total"
        - "limit"
        - "offset"
      "properties":
        "id":
          "type": "string"
        "runs":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/MeasurementRun"
        "total":
          "type": "integer"
          "format": "int64"
        "limit":
          "type": "integer"
          "format": "int64"
        "offset":
          "type": "integer"
          "format": "int64"
    Reachability:
      type: "object"
      additionalProperties: false
      required:
        - "state"
        - "reason"
        - "source"
        - "observed_at"
        - "expires_at"
        - "stale"
      properties:
        state:
          type: "string"
          description: "reachable, unreachable or untested; future values remain unknown to older clients."
        reason:
          type: "string"
        source:
          type: "string"
        observed_at:
          type: "integer"
          format: "int64"
          nullable: true
        expires_at:
          type: "integer"
          format: "int64"
          nullable: true
        stale:
          type: "boolean"
        address:
          type: "string"
        endpoint:
          type: "string"
      description: "One bounded observation against an operator-controlled peer. A successful check does not prove universal reachability. Null times mean untested. Address and endpoint are omitted from public listings; operators and result owners may see them."
    ExecutorConnectivity:
      type: "object"
      additionalProperties: false
      required:
        - "schema_version"
        - "ipv4"
        - "ipv6"
        - "tcp_listener"
        - "udp_listener"
        - "scion_listener"
        - "scion_host"
        - "scion_paths"
        - "disagreements"
      properties:
        schema_version:
          type: "integer"
          enum:
            - 1
        ipv4:
          $ref: "#/components/schemas/Reachability"
        ipv6:
          $ref: "#/components/schemas/Reachability"
        tcp_listener:
          $ref: "#/components/schemas/Reachability"
        udp_listener:
          $ref: "#/components/schemas/Reachability"
        scion_listener:
          $ref: "#/components/schemas/Reachability"
        scion_host:
          $ref: "#/components/schemas/ObservedString"
        scion_paths:
          $ref: "#/components/schemas/Reachability"
        disagreements:
          type: "array"
          items:
            type: "string"
      description: "Optional controlled connectivity observations. Missing on earlier peers; observations keep their original timestamps and become stale. Unconfigured checks remain untested. Captured unchanged at admission in owned results."
    ExecutorAdmissionLimits:
      type: "object"
      additionalProperties: false
      required:
        - "scheduling"
        - "min_timeout_ms"
        - "max_timeout_ms"
        - "max_bandwidth_bps"
        - "price_unit"
      properties:
        scheduling:
          type: "boolean"
        min_timeout_ms:
          type: "integer"
          format: "int64"
        max_timeout_ms:
          type: "integer"
          format: "int64"
        max_bandwidth_bps:
          type: "integer"
          format: "int64"
        price_unit:
          type: "string"
          description: "currency_per_bps_second: currency units per bit per second and per second of duration."
      description: "Supported policy domain, not available scheduling capacity. Admission still checks the full reservation and current executor availability."
    CapabilityObservation:
      type: "object"
      additionalProperties: false
      required:
        - "state"
        - "observed_at"
        - "expires_at"
      properties:
        state:
          type: "string"
          description: "current, stale or unknown; absent or malformed reports are unknown."
        observed_at:
          type: "integer"
          format: "int64"
          nullable: true
        expires_at:
          type: "integer"
          format: "int64"
          nullable: true
    "MeasurementRun":
      "type": "object"
      "additionalProperties": false
      "required":
        - "run_id"
        - "executor_id"
        - "order_id"
        - "state"
        - "label"
        - "program_name"
      "properties":
        "run_id":
          "type": "string"
        "executor_id":
          "type": "string"
        "order_id":
          "type": "integer"
          "format": "int64"
        "state":
          "type": "string"
        "label":
          "type": "string"
        "program_name":
          "type": "string"

    RetryLink:
      type: "object"
      additionalProperties: false
      required:
        - "parent_run_id"
        - "request_id"
      properties:
        parent_run_id:
          type: "string"
          format: "uuid"
        request_id:
          type: "string"
          format: "uuid"
    RetryReceipt:
      type: "object"
      additionalProperties: false
      required:
        - "parent_run_id"
        - "request_id"
      properties:
        parent_run_id:
          type: "string"
          format: "uuid"
        request_id:
          type: "string"
          format: "uuid"
        run_id:
          type: "string"
          format: "uuid"
          description: "Present after admission; recovering this receipt does not upload again."
    RunExecution:
      type: "object"
      additionalProperties: false
      nullable: true
      required:
        - "time_source"
        - "started_observed_at"
        - "terminal_observed_at"
        - "reported_exit_code"
        - "tcp_listener"
        - "listener_ready"
      properties:
        time_source:
          type: "string"
          enum:
            - "dispatcher-observed"
        started_observed_at:
          type: "string"
          format: "date-time"
          nullable: true
        terminal_observed_at:
          type: "string"
          format: "date-time"
          nullable: true
        reported_exit_code:
          type: "integer"
          minimum: -2147483648
          maximum: 2147483647
          nullable: true
        tcp_listener:
          type: "string"
          nullable: true
        listener_ready:
          type: "boolean"
      description: "Dispatcher receipt times of authenticated, bound executor reports. These are not exact executor execution times. Reported exit code is the executor report. TCP endpoint is stored only after actual listener installation and checked against the admission public host/policy; listener_ready requires the latest retained started state before the reserved end, and does not prove external reachability. Retention deletion removes the endpoint. Historical runs without reports have null execution."
