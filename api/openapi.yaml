              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/github/callback:
    get:
      operationId: "completeGitHubLogin"
      summary: "Complete browser login with GitHub."
      description: "Validates the state cookie, exchanges GitHub's one-time code, creates or finds the Debuglet account bound to the immutable GitHub user ID, issues Debuglet session and CSRF cookies, and redirects to the configured console URL."
      security: []
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: string
        - name: "code"
          in: "query"
          required: true
          schema:
            type: string
        - name: "state"
          in: "query"
          required: true
          schema:
            type: string
      responses:
        "302":
          description: "The session was issued; redirect to the configured console URL."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
        "400":
          description: "The state or authorization code is missing or invalid."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
