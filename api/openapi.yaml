                $ref: "#/components/schemas/Error"
  /readyz:
    get:
      operationId: "getReadiness"
      summary: "Admission readiness of the dispatcher."
      description: "Answers 200 while this dispatcher would admit new work: admission is open, its database answers one bounded read and its control listener accepts executor sessions. Otherwise it answers 503 naming the failed checks. Every observation is made while the request is served, never read from a record written at startup. Needs no credential."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "The dispatcher admits new work."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "At least one admission check failed, and reasons names them."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
  /health:
    get:
      operationId: "getHealth"
      summary: "Liveness, readiness and dependency observations."
      description: "Always answers 200 with the observations behind the readiness decision, so that a degraded dependency can be told from a paused dispatcher or a lost control channel. Needs no credential and carries no operator note, identifier or path."
