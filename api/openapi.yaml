  /auth/login:
    post:
      operationId: "login"
      summary: "Exchange an account key for a session."
      description: "Verifies the account key of one account and issues a session for it. The returned token is the bearer credential a native client repeats in the Authorization header; the same token is also set in the session_token cookie, together with the session's CSRF token in session_csrf, for a browser client. A session expires 12 hours after it was issued and is not extended by use: a client logs in again. Nothing else is a login credential: a user identifier, a debuglet identifier and a payment auth key are all refused here. An empty account_key is the local development bootstrap and is served only by a dispatcher explicitly configured for local development."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
