        "429":
          description: "Account request quota reached (account_quota_exceeded); Retry-After seconds. While usage allowances are enabled, also an account's TEST intent whose price its remaining allowance does not cover (allowance_exceeded), without Retry-After; no transaction, order or owner is written."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
