                $ref: "#/components/schemas/Error"
        "500":
          description: "The dispatcher could not complete or confirm the cancellation because of an internal failure (internal_error). The executor may already have acknowledged cancellation, the dispatcher may have failed to record a cancellation after the control session ended, or the executor could not be reached to confirm it. A 500 does not confirm either remote termination or a stored result; inspect GET /debuglet/{id}/cancellation before deciding whether to repeat the request."
