openapi: "3.0.3"
info:
  title: "Debuglet dispatcher HTTP API"
  version: "1.17"
  description: "Wire contract of the dispatcher's public HTTP API. Bandwidth values are bits per second, timeouts are milliseconds, TESLA delays are seconds, TESLA anchor timestamps are Unix nanoseconds and every other timestamp is Unix seconds unless a field says otherwise. A client states the contract version it requires with the Debuglet-API-Version request header, declared on every operation below; every response carries the version this dispatcher implements in the same header. Requests are authenticated with a server-issued session: a native client presents it as an Authorization bearer token, a browser client in the session_token cookie plus the X-Debuglet-CSRF header on state-changing requests. Each operation states its own 401 and 403. Access to another account's run or payment order answers 404, so a response is no existence oracle. A dispatcher explicitly configured for the local development profile additionally serves the unauthenticated routes below as its own local operator. See docs/api.md for the access matrix and the compatibility and deprecation policy."
servers:
  - url: "/"
    description: "Dispatcher served at the root of its origin."
  - url: "/api"
    description: "Dispatcher served behind an explicit /api path prefix. Every route below is relative to the selected server URL."
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /operator/executors:
    get:
      operationId: "listOwnedExecutors"
      summary: "List your executors and onboarding availability."
      description: "Added in API 1.10. Requires an authenticated account, including when local development is enabled. Lists only machines owned by that account, including pending and offline machines. Owning a machine does not grant dispatcher administration."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Request completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedExecutorList"
        "400":
          description: "Invalid request or unsupported API version."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "A valid session or enrollment token is required."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The request body exceeds the allowed limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The request could not be completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: "createOwnedExecutor"
      summary: "Create a pending executor owned by your account."
      description: "Returns a new server-assigned executor ID and a single-use setup token valid for 24 hours. The token is shown once. The machine is not online until it enrolls and establishes a ready control session. At most ten executors may be created by an account."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnedExecutor"
      responses:
        "201":
          description: "Request completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorSetup"
        "400":
          description: "Invalid request or unsupported API version."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "A valid session or enrollment token is required."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The session CSRF proof is missing or invalid."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The account has reached its executor limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The request body exceeds the allowed limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The request could not be completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Self-service executor enrollment is unavailable on this dispatcher."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator/executors/{id}/enrollment-token:
    post:
      operationId: "renewExecutorSetupToken"
      summary: "Replace the setup token for your executor."
      description: "Invalidates the previous unspent token. The existing certificate binding remains valid until a machine completes setup with the new token; completing setup replaces that binding. Other accounts receive 404. Tokens are never returned by the inventory route."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Request completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorSetup"
        "400":
          description: "Invalid request or unsupported API version."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "A valid session or enrollment token is required."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The session CSRF proof is missing or invalid."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The executor does not exist or belongs to another account."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The request body exceeds the allowed limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The request could not be completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Self-service executor enrollment is unavailable on this dispatcher."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator/executors/{id}/earnings:
    get:
      operationId: "getExecutorEarnings"
      summary: "Report what your executor has earned and its chain transfers."
      description: "Added in API 1.15. Requires an authenticated account that owns the executor; other accounts receive 404. Reports the earnings the dispatcher has credited to the executor in the currency it announces (the first currency it earned in while it is not connected) and up to 100 of the newest outbound chain transfers that name it. payouts is disabled while blockchain payments are disabled. Nothing is paid out by this route."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: "string"
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "The executor's earnings and transfers."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorEarnings"
        "400":
          description: "The Debuglet-API-Version request header requires a contract version this dispatcher does not serve (unsupported_api_version)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request did not authenticate as an account (unauthorized). The local development profile does not serve this route without a credential either."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "No executor with this ID is owned by the caller (not_found)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The earnings could not be read."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator/accounts/{id}/allowance:
    post:
      operationId: "grantAllowance"
      summary: "Grant an account a usage allowance."
      description: "Added in API 1.15. Requires an authenticated operator account, recorded as granted_by. Records an immutable grant of TEST units, the configured default grant when amount is omitted. Allowances are non-transferable usage credits, not money. The same idempotency_key with the same amount and reason answers 200 with the recorded grant and records nothing; with a different amount or reason it answers 409. While allowances are disabled every request answers 404."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: "string"
        - name: "id"
          in: "path"
          required: true
          description: "The account ID."
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceGrantRequest"
      responses:
        "200":
          description: "The idempotency key names this grant already; nothing was recorded."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceGrantResult"
        "201":
          description: "The grant was recorded."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceGrantResult"
        "400":
          description: "Malformed body, an amount that is not a positive decimal number, or a missing or overlong reason or idempotency_key (invalid_request), or an unsupported Debuglet-API-Version (unsupported_api_version)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "The request did not authenticate as an account (unauthorized). The local development profile does not serve this route without a credential either."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The account is not an operator, or a cookie-authenticated request lacks its CSRF token (forbidden)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Unknown account, or allowances are not enabled on this dispatcher (not_found)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The idempotency_key already names a grant with a different amount or reason (conflict), or the account's allowance after the grant cannot be represented in signed 64-bit integers (allowance_out_of_range); nothing is recorded in either case."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The grant could not be recorded."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /executor-enrollment:
    post:
      operationId: "enrollExecutorCertificate"
      summary: "Exchange an executor setup token and CSR for its machine certificate."
      description: "Added in API 1.10. Authenticates with the single-use token in the JSON body, not a user session. The CSR must prove possession of its key. Issues only a client authentication certificate, consumes the token and durably binds its fingerprint before answering. The private key never leaves the executor. A lost response can be recovered by requesting a new setup token from the owning account."
      security: []
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorEnrollmentRequest"
      responses:
        "200":
          description: "Request completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorEnrollment"
        "400":
          description: "Invalid request or unsupported API version."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "A valid session or enrollment token is required."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The request body exceeds the allowed limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The request could not be completed."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Self-service executor enrollment is unavailable on this dispatcher."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /debuglet/{id}/result:
    get:
      operationId: "getDebugletResult"
      summary: "Export a portable retained-run snapshot."
      description: "Added in API 1.8. Reads run, immutable admission provenance and retained output from one SQLite snapshot without contacting the executor. Writes portable format 1.1 for ordinary runs and 1.2 for explicit retries, independent of the HTTP API version. Does not wait for completion."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Portable result snapshot; incomplete or unknown output is preserved as data."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortableResult"
        "400":
          description: "The path segment is not a canonical UUID, or the required API version is unsupported."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "No valid credential. Local development profile permits unauthenticated access."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The run does not exist or belongs to another account."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The result exceeds 33554432 encoded bytes or 65536 retained entries; use paginated logs. The global 33554432-byte request-body limit also applies. No silent truncation."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "The stored result could not be read consistently."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: "Payload was deleted; state and identity remain available (payload_deleted)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      operationId: "getMetrics"
      summary: "Operator metrics in Prometheus text format."
      description: "Requires an operator account, or the explicit local development profile. Fixed-cardinality gauges describe retained run rows, current session eligibility and dispatcher host resources. They are not lifetime counters. Missing observations are explicitly unavailable. Reports are cached for one second; simultaneous collection answers 503. See docs/operations/metrics.md for scope, units and limits."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. Unsupported versions answer 400."
          schema:
            type: string
      responses:
        "200":
          description: "Fixed-cardinality observations, including availability signals."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: "Unsupported API contract version (unsupported_api_version)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "No valid session credential (unauthorized)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "An operator account is required (forbidden)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large)."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Another collection is in progress (service_unavailable); retry after one second."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /openapi.yaml:
    get:
      operationId: "getOpenAPI"
      summary: "This contract, as served by the dispatcher."
      description: "Returns the OpenAPI description of the API version the dispatcher implements. The response is the tracked api/openapi.yaml of the running build, byte for byte."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "The OpenAPI description."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /version:
    get:
      operationId: "getVersion"
      summary: "Version identities of the dispatcher."
      description: "Reports the HTTP API contract version, the dispatcher binary identity and the executor control protocol version. This route never negotiates: it answers regardless of the Debuglet-API-Version request header so that an incompatible client can discover what the server speaks."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
          schema:
            type: string
      security: []
      responses:
        "200":
          description: "Version identities."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "413":
          description: "The body exceeds 33554432 bytes (payload_too_large). A declared length above the limit is refused without reading the body; a body of unknown length is cut at the limit, so a decode that needs more fails with this answer. No handler sees a byte beyond the limit."
          headers:
            Debuglet-API-Version:
              description: "Contract version this dispatcher implements."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: "getLiveness"
      summary: "Liveness of the dispatcher process."
      description: "Answers 200 whenever this process serves requests. It states nothing about readiness: a live dispatcher may be paused for maintenance, or unable to reach its database or its executors. Needs no credential."
      parameters:
        - name: "Debuglet-API-Version"
          in: "header"
          required: false
          description: "Contract version the client requires, as major or major.minor. A version this dispatcher does not serve is answered 400 with code unsupported_api_version; an absent or empty value states no requirement. The discovery routes /version and /openapi.yaml and the health routes answer whatever this header says."
