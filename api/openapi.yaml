  /auth/recover:
    post:
      operationId: "recoverAccount"
      summary: "Replace the credentials of one account with a recovery code."
      description: "Consumes a recovery code and returns a new account key and a new recovery code for the one account that code belongs to. Every session of that account is revoked first, so a credential the previous holder kept stops working. A recovery code names its own account and cannot be pointed at another one, so recovering never grants ownership of somebody else's account."
