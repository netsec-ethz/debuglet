              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "A chain payment method was requested while blockchain payments are disabled (payments_disabled), or an operator has stopped the admission of new submissions on this dispatcher (service_unavailable). No intent is created and nothing is priced in either case."
          headers:
            Debuglet-API-Version:
