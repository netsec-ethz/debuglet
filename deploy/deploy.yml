---
- name: Deploy Dispatcher
  hosts: dispatcher
  become: true

  tasks:
    - name: Copy dispatcher binary
      ansible.builtin.copy:
        src: dist/debuglet-dispatcher
        dest: /usr/local/bin/debuglet-dispatcher
        owner: root
        group: root
        mode: '0755'
      notify: Restart dispatcher

  handlers:
    - name: Restart dispatcher
      ansible.builtin.systemd:
        name: debuglet-dispatcher
        state: restarted
        daemon_reload: true

- name: Deploy Executors
  hosts: executors
  serial: 1
  become: true

  tasks:
    - name: Copy executor binary
      ansible.builtin.copy:
        src: dist/debuglet-executor
        dest: /usr/local/bin/debuglet-executor
        owner: root
        group: root
        mode: '0755'
      notify: Restart executor

  handlers:
    - name: Restart executor
      ansible.builtin.systemd:
        name: debuglet-executor
        state: restarted
        daemon_reload: true
