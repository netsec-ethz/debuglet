        exp_alerts: []
    promql_expr_test:
      - expr: 'debuglet_retained_runs_unknown{job="debuglet-dispatcher"}'
        eval_time: 150s
        exp_samples:
          - labels: 'debuglet_retained_runs_unknown{job="debuglet-dispatcher",instance="owned:9000"}'
            value: 1
