[identity]
executor_id = "docker-executor"
version = "unknown"

[dispatcher]
addr = "nginx:9443"
yamux_addr = "nginx:9444"

[tls]
disable = false

[resources]
capacity = 1_000_000_000
max_debuglets = 20

[tesla]
seed = "test-tesla-seed-do-not-use-in-production"
delay = 30

[logging]
log_level = "debug"
json_logs = false

[credentials]
ca_cert = "/etc/debuglet/certs/server.crt"
client_cert = "/etc/debuglet/certs/server.crt"
client_key = "/etc/debuglet/certs/server.key"
