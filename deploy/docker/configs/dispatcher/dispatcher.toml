[server]
http_port = 9000
grpc_port = 9001

[logging]
log_level = "debug"
json_logs = false

[scheduler]
executor_timeout = 60
scheduler_granularity_ms = 30000

# TLS is terminated by nginx in front
[tls]
disable = true
cert_file = "/etc/debuglet/dispatcher/cert"
key_file = "/etc/debuglet/dispatcher/key"
