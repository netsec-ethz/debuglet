---
# Every deployment playbook imports this. It checks the variables a deployment
# needs before anything connects to a managed host, so a missing or malformed
# value is a named local error instead of a half-configured service.
#
# It runs locally, connects to nothing and changes nothing.

- name: Check deployment variables for every host
  hosts: all
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: Require a known deployment environment
      ansible.builtin.assert:
        that:
          - debuglet_env in ['prod', 'dev']
        fail_msg: "debuglet_env must be prod or dev; select the matching vars file and inventory."
        quiet: true

    - name: Require usable listener ports
      ansible.builtin.assert:
        that:
          - dispatcher_http_port | int > 0
          - dispatcher_http_port | int <= 65535
          - dispatcher_grpc_port | int > 0
          - dispatcher_grpc_port | int <= 65535
          - dispatcher_http_port | int != dispatcher_grpc_port | int
        fail_msg: >-
          dispatcher_http_port and dispatcher_grpc_port must each be between 1
          and 65535 and must differ. Got {{ dispatcher_http_port }} and
          {{ dispatcher_grpc_port }}.
        quiet: true

    - name: Require absolute installation paths
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value is match('^/')
          - item.value != '/'
        fail_msg: "{{ item.key }} must be an absolute path, got {{ item.value }}."
        quiet: true
      loop:
        - { key: payload_prefix, value: "{{ payload_prefix }}" }
        - { key: payload_staging_dir, value: "{{ payload_staging_dir }}" }
        - { key: config_dir, value: "{{ config_dir }}" }
        - { key: state_dir, value: "{{ state_dir }}" }
        - { key: log_dir, value: "{{ log_dir }}" }
        - { key: systemd_unit_dir, value: "{{ systemd_unit_dir }}" }
      loop_control:
        label: "{{ item.key }}"

    # The daemons write their databases into state_dir and read everything
    # else read-only, so the two must not be the same tree.
    - name: Require a state directory outside the configuration directory
      ansible.builtin.assert:
        that:
          - not (state_dir ~ '/') is match('^' ~ (config_dir | regex_escape) ~ '/')
          - not (config_dir ~ '/') is match('^' ~ (state_dir | regex_escape) ~ '/')
          - state_dir != config_dir
        fail_msg: >-
          state_dir ({{ state_dir }}) holds the writable databases and
          config_dir ({{ config_dir }}) holds read-only configuration; neither
          may contain the other.
        quiet: true

- name: Check dispatcher variables
  hosts: dispatcher
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ipv4_literal: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    # A client matches an IP-literal host against IP entries only and a name
    # against DNS entries, so the address decides which kind to ask for.
    san_request: "{{ (dispatcher_addr is match(ipv4_literal)) | ternary('IP', 'DNS') }}"

  tasks:
    - name: Require the public API origin
      ansible.builtin.assert:
        that:
          - dispatcher_base_url is defined
          - dispatcher_base_url is string
          - dispatcher_base_url | length > 0
          - dispatcher_base_url is match('^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$')
        fail_msg: >-
          dispatcher_base_url is required and has no default. Set it to the
          bare domain the API is served from, for example
          -e dispatcher_base_url=debuglet.example.com. See
          deploy/ansible/group_vars/dispatcher.yml.
        quiet: true

    # The daemon refuses a wildcard origin: it cannot carry cookie
    # credentials. An empty list is the credential-free wildcard.
    - name: Require credentialed origins to name a scheme and host
      ansible.builtin.assert:
        that:
          - item != '*'
          - item is match('^https?://[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?(:[0-9]{1,5})?$')
        fail_msg: >-
          dispatcher_cors_allowed_origins entries must be written as
          scheme://host[:port] with no path, and a wildcard is refused. Got
          {{ item }}.
        quiet: true
      loop: "{{ dispatcher_cors_allowed_origins | default([]) }}"

    - name: Require TLS when client certificates are required
      ansible.builtin.assert:
        that:
          - not (dispatcher_disable_tls | bool)
        fail_msg: >-
          dispatcher_require_client_cert is on but dispatcher_disable_tls is
          true. A cleartext listener has no client certificate to check; serve
          TLS or turn the requirement off.
        quiet: true
      when: dispatcher_require_client_cert | bool

    - name: Inspect local GitHub OAuth credentials
      ansible.builtin.stat:
        path: "{{ dispatcher_github_oauth_env_file }}"
      delegate_to: localhost
      register: github_oauth_credentials
      when: dispatcher_github_oauth_enabled | bool

    - name: Require local GitHub OAuth credentials
      ansible.builtin.assert:
        that:
          - github_oauth_credentials.stat.exists
          - github_oauth_credentials.stat.isreg
          - github_oauth_credentials.stat.mode in ['0600', '0400']
        fail_msg: >-
          Create {{ dispatcher_github_oauth_env_file }} from
          github-oauth.env.example and chmod it 600. Never commit this file.
        quiet: true
      when: dispatcher_github_oauth_enabled | bool

    # Each name must be assigned on exactly one line, NAME=VALUE, with one
    # unquoted, non-empty value and no surrounding whitespace: systemd strips
    # quotes and surrounding whitespace from an environment file, which would
    # leave the dispatcher an empty value. systemd also trims blanks around
    # the name, so a padded or spaced assignment ( NAME= or NAME =) counts as
    # another assignment and is refused. Counts, per name, its assignment
    # lines, its non-empty ones and those of that form; the values are never
    # read into Ansible, so they cannot appear in output.
    - name: Count local GitHub OAuth credential entries
      ansible.builtin.command:
        argv: [sh, -c, 'grep -c -E "^[[:blank:]]*$1[[:blank:]]*=" "$2"; grep -c -E "^$1=.+" "$2"; grep -c -E "^$1=$3" "$2"', sh, "{{ item }}", "{{ dispatcher_github_oauth_env_file }}", '[^[:space:]"''\][^[:space:]\]*$']
      loop: [GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET]
      delegate_to: localhost
      register: github_oauth_credential_counts
      changed_when: false
      failed_when: false
      # Read-only, so it also runs under --check, where the assert needs it.
      check_mode: false
      when: dispatcher_github_oauth_enabled | bool

    - name: Require each GitHub OAuth credential once and non-empty
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['1', '1', '1']
        fail_msg: >-
          {{ dispatcher_github_oauth_env_file }}, created from
          github-oauth.env.example, must assign {{ item.item }} exactly once
          and non-empty, as NAME=VALUE with one unquoted value and no
          surrounding whitespace; padded or spaced assignments are refused.
        quiet: true
      loop: "{{ github_oauth_credential_counts.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: dispatcher_github_oauth_enabled | bool
    - name: Require complete browser credential URLs
      ansible.builtin.assert:
        that:
          - (dispatcher_authentication_public_url | length > 0) == (dispatcher_authentication_device_verification_url | length > 0)
        fail_msg: Set both dispatcher_authentication_public_url and dispatcher_authentication_device_verification_url, or leave both empty.
        quiet: true

    - name: Require a usable RIS ASN database refresh
      ansible.builtin.assert:
        that:
          - dispatcher_ris_asn_min_peers | string is match('^[1-9][0-9]*$')
          - dispatcher_ris_asn_database is match('^/')
          - (dispatcher_ris_asn_database | dirname) == (state_dir ~ '/dispatcher')
          - dispatcher_ris_asn_database is match('^[A-Za-z0-9/._-]+$')
        fail_msg: >-
          dispatcher_ris_asn_min_peers must be a positive integer and
          dispatcher_ris_asn_database a plain file name in the dispatcher state
          directory {{ state_dir }}/dispatcher, the only directory the refresh
          unit may write. Got {{ dispatcher_ris_asn_min_peers }} and
          {{ dispatcher_ris_asn_database }}.
        quiet: true
      when: dispatcher_ris_asn_enabled | bool

    - name: Require a supported CILogon issuer
      ansible.builtin.assert:
        that:
          - dispatcher_cilogon_oidc_issuer in ['https://cilogon.org', 'https://test.cilogon.org']
        fail_msg: dispatcher_cilogon_oidc_issuer must be an approved CILogon production or test issuer.
        quiet: true
      when: dispatcher_cilogon_oidc_enabled | bool

    - name: Inspect local CILogon credentials
      ansible.builtin.stat:
        path: "{{ dispatcher_cilogon_oidc_env_file }}"
      delegate_to: localhost
      register: cilogon_credentials_file
      when: dispatcher_cilogon_oidc_enabled | bool

    - name: Require local CILogon credentials
      ansible.builtin.assert:
        that:
          - cilogon_credentials_file.stat.exists
          - cilogon_credentials_file.stat.isreg
          - cilogon_credentials_file.stat.mode in ['0600', '0400']
        fail_msg: >-
          dispatcher_cilogon_oidc_enabled needs {{ dispatcher_cilogon_oidc_env_file }},
          created from cilogon_oidc.env.example with CILOGON_CLIENT_ID and
          CILOGON_CLIENT_SECRET each once and non-empty, and chmod 600.
          Never commit this file.
        quiet: true
      when: dispatcher_cilogon_oidc_enabled | bool

    # Each name must be assigned on exactly one line, NAME=VALUE, with one
    # unquoted, non-empty value and no surrounding whitespace: systemd strips
    # quotes and surrounding whitespace from an environment file, which would
    # leave the dispatcher an empty value. systemd also trims blanks around
    # the name, so a padded or spaced assignment ( NAME= or NAME =) counts as
    # another assignment and is refused. Counts, per name, its assignment
    # lines, its non-empty ones and those of that form; the values are never
    # read into Ansible, so they cannot appear in output.
    - name: Count local CILogon credential entries
      ansible.builtin.command:
        argv: [sh, -c, 'grep -c -E "^[[:blank:]]*$1[[:blank:]]*=" "$2"; grep -c -E "^$1=.+" "$2"; grep -c -E "^$1=$3" "$2"', sh, "{{ item }}", "{{ dispatcher_cilogon_oidc_env_file }}", '[^[:space:]"''\][^[:space:]\]*$']
      loop: [CILOGON_CLIENT_ID, CILOGON_CLIENT_SECRET]
      delegate_to: localhost
      register: cilogon_credentials
      changed_when: false
      failed_when: false
      # Read-only, so it also runs under --check, where the assert needs it.
      check_mode: false
      when: dispatcher_cilogon_oidc_enabled | bool

    - name: Require each CILogon credential once and non-empty
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['1', '1', '1']
        fail_msg: >-
          dispatcher_cilogon_oidc_enabled needs {{ dispatcher_cilogon_oidc_env_file }},
          created from cilogon_oidc.env.example, to assign {{ item.item }}
          exactly once and non-empty, as NAME=VALUE with one unquoted value
          and no surrounding whitespace; padded or spaced assignments are
          refused.
        quiet: true
      loop: "{{ cilogon_credentials.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: dispatcher_cilogon_oidc_enabled | bool

    - name: Require an authority for client certificates
      ansible.builtin.assert:
        that:
          - dispatcher_tls_ca_file is defined
          - dispatcher_tls_ca_file | length > 0
        fail_msg: >-
          dispatcher_require_client_cert is on, so dispatcher_tls_ca_file must
          name the authority the dispatcher checks executor certificates
          against. deploy-certs.yml installs it.
        quiet: true
      when: dispatcher_require_client_cert | bool

    # With client certificates required, the dispatcher admits an executor
    # only over the certificate bound to its ID in its database; a
    # certificate the deployment CA issued is not enough on its own. Every
    # inventory executor needs a way to be bound before enforcement is
    # enabled: the certificate the deployment installs and binds
    # (dispatcher_bind_inventory_executors), or its own enrollment token.
    # Checked here for the whole inventory, so a run limited to the
    # dispatcher cannot enable enforcement for an executor it would refuse.
    - name: Inspect the client certificates the deployment binds
      ansible.builtin.stat:
        path: "{{ certs_dir }}/executors/{{ hostvars[item].executor_id | default('') }}/client.crt"
      delegate_to: localhost
      register: binding_certificates
      loop: "{{ groups['executors'] | default([]) | sort }}"
      when:
        - dispatcher_require_client_cert | bool
        - dispatcher_bind_inventory_executors | bool
        - not (hostvars[item].executor_enrollment_token | default(''))

    - name: Require a binding for every inventory executor
      ansible.builtin.assert:
        that:
          - unbound | length == 0
        fail_msg: >-
          dispatcher_require_client_cert is on, and the dispatcher would then
          refuse {{ unbound | join(', ') }}: an executor is admitted only over
          the certificate bound to its executor_id.
          {% if dispatcher_bind_inventory_executors | bool %}Issue its client
          certificate with deploy/scripts/generate-certs.sh (`make
          deploy-certs`) so that {{ certs_dir }}/executors/<executor_id>/client.crt
          exists and the deployment binds it, or give it an
          executor_enrollment_token.{% else %}dispatcher_bind_inventory_executors
          is off, so the deployment binds none of them: turn it back on, or
          give each of them an executor_enrollment_token from
          `debuglet-dispatcher -enroll-executor <executor_id>`.{% endif %}
        quiet: true
      vars:
        unbound: >-
          {%- set out = [] -%}
          {%- for result in binding_certificates.results | default([]) -%}
          {%-   set h = hostvars[result.item] -%}
          {%-   if not (h.executor_enrollment_token | default(''))
                  and (not (dispatcher_bind_inventory_executors | bool) or not (result.stat.exists | default(false))) -%}
          {%-     set _ = out.append(result.item ~ ' (' ~ (h.executor_id | default('no executor_id')) ~ ')') -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}
      when: dispatcher_require_client_cert | bool

    - name: Require explicit public executor enrollment settings
      ansible.builtin.assert:
        that:
          - not (dispatcher_disable_tls | bool)
          - dispatcher_require_client_cert | bool
          - dispatcher_executor_onboarding_dispatcher_url is match('^https://(?:[A-Za-z0-9][A-Za-z0-9._-]*|\[[0-9A-Fa-f:]+\])(?::[0-9]+)?(?:/[^?#\s]*)?$')
          - (dispatcher_executor_onboarding_dispatcher_url | urlsplit('port')) is none or (dispatcher_executor_onboarding_dispatcher_url | urlsplit('port') | int) > 0
          - (dispatcher_executor_onboarding_dispatcher_url | urlsplit('port') | default(443, true) | int) <= 65535
        fail_msg: >-
          dispatcher_executor_onboarding_enabled requires native TLS with
          dispatcher_require_client_cert=true and an explicit
          dispatcher_executor_onboarding_dispatcher_url: an HTTPS URL with no
          credentials, query or fragment. Keep existing executors enrolled
          before requiring their certificates.
        quiet: true
      when: dispatcher_executor_onboarding_enabled | bool

    - name: Require public executor control endpoints
      ansible.builtin.assert:
        that:
          - item.value is match('^(?:[A-Za-z0-9][A-Za-z0-9._-]*|\[[0-9A-Fa-f:]+\]):[0-9]+$')
          - item.value.rsplit(':', 1)[-1] | int > 0
          - item.value.rsplit(':', 1)[-1] | int <= 65535
        fail_msg: >-
          {{ item.key }} must be the externally reachable native TLS host:port
          (bracket IPv6 addresses), with a port between 1 and 65535. Its host
          must match the dispatcher server certificate.
        quiet: true
      loop:
        - { key: dispatcher_executor_onboarding_grpc_address, value: "{{ dispatcher_executor_onboarding_grpc_address }}" }
        - { key: dispatcher_executor_onboarding_yamux_address, value: "{{ dispatcher_executor_onboarding_yamux_address }}" }
      loop_control:
        label: "{{ item.key }}"
      when: dispatcher_executor_onboarding_enabled | bool

    - name: Inspect dedicated executor enrollment material
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: enrollment_material
      loop:
        - { path: "{{ dispatcher_executor_onboarding_ca_cert }}", private: false }
        - { path: "{{ dispatcher_executor_onboarding_ca_key }}", private: true }
      when: dispatcher_executor_onboarding_enabled | bool

    - name: Require dedicated executor enrollment material
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - not item.item.private or item.stat.mode | default('') in ['0400', '0600']
        fail_msg: >-
          Set dispatcher_executor_onboarding_ca_cert and
          dispatcher_executor_onboarding_ca_key to a preprovisioned dedicated
          issuer certificate chain and matching key on the controller. The key
          must be owner-only (chmod 600); never use the deployment root CA key.
        quiet: true
      loop: "{{ enrollment_material.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('') }}"
      when: dispatcher_executor_onboarding_enabled | bool

    # dispatcher.toml.j2 renders these paths whenever the dispatcher serves
    # TLS, and the daemon refuses to start without them. A deployment can
    # serve TLS with no TLS executor in its inventory, so the dispatcher's own
    # material is checked on the dispatcher rather than by the executors.
    - name: Inspect the dispatcher certificate material
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      register: dispatcher_material
      loop:
        - "{{ certs_dir }}/ca.crt"
        - "{{ dispatcher_tls_ca_source }}"
        - "{{ certs_dir }}/dispatcher/server.crt"
        - "{{ certs_dir }}/dispatcher/server.key"
      when: not (dispatcher_disable_tls | bool)

    - name: Require the dispatcher certificate material
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg is defined and item.stat.isreg
        fail_msg: >-
          {{ item.item }} is missing. The dispatcher serves TLS on its own
          listeners, so the material has to exist before a deployment renders
          paths to it: run
          `make deploy-certs DISPATCHER_SANS="{{ san_request }}:{{ dispatcher_addr }}"`,
          or deploy/scripts/generate-certs.sh followed by
          ansible/deploy-certs.yml.
        quiet: true
      loop: "{{ dispatcher_material.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: not (dispatcher_disable_tls | bool)

    # Both daemons refuse an authority whose root has expired, and an executor
    # verifies TLS only where the dispatcher serves it, so the root is checked
    # once, here.
    - name: Require an unexpired deployment authority
      ansible.builtin.command:
        cmd: "openssl x509 -in {{ certs_dir }}/ca.crt -checkend 0 -noout"
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false
      register: deployment_ca
      failed_when: deployment_ca.rc != 0
      when: not (dispatcher_disable_tls | bool)

    - name: Require a complete and usable server certificate
      ansible.builtin.command:
        cmd: >-
          openssl verify -CAfile {{ certs_dir }}/ca.crt
          -untrusted {{ certs_dir }}/dispatcher/server.crt
          -purpose sslserver {{ certs_dir }}/dispatcher/server.crt
      delegate_to: localhost
      changed_when: false
      check_mode: false
      register: dispatcher_chain
      failed_when: dispatcher_chain.rc != 0
      when: not (dispatcher_disable_tls | bool)

    - name: Validate the dedicated executor enrollment issuer
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import ipaddress, json, subprocess, sys
            issuer, key, trust, root, server, endpoints = json.load(sys.stdin)
            def openssl(*args):
                result = subprocess.run(["openssl", *args], capture_output=True, text=True)
                if result.returncode:
                    sys.exit("Executor enrollment issuer validation failed: " + result.stderr.strip())
                return result.stdout
            details = openssl("x509", "-in", issuer, "-noout", "-text")
            if "CA:TRUE" not in details or "Certificate Sign" not in details:
                sys.exit("dispatcher_executor_onboarding_ca_cert must be a certificate-signing authority")
            public = openssl("x509", "-in", issuer, "-pubkey", "-noout")
            if public == openssl("x509", "-in", root, "-pubkey", "-noout"):
                sys.exit("Use a dedicated enrollment issuer, never the deployment root CA key")
            if public == openssl("x509", "-in", server, "-pubkey", "-noout"):
                sys.exit("Use a dedicated enrollment issuer, never the dispatcher server key")
            if public != openssl("pkey", "-in", key, "-passin", "pass:", "-pubout"):
                sys.exit("dispatcher_executor_onboarding_ca_key does not match its certificate")
            if ("X509v3 Extended Key Usage" in details and
                    "TLS Web Client Authentication" not in details and "Any Extended Key Usage" not in details):
                sys.exit("Enrollment issuer must permit client authentication")
            # A cert-sign-only CA is not itself a TLS client leaf. The daemon
            # also checks client-auth constraints throughout the issuer chain.
            openssl("verify", "-CAfile", trust, "-untrusted", issuer, "-purpose", "any", issuer)
            sans = openssl("x509", "-in", server, "-noout", "-ext", "subjectAltName")
            for endpoint in endpoints:
                host = endpoint.rsplit(":", 1)[0].strip("[]")
                try:
                    ipaddress.ip_address(host)
                    name_check = "-verify_ip"
                except ValueError:
                    name_check = "-verify_hostname"
                    if "DNS:" not in sans:
                        sys.exit("Dispatcher certificate needs DNS subjectAltName entries for " + host)
                openssl("verify", "-CAfile", trust, "-untrusted", server,
                        "-purpose", "sslserver", name_check, host, server)
        stdin: >-
          {{ [dispatcher_executor_onboarding_ca_cert,
              dispatcher_executor_onboarding_ca_key,
              dispatcher_tls_ca_source, certs_dir ~ '/ca.crt',
              certs_dir ~ '/dispatcher/server.crt',
              [dispatcher_executor_onboarding_grpc_address,
               dispatcher_executor_onboarding_yamux_address]] | to_json }}
      changed_when: false
      check_mode: false
      when: dispatcher_executor_onboarding_enabled | bool

    # The dispatcher renders the executors' operator labels (executor_display_*
    # in group_vars/executors.yml) and refuses to start on a malformed one, so
    # they are checked here, for every executor in the inventory, before the
    # dispatcher is touched.
    - name: Require well-formed operator labels for the executors
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value | length <= 64
          - item.value == item.value | trim
          - item.value is not search('[\\x00-\\x1f\\x7f]')
          - item.key != 'country' or item.value == '' or item.value is match('^[A-Z]{2}$')
        fail_msg: >-
          executor_display_{{ item.key }} of {{ item.host }} must be printable
          text of at most 64 characters without leading or trailing space,
          and a country an upper-case ISO 3166-1 alpha-2 code. Got
          {{ item.value | to_json }}.
        quiet: true
      loop: >-
        {%- set out = [] -%}
        {%- for name in groups['executors'] | default([]) | sort -%}
        {%-   for key in ['name', 'city', 'country', 'network'] -%}
        {%-     set _ = out.append({'host': name, 'key': key,
                  'value': hostvars[name]['executor_display_' ~ key] | default('')}) -%}
        {%-   endfor -%}
        {%- endfor -%}
        {{ out }}
      loop_control:
        label: "{{ item.host }} executor_display_{{ item.key }}"

    - name: Require one labelled table per executor identity
      ansible.builtin.assert:
        that:
          - labelled | unique | length == labelled | length
        fail_msg: >-
          Two labelled executors in the inventory share an executor_id, which
          would render the same [executors."ID"] table twice: {{ labelled | to_json }}.
        quiet: true
      vars:
        labelled: >-
          {%- set out = [] -%}
          {%- for name in groups['executors'] | default([]) -%}
          {%-   set h = hostvars[name] -%}
          {%-   if h.executor_id is defined and (h.executor_display_name | default('') ~ h.executor_display_city | default('')
                  ~ h.executor_display_country | default('') ~ h.executor_display_network | default('')) -%}
          {%-     set _ = out.append(h.executor_id) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

- name: Check executor variables
  hosts: executors
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ipv4_literal: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    # The name the executor verifies the dispatcher against: the template
    # renders executor_tls_server_name when it is set and the dialled address
    # otherwise.
    verified_name: "{{ executor_tls_server_name | default('', true) or dispatcher_addr }}"
    verified_ip: "{{ verified_name is match(ipv4_literal) }}"
    # A client matches an IP-literal host against IP entries only, a name
    # against DNS entries, and a wildcard only in the leftmost label of a name
    # that has a parent.
    san_entry: "{{ (verified_ip | bool) | ternary('IP Address', 'DNS') }}"
    san_request: "{{ (verified_ip | bool) | ternary('IP', 'DNS') }}"
    san_pattern: >-
      {{ san_entry }}:{{ verified_name | regex_escape }}(,|$)
      {%- set parent = (verified_ip | bool) | ternary('', verified_name.split('.')[1:] | join('.')) %}
      {%- if parent %}|DNS:\*\.{{ parent | regex_escape }}(,|$){% endif %}

  tasks:
    - name: Require absolute executor paths
      ansible.builtin.assert:
        that:
          - item is string
          - item is match('^/')
          - item != '/'
        fail_msg: "Executor configuration, state and binary paths must be absolute."
        quiet: true
      loop:
        - "{{ executor_config_dir }}"
        - "{{ executor_state_dir }}"
        - "{{ executor_binary }}"

    - name: Require executor state outside configuration
      ansible.builtin.assert:
        that:
          - not (executor_state_dir ~ '/') is match('^' ~ (config_dir | regex_escape) ~ '/')
          - not (executor_state_dir ~ '/') is match('^' ~ (executor_config_dir | regex_escape) ~ '/')
          - not (executor_config_dir ~ '/') is match('^' ~ (executor_state_dir | regex_escape) ~ '/')
        fail_msg: "executor_state_dir and configuration must be separate directory trees."
        quiet: true

    - name: Require the dispatcher address
      ansible.builtin.assert:
        that:
          - dispatcher_addr is defined
          - dispatcher_addr is string
          - dispatcher_addr | length > 0
        fail_msg: >-
          dispatcher_addr is required and has no default. Set it per
          environment, for example
          -e dispatcher_addr=dispatcher.example.com. See
          deploy/ansible/group_vars/all.yml.
        quiet: true

    - name: Require the dispatcher address to be a bare host
      ansible.builtin.assert:
        that:
          - dispatcher_addr is match('^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$')
        fail_msg: >-
          dispatcher_addr must be a bare host name or IP address without a
          scheme, port or path; the ports come from dispatcher_grpc_port and
          dispatcher_http_port. Got {{ dispatcher_addr }}.
        quiet: true

    - name: Require a UUID executor identity
      ansible.builtin.assert:
        that:
          - executor_id is defined
          - executor_id is string
          - executor_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - executor_id != '00000000-0000-0000-0000-000000000000'
        fail_msg: >-
          executor_id is required per host and must be a lowercase UUID, the
          identity form the CLI generates and the dispatcher records. Set it
          in the inventory for {{ inventory_hostname }}. See
          deploy/ansible/group_vars/executors.yml.
        quiet: true

    # The token is a secret, so neither it nor the expression testing it is
    # shown.
    - name: Require a well-formed enrollment token
      ansible.builtin.assert:
        that:
          - executor_enrollment_token is string
          - executor_enrollment_token is match('^dbx_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$')
          - executor_enrollment_token | length <= 128
        fail_msg: >-
          executor_enrollment_token of {{ inventory_hostname }} must be the
          token `debuglet-dispatcher -enroll-executor` printed, dbx_ followed
          by two base64url parts joined by a dot.
        quiet: true
      no_log: true
      when: executor_enrollment_token | default('') | length > 0

    - name: Require usable executor resources
      ansible.builtin.assert:
        that:
          - executor_capacity | int > 0
          - executor_max_debuglets | int > 0
          - (tesla_delay if tesla_delay is defined else tesla_epoch_seconds) | int > 0
          - tesla_disclosure_delay_epochs | int == 0 or tesla_disclosure_delay_epochs | int >= 2
          - >-
            tesla_disclosure_delay_epochs | int == 0 or
            (tesla_disclosure_delay_epochs | int - 1) * ((tesla_delay if tesla_delay is defined else tesla_epoch_seconds) | int) >= 10
          - tesla_chain_length | int >= 0
          - executor_packet_counter in ['auto', 'fallback']
          - (executor_packet_counter == 'fallback') or (executor_enable_bpf | bool)
        fail_msg: >-
          executor_capacity, executor_max_debuglets and tesla_epoch_seconds
          (or the deprecated tesla_delay) must be positive;
          tesla_disclosure_delay_epochs must be 0 (derived) or at least 2
          with (d - 1) * tesla_epoch_seconds of at least 10 seconds;
          tesla_chain_length must not be negative; and the packet
          counter must be auto with BPF enabled or explicit fallback.
        quiet: true

    - name: Require client credentials when the control channel uses TLS
      ansible.builtin.assert:
        that:
          - certs_dir is defined
          - certs_dir | length > 0
        fail_msg: >-
          executor_disable_tls is false, so the executor reads the CA, the
          client certificate and the key deploy-certs.yml installs from
          certs_dir. Issue them with deploy/scripts/generate-certs.sh, giving
          DISPATCHER_SANS every name an executor dials.
        quiet: true
      when: not (executor_disable_tls | bool)

    # The executor verifies the name it dialled, so a certificate can only be
    # issued for a dispatcher that is named. A cleartext control channel is
    # supported for a dispatcher on the same machine and nowhere else.
    - name: Require a loopback dispatcher for a cleartext control channel
      ansible.builtin.assert:
        that:
          - dispatcher_addr is match('^127\\.[0-9.]+$')
        fail_msg: >-
          executor_disable_tls is true but dispatcher_addr is
          {{ dispatcher_addr }}. Cleartext is supported only for a dispatcher
          the executor reaches at a literal loopback address such as
          127.0.0.1; a name is not accepted, not even localhost. For anything
          else serve TLS and let the executor verify it.
        quiet: true
      when: executor_disable_tls | bool

    - name: Require the dispatcher to serve what the executor verifies
      ansible.builtin.assert:
        that:
          - not (dispatcher_disable_tls | bool)
        fail_msg: >-
          executor_disable_tls is false but dispatcher_disable_tls is true, so
          the executor would verify a certificate nothing presents. Nothing
          proxies the executor path: the dispatcher serves its own listeners.
        quiet: true
      when: not (executor_disable_tls | bool)

    # A deployment renders certificate paths whether or not the material
    # exists, and both daemons refuse to start without it, so the material is
    # checked here rather than discovered as a crash loop. site.yml does not
    # install certificates: issue and install them first, with
    # `make deploy-certs DISPATCHER_SANS=...`.
    - name: Inspect the certificate material
      ansible.builtin.stat:
        path: "{{ item }}"
      delegate_to: localhost
      register: deployment_material
      loop:
        - "{{ certs_dir }}/ca.crt"
        - "{{ certs_dir }}/executors/{{ executor_id }}/client.crt"
        - "{{ certs_dir }}/executors/{{ executor_id }}/client.key"
      when: not (executor_disable_tls | bool)

    - name: Require the certificate material
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg is defined and item.stat.isreg
        fail_msg: >-
          {{ item.item }} is missing. The dispatcher serves TLS and every
          executor verifies it, so the material has to exist before a
          deployment renders paths to it: run
          `make deploy-certs DISPATCHER_SANS="{{ san_request }}:{{ verified_name }}"`,
          or deploy/scripts/generate-certs.sh followed by
          ansible/deploy-certs.yml.
        quiet: true
      loop: "{{ deployment_material.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: not (executor_disable_tls | bool)

    # The executor refuses a leaf whose chain to the configured root is
    # incomplete and a client certificate without the client-authentication
    # extended key usage, so both are checked on the material that is about to
    # be installed; the root itself is checked in the dispatcher play above.
    # -untrusted offers the leaf file's own contents as intermediates, without
    # which openssl refuses a leaf that carries the chain up to the root — the
    # form deploy/README.md prescribes for material from another authority and
    # the form the daemons accept.
    - name: Require a complete and usable certificate chain
      ansible.builtin.command:
        cmd: >-
          openssl verify -CAfile {{ certs_dir }}/ca.crt
          -untrusted {{ item.leaf }}
          -purpose {{ item.purpose }} {{ item.leaf }}
      delegate_to: localhost
      changed_when: false
      check_mode: false
      register: deployment_chain
      failed_when: deployment_chain.rc != 0
      loop:
        - purpose: sslclient
          leaf: "{{ certs_dir }}/executors/{{ executor_id }}/client.crt"
      loop_control:
        label: "{{ item.leaf }}"
      when: not (executor_disable_tls | bool)

    # The executor verifies the name it dialled against the certificate's
    # subjectAltName, so a certificate that does not carry it ends every
    # connection at the handshake. The name is executor_tls_server_name when
    # it is set and dispatcher_addr otherwise, which is what the template
    # renders.
    - name: Read the dispatcher certificate's subject alternative names
      ansible.builtin.command:
        cmd: >-
          openssl x509 -in {{ certs_dir }}/dispatcher/server.crt
          -noout -ext subjectAltName
      delegate_to: localhost
      changed_when: false
      check_mode: false
      register: deployment_sans
      when: not (executor_disable_tls | bool)

    - name: Require the dispatcher certificate to name the verified host
      ansible.builtin.assert:
        that:
          - deployment_sans.stdout is search(san_pattern)
        fail_msg: >-
          {{ certs_dir }}/dispatcher/server.crt carries no {{ san_entry }}
          entry for {{ verified_name }}, so this executor's connection would
          end at the handshake. Reissue it with
          `make deploy-certs DISPATCHER_SANS="{{ san_request }}:{{ verified_name }}"`.
        quiet: true
      when: not (executor_disable_tls | bool)

    - name: Require a usable name to verify the dispatcher against
      ansible.builtin.assert:
        that:
          - executor_tls_server_name is match('^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$')
          - not (executor_disable_tls | bool)
        fail_msg: >-
          executor_tls_server_name names the certificate to verify, so it
          needs a verifying channel and a bare name with no scheme or port.
          Got {{ executor_tls_server_name }} with executor_disable_tls
          {{ executor_disable_tls }}.
        quiet: true
      when: executor_tls_server_name | default('') | length > 0

    # A bare address: the executor advertises it as given and the dispatcher
    # looks it up, so a port, scheme or URL here would only report not_ip.
    - name: Require a bare public address
      ansible.builtin.assert:
        that:
          - executor_public_host is string
          - executor_public_host == '' or executor_public_host is match('^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$')
            or executor_public_host is match('^[0-9A-Fa-f:]*:[0-9A-Fa-f:.]*$')
        fail_msg: >-
          executor_public_host must be empty or the executor's bare public
          address, with no scheme or port. Got {{ executor_public_host }}.
        quiet: true

    - name: Require the IPv4 reflector to be a literal endpoint
      ansible.builtin.assert:
        that:
          - (executor_connectivity_ipv4_reflector | trim) is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]{1,5}$')
        fail_msg: >-
          executor_connectivity_ipv4_reflector must be a literal IPv4
          address:port of this executor's dispatcher, or empty. Got
          {{ executor_connectivity_ipv4_reflector | trim }}.
        quiet: true
      when: executor_connectivity_ipv4_reflector | trim | length > 0
