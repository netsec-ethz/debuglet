---
- name: Require exact compiler identity and artifact trust
  ansible.builtin.assert:
    that:
      - studio_source_sha is match('^[0-9a-f]{40}$')
      - (studio_archive_sha256 is match('^[0-9a-f]{64}$') and studio_trust_file == '' and studio_signer == '') or (studio_archive_sha256 == '' and studio_trust_file | length > 0 and studio_signer | length > 0)
      - studio_runtime_directory is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - studio_service_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - studio_user != debuglet_user
      - studio_user != (executor_user | default('debuglet-executor'))
      - studio_temporary_bytes | int > 0
      - studio_temporary_bytes | int <= 1073741824
    fail_msg: Supply an exact source and independently verified archive digest or approved release trust; Studio needs its own service identity.
    quiet: true

- name: Select compiler artifact trust arguments
  ansible.builtin.set_fact:
    studio_archive: "debuglet-studio-{{ studio_source_sha }}-linux-amd64.tar.gz"
    studio_trust_arguments: "{{ ['--archive-sha256', studio_archive_sha256] if studio_archive_sha256 != '' else ['--trust', studio_trust_file, '--signer', studio_signer] }}"

- name: Verify compiler bundle on the controller before copying it
  ansible.builtin.command:
    argv: "{{ [ansible_playbook_python, playbook_dir ~ '/../studio/install.py', 'verify', '--directory', studio_release_directory, '--source', studio_source_sha] + studio_trust_arguments }}"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Create compiler socket group
  ansible.builtin.group:
    name: "{{ studio_socket_group }}"
    system: true
  when: debuglet_manage_account | bool

- name: Create the dedicated compiler account
  ansible.builtin.user:
    name: "{{ studio_user }}"
    group: "{{ studio_socket_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /nonexistent
  when: debuglet_manage_account | bool

- name: Create compiler staging directory
  ansible.builtin.file:
    path: "{{ studio_staging_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy the verified compiler release
  ansible.builtin.copy:
    src: "{{ studio_release_directory }}/{{ item }}"
    dest: "{{ studio_staging_directory }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ [studio_archive, 'studio-release.json'] + (['studio-release.json.sig'] if studio_archive_sha256 == '' else []) }}"

- name: Copy the public release trust
  ansible.builtin.copy:
    src: "{{ studio_trust_file }}"
    dest: "{{ studio_staging_directory }}/allowed-signers"
    owner: root
    group: root
    mode: "0600"
  when: studio_archive_sha256 == ''

- name: Copy the compiler installer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../studio/install.py"
    dest: "{{ studio_staging_directory }}/install.py"
    owner: root
    group: root
    mode: "0600"

- name: Install or verify the immutable compiler bundle
  vars:
    target_trust: "{{ ['--archive-sha256', studio_archive_sha256] if studio_archive_sha256 != '' else ['--trust', studio_staging_directory ~ '/allowed-signers', '--signer', studio_signer] }}"
  ansible.builtin.command:
    argv: "{{ ['python3', studio_staging_directory ~ '/install.py', 'install', '--directory', studio_staging_directory, '--source', studio_source_sha, '--prefix', studio_prefix] + target_trust }}"
  register: studio_install
  changed_when: (studio_install.stdout | from_json).changed
  notify: Restart Studio worker

- name: Install compiler systemd service
  ansible.builtin.template:
    src: studio.service.j2
    dest: "{{ systemd_unit_dir }}/{{ studio_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Studio worker

- name: Enable and start the compiler
  ansible.builtin.systemd:
    name: "{{ studio_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: debuglet_manage_services | bool
