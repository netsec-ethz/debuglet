---
- name: Create dispatcher config directory
  ansible.builtin.file:
    path: "{{ config_dir }}/dispatcher"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0700"

- name: Provision dispatcher database (schema only, preserved on redeploy)
  ansible.builtin.copy:
    src: "{{ dist_dir }}/dispatcher-seed.db" # built by `make deploy-seed-db`, not committed
    dest: "{{ config_dir }}/dispatcher/dispatcher.db"
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0600"
    force: false # never overwrite an existing DB (would wipe persisted debuglet state)
  notify: Restart dispatcher

- name: Install dispatcher binary
  ansible.builtin.copy:
    src: "{{ dist_dir }}/debuglet-dispatcher"
    dest: "{{ install_prefix }}/bin/debuglet-dispatcher"
    owner: root
    group: root
    mode: "0755"
  notify: Restart dispatcher

- name: Deploy dispatcher configuration
  ansible.builtin.template:
    src: dispatcher.toml.j2
    dest: "{{ config_dir }}/dispatcher/dispatcher.toml"
    owner: "{{ debuglet_user }}"
    mode: "0640"
  notify: Restart dispatcher

- name: Install dispatcher systemd unit
  ansible.builtin.template:
    src: dispatcher.service.j2
    dest: /etc/systemd/system/debuglet-dispatcher.service
    owner: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart dispatcher

- name: Enable and start dispatcher
  ansible.builtin.systemd:
    name: debuglet-dispatcher
    enabled: true
    state: started
    daemon_reload: true
