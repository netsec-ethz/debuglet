---
- name: Create dispatcher configuration directory
  ansible.builtin.file:
    path: "{{ config_dir }}/dispatcher"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0700"

# Writable state stays separate from read-only configuration.
- name: Create dispatcher state directory
  ansible.builtin.file:
    path: "{{ state_dir }}/dispatcher"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0700"

- name: Inspect the dispatcher database locations
  ansible.builtin.stat:
    path: "{{ item }}/dispatcher/dispatcher.db"
  loop:
    - "{{ config_dir }}"
    - "{{ state_dir }}"
  register: dispatcher_databases

- name: Require an explicit upgrade of existing dispatcher state
  ansible.builtin.assert:
    that:
      - (dispatcher_databases.results[0].stat.size | default(0) | int == 0) or (dispatcher_databases.results[1].stat.size | default(0) | int > 0)
    fail_msg: >-
      Existing dispatcher state at {{ config_dir }}/dispatcher/dispatcher.db
      has been preserved; no seed or configuration change has been applied.
      The deployment does not upgrade a database. Back the database up, place
      it at {{ state_dir }}/dispatcher/dispatcher.db, deploy again, then run
      upgrade-database.yml.
    quiet: true

- name: Provision dispatcher database (schema only, preserved on redeploy)
  ansible.builtin.copy:
    src: "{{ dist_dir }}/dispatcher-seed.db" # built by `make deploy-seed-db`, not committed
    dest: "{{ state_dir }}/dispatcher/dispatcher.db"
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0600"
    force: false # never overwrite an existing database: it holds recorded runs
  notify: Restart dispatcher

- name: Deploy dispatcher configuration
  ansible.builtin.template:
    src: dispatcher.toml.j2
    dest: "{{ config_dir }}/dispatcher/dispatcher.toml"
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0640"
  notify: Restart dispatcher

- name: Deploy GitHub OAuth credentials
  ansible.builtin.copy:
    src: "{{ dispatcher_github_oauth_env_file }}"
    dest: "{{ config_dir }}/dispatcher/github-oauth.env"
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0600"
  no_log: true
  when: dispatcher_github_oauth_enabled | bool
  notify: Restart dispatcher

- name: Install dispatcher systemd unit
  ansible.builtin.template:
    src: dispatcher.service.j2
    dest: "{{ systemd_unit_dir }}/debuglet-dispatcher.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart dispatcher

- name: Enable and start dispatcher
  ansible.builtin.systemd:
    name: debuglet-dispatcher
    enabled: true
    state: started
    daemon_reload: true
  when: debuglet_manage_services | bool
