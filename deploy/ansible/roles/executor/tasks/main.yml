---
- name: Create executor config directory
  ansible.builtin.file:
    path: "{{ config_dir }}/executor"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: '0700'

- name: Create BPF object directory
  ansible.builtin.file:
    path: "{{ bpf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# --- Binaries & runtime library ---

- name: Install executor binary
  ansible.builtin.copy:
    src: "{{ dist_dir }}/debuglet-executor"
    dest: "{{ install_prefix }}/bin/debuglet-executor"
    owner: root
    group: root
    mode: '0755'
  notify: Restart executor

- name: Deploy eBPF tagger object
  ansible.builtin.copy:
    src: "{{ dist_dir }}/tagger.o"
    dest: "{{ bpf_dir }}/tagger.o"
    owner: root
    group: root
    mode: '0644'
  when: executor_enable_bpf | default(true)
  notify: Restart executor

# --- TLS credentials ---

- name: Deploy CA certificate
  ansible.builtin.copy:
    src: "{{ certs_dir }}/ca.crt"
    dest: "{{ config_dir }}/executor/ca.crt"
    owner: "{{ debuglet_user }}"
    mode: '0644'
  notify: Restart executor

- name: Deploy executor client certificate
  ansible.builtin.copy:
    # executor_id defaults to inventory_hostname when not set in host_vars
    src: "{{ certs_dir }}/executors/{{ executor_id | default(inventory_hostname) }}/client.crt"
    dest: "{{ config_dir }}/executor/client.crt"
    owner: "{{ debuglet_user }}"
    mode: '0640'
  notify: Restart executor

- name: Deploy executor client key
  ansible.builtin.copy:
    src: "{{ certs_dir }}/executors/{{ executor_id | default(inventory_hostname) }}/client.key"
    dest: "{{ config_dir }}/executor/client.key"
    owner: "{{ debuglet_user }}"
    mode: '0600'
  notify: Restart executor

# --- Config ---

- name: Deploy executor config
  ansible.builtin.template:
    src: executor.toml.j2
    dest: "{{ config_dir }}/executor/executor.toml"
    owner: "{{ debuglet_user }}"
    mode: '0640'
  notify: Restart executor

# --- Linux capabilities for eBPF ---

- name: Set eBPF capabilities on executor binary
  community.general.capabilities:
    path: "{{ install_prefix }}/bin/debuglet-executor"
    capability: "cap_net_admin,cap_bpf+ep"
    state: present
  when: executor_enable_bpf | default(true)

# --- Systemd service ---

- name: Install executor systemd unit
  ansible.builtin.template:
    src: executor.service.j2
    dest: /etc/systemd/system/debuglet-executor.service
    owner: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart executor

- name: Enable and start executor
  ansible.builtin.systemd:
    name: debuglet-executor
    enabled: true
    state: started
    daemon_reload: true
