---
- name: Check if local certificate directory exists
  delegate_to: localhost
  run_once: true
  ansible.builtin.stat:
    path: "{{ certs_dir }}"
  register: _local_certs

- name: Create executor config directory
  ansible.builtin.file:
    path: "{{ config_dir }}/executor"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0700"

- name: Install executor binary
  ansible.builtin.copy:
    src: "{{ dist_dir }}/debuglet-executor"
    dest: "{{ install_prefix }}/bin/debuglet-executor"
    owner: root
    group: root
    mode: "0755"
  notify: Restart executor

- name: Deploy CA certificate
  ansible.builtin.copy:
    src: "{{ certs_dir }}/ca.crt"
    dest: "{{ config_dir }}/executor/ca.crt"
    owner: "{{ debuglet_user }}"
    mode: "0644"
  notify: Restart executor
  when: _local_certs.stat.exists

- name: Deploy executor client certificate
  ansible.builtin.copy:
    src: "{{ certs_dir }}/executors/{{ executor_id }}/client.crt"
    dest: "{{ config_dir }}/executor/client.crt"
    owner: "{{ debuglet_user }}"
    mode: "0640"
  notify: Restart executor
  when: _local_certs.stat.exists

- name: Deploy executor client key
  ansible.builtin.copy:
    src: "{{ certs_dir }}/executors/{{ executor_id }}/client.key"
    dest: "{{ config_dir }}/executor/client.key"
    owner: "{{ debuglet_user }}"
    mode: "0600"
  notify: Restart executor
  when: _local_certs.stat.exists

- name: Deploy executor configuration
  ansible.builtin.template:
    src: executor.toml.j2
    dest: "{{ config_dir }}/executor/executor.toml"
    owner: "{{ debuglet_user }}"
    mode: "0640"
  notify: Restart executor

- name: Set eBPF capabilities on executor binary
  community.general.capabilities:
    path: "{{ install_prefix }}/bin/debuglet-executor"
    capability: "cap_net_admin,cap_bpf+ep"
    state: present
  when: executor_enable_bpf | default(true)

- name: Install executor systemd unit
  ansible.builtin.template:
    src: executor.service.j2
    dest: /etc/systemd/system/debuglet-executor.service
    owner: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart executor

- name: Enable and start executor
  ansible.builtin.systemd:
    name: debuglet-executor
    enabled: true
    state: started
    daemon_reload: true
