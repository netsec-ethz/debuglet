---
- name: Create executor configuration directory
  ansible.builtin.file:
    path: "{{ executor_config_dir }}"
    state: directory
    owner: "{{ executor_user }}"
    group: "{{ executor_group }}"
    mode: "0700"

# Writable state stays separate from read-only configuration.
- name: Create executor state directory
  ansible.builtin.file:
    path: "{{ executor_state_dir }}"
    state: directory
    owner: "{{ executor_user }}"
    group: "{{ executor_group }}"
    mode: "0700"

- name: Inspect the executor database
  ansible.builtin.stat:
    path: "{{ executor_state_dir }}/executor.db"
  register: executor_db

- name: Inspect existing executor databases at previous locations
  ansible.builtin.stat:
    path: "{{ item }}/executor.db"
  loop: "{{ [executor_legacy_config_dir, executor_legacy_state_dir, executor_config_dir] | unique }}"
  register: executor_previous_databases

- name: Require an explicit upgrade of existing executor state
  ansible.builtin.assert:
    that:
      - not (item.stat.exists and (item.stat.size | default(0) | int > 0)) or (executor_db.stat.size | default(0) | int > 0)
    fail_msg: >-
      Existing executor state at {{ item.item }}/executor.db has been preserved.
      This alpha does not upgrade old database schemas. Back up and establish
      compatibility before placing the upgraded database in {{ executor_state_dir }};
      no seed or legacy service change has been applied.
    quiet: true
  loop: "{{ executor_previous_databases.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the legacy executor unit
  ansible.builtin.stat:
    path: "{{ systemd_unit_dir }}/{{ executor_legacy_service }}.service"
  register: executor_legacy_unit

- name: Require explicit ownership of legacy executor retirement
  ansible.builtin.assert:
    that:
      - not executor_legacy_unit.stat.exists or executor_retire_legacy_install | bool
    fail_msg: >-
      The unsuffixed {{ executor_legacy_service }} unit may belong to another
      environment. Check its ownership and state before explicitly setting
      executor_retire_legacy_install=true; it has not been stopped.
    quiet: true

- name: Stop and disable the legacy executor unit
  ansible.builtin.systemd:
    name: "{{ executor_legacy_service }}"
    state: stopped
    enabled: false
  when:
    - debuglet_manage_services | bool
    - executor_retire_legacy_install | bool
    - executor_legacy_unit.stat.exists | default(false)

# An interrupted initial start can leave a zero-byte database. It contains no
# state; unlike a nonempty database it must not block installation of the seed.
- name: Discard an empty executor database
  ansible.builtin.file:
    path: "{{ executor_state_dir }}/executor.db"
    state: absent
  when:
    - executor_db.stat.exists
    - executor_db.stat.size == 0

- name: Provision executor database (schema only, preserved on redeploy)
  ansible.builtin.copy:
    src: "{{ dist_dir }}/executor-seed.db" # built by `make deploy-seed-db`, not committed
    dest: "{{ executor_state_dir }}/executor.db"
    owner: "{{ executor_user }}"
    group: "{{ executor_group }}"
    mode: "0600"
    force: false # never overwrite an existing database: it holds recorded runs
  notify: Restart executor

# The rendered configuration carries the TESLA seed, so its content stays out
# of task output and diffs.
- name: Deploy executor configuration
  ansible.builtin.template:
    src: executor.toml.j2
    dest: "{{ executor_config_dir }}/executor.toml"
    owner: "{{ executor_user }}"
    group: "{{ executor_group }}"
    mode: "0640"
  no_log: true
  notify: Restart executor

# Without these the TC egress tagger cannot attach and probes leave untagged,
# so this is what makes packet attribution verifiable. Some hosts (restricted
# containers, noexec/nosuid or non-xattr filesystems) reject file capabilities
# outright; that costs those nodes their attribution tags but must not fail the
# whole deploy, so the failure is reported rather than fatal. Set
# executor_enable_bpf=false on such a host to skip the attempt entirely.
- name: Set eBPF capabilities on executor binary
  community.general.capabilities:
    # The installed payload itself, not the link next to it: file
    # capabilities live on the executable.
    path: "{{ payload_prefix }}/lib/debuglet/{{ debuglet_release.version }}/bin/debuglet-executor"
    capability: "cap_net_admin,cap_bpf+ep"
    state: present
  when: executor_enable_bpf | default(true)
  register: executor_setcap
  failed_when: false

- name: Warn when eBPF capabilities could not be set
  ansible.builtin.debug:
    msg: >-
      Could not set cap_net_admin,cap_bpf on the executor binary
      ({{ executor_setcap.msg | default('unknown error') }}). This node will
      run without the eBPF egress tagger, so its probes will carry no
      attribution tag and cannot be verified.
  when:
    - executor_enable_bpf | default(true)
    - executor_setcap.failed | default(false)

- name: Install executor systemd unit
  ansible.builtin.template:
    src: executor.service.j2
    dest: "{{ systemd_unit_dir }}/{{ executor_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart executor

- name: Enable and start executor
  ansible.builtin.systemd:
    name: "{{ executor_service }}"
    enabled: true
    state: started
    daemon_reload: true
  when: debuglet_manage_services | bool
