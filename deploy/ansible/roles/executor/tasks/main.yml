---
- name: Create executor config directory
  ansible.builtin.file:
    path: "{{ config_dir }}/executor"
    state: directory
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0700"

- name: Provision executor database (schema only, preserved on redeploy)
  ansible.builtin.copy:
    src: "{{ dist_dir }}/executor-seed.db" # built by `make deploy-seed-db`, not committed
    dest: "{{ config_dir }}/executor/executor.db"
    owner: "{{ debuglet_user }}"
    group: "{{ debuglet_group }}"
    mode: "0600"
    force: false # never overwrite an existing DB (would wipe persisted debuglet state)
  notify: Restart executor

- name: Install executor binary
  ansible.builtin.copy:
    src: "{{ dist_dir }}/debuglet-executor"
    dest: "{{ install_prefix }}/bin/debuglet-executor"
    owner: root
    group: root
    mode: "0755"
  notify: Restart executor

- name: Deploy executor configuration
  ansible.builtin.template:
    src: executor.toml.j2
    dest: "{{ config_dir }}/executor/executor.toml"
    owner: "{{ debuglet_user }}"
    mode: "0640"
  notify: Restart executor

# Without these the TC egress tagger cannot attach and probes leave untagged,
# so this is what makes packet attribution verifiable. Some hosts (restricted
# containers, noexec/nosuid or non-xattr filesystems) reject file capabilities
# outright; that costs those nodes their attribution tags but must not fail the
# whole deploy, so the failure is reported rather than fatal. Set
# executor_enable_bpf=false on such a host to skip the attempt entirely.
- name: Set eBPF capabilities on executor binary
  community.general.capabilities:
    path: "{{ install_prefix }}/bin/debuglet-executor"
    capability: "cap_net_admin,cap_bpf+ep"
    state: present
  when: executor_enable_bpf | default(true)
  register: executor_setcap
  failed_when: false

- name: Warn when eBPF capabilities could not be set
  ansible.builtin.debug:
    msg: >-
      Could not set cap_net_admin,cap_bpf on the executor binary
      ({{ executor_setcap.msg | default('unknown error') }}). This node will
      run without the eBPF egress tagger, so its probes will carry no
      attribution tag and cannot be verified.
  when:
    - executor_enable_bpf | default(true)
    - executor_setcap.failed | default(false)

- name: Install executor systemd unit
  ansible.builtin.template:
    src: executor.service.j2
    dest: /etc/systemd/system/debuglet-executor.service
    owner: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart executor

- name: Enable and start executor
  ansible.builtin.systemd:
    name: debuglet-executor
    enabled: true
    state: started
    daemon_reload: true
