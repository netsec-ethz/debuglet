---
# Shared setup: service user + directory skeleton (runs on all managed hosts)

- name: Create debuglet system user
  ansible.builtin.user:
    name: "{{ debuglet_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create directory skeleton
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(debuglet_user) }}"
    group: "{{ item.group | default(debuglet_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ config_dir }}" }
    - { path: "{{ log_dir }}" }
    - { path: "{{ install_prefix }}/bin", owner: root, group: root }
