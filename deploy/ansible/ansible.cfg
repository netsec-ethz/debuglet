[defaults]
inventory = hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
timeout = 30
gathering = smart
fact_caching = memory

[ssh_connection]
pipelining = True
# A managed host is identified only by the known-hosts file pinned in
# group_vars/all.yml. Ignoring the system-wide file keeps that source the only
# one, and strict checking makes an unknown or changed key end the connection
# rather than be trusted on first use.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o HashKnownHosts=no
