          when: item.stat.exists

        - name: Upgrade the executor database
          ansible.builtin.command:
            argv: >-
              {{ ['runuser', '-u', executor_user, '--',
                  payload_prefix ~ '/lib/debuglet/' ~ debuglet_release.version ~ '/bin/debuglet-executor',
                  '-config', executor_config_dir ~ '/executor.toml',
                  '-upgrade-database']
                 + (['-accept-data-loss'] if upgrade_accept_data_loss | default(false) | bool else []) }}
          register: upgrade_result
          changed_when: true

        - name: Activate the upgraded executor
          ansible.builtin.file:
            src: "{{ payload_prefix }}/lib/debuglet/{{ debuglet_release.version }}/bin/debuglet-executor"
            dest: "{{ executor_binary }}"
            state: link
            owner: root
            group: root
            follow: false

        - name: Report the executor upgrade
          ansible.builtin.debug:
            msg: "{{ upgrade_result.stdout }} (backup in {{ upgrade_backup_dir }})"

        - name: Start the executor
          ansible.builtin.systemd:
            name: "{{ executor_service }}"
            state: started
