---
# Re-render dispatcher + executor configs from the templates and restart the
# services where the config changed. No binaries are rebuilt or redeployed.
#
# Use this to push a config-only change (version, dispatcher address, log level,
# ports, TLS flags, capacity, …) to running services.
#
# Executor paths and unit names are environment-scoped, so pass the matching
# vars file (or use the Makefile targets, which do it for you):
#
# Usage:
#   cd deploy/ansible && ansible-playbook -i hosts.yml -e @vars/prod.yml update-config.yml
#   cd deploy/ansible && ansible-playbook -i hosts.dev.yml -e @vars/dev.yml update-config.yml
#
#   Stamp a version (overrides the "unknown" default) without editing files:
#     ansible-playbook -i hosts.yml -e @vars/prod.yml update-config.yml \
#         -e "deploy_version=$(git rev-parse --short HEAD)"
#
#   Limit to some hosts:
#     ansible-playbook -i hosts.yml -e @vars/prod.yml update-config.yml --limit executor.example.com

- import_playbook: preflight.yml

- name: Update dispatcher config
  hosts: dispatcher
  become: true
  tasks:
    - name: Regenerate dispatcher config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/dispatcher/templates/dispatcher.toml.j2"
        dest: "{{ config_dir }}/dispatcher/dispatcher.toml"
        owner: "{{ debuglet_user }}"
        mode: "0640"
      register: dispatcher_config

    - name: Restart dispatcher if config changed
      ansible.builtin.systemd:
        name: debuglet-dispatcher
        state: restarted
      when: debuglet_manage_services | bool and dispatcher_config.changed

- name: Update executor config
  hosts: executors
  become: true
  tasks:
    - name: Regenerate executor config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/executor/templates/executor.toml.j2"
        dest: "{{ executor_config_dir }}/executor.toml"
        owner: "{{ executor_user }}"
        group: "{{ executor_group }}"
        mode: "0640"
      no_log: true
      register: executor_config

    - name: Restart executor if config changed
      ansible.builtin.systemd:
        name: "{{ executor_service }}"
        state: restarted
      when: debuglet_manage_services | bool and executor_config.changed
