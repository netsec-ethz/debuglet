---
# Deploy (or redeploy) all executors.
# Usage: cd deploy/ansible && ansible-playbook playbooks/deploy-executors.yml
#
# To target a single node:
#   ansible-playbook playbooks/deploy-executors.yml --limit planetlab1.example.eu

- name: Deploy Debuglet Executors
  hosts: executors
  become: true
  roles:
    - common
    - executor
