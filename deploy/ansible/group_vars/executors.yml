---
# =============================================================================
# Executor defaults (hosts in the 'executors' group)
# =============================================================================
# Override any of these per host with host_vars in the inventory.

# An executor in each environment owns its account, credentials, database,
# unit and package activation prefix. The dispatcher environments use separate
# machines; executor environments may share one.
executor_user: "{{ debuglet_user }}-{{ debuglet_env }}"
executor_group: "{{ debuglet_group }}-{{ debuglet_env }}"
executor_config_dir: "{{ config_dir }}/executor-{{ debuglet_env }}"
executor_state_dir: "{{ state_dir }}/executor-{{ debuglet_env }}"
executor_binary: "{{ payload_prefix }}/bin/debuglet-executor"
executor_service: "debuglet-executor-{{ debuglet_env }}"

# Explicitly select retirement after checking which environment owns an old
# unsuffixed unit and handling its state. Deployment otherwise refuses it.
# Existing databases stay untouched: relocation is not a schema upgrade.
executor_retire_legacy_install: false
executor_legacy_service: debuglet-executor
executor_legacy_config_dir: "{{ config_dir }}/executor"
executor_legacy_state_dir: "{{ state_dir }}/executor"

# =============================================================================
# Required: no default, set it per host
# =============================================================================
#
# executor_id is the executor's identity. It is a UUID: the CLI generates one
# per executor when it creates a local service, the dispatcher records it, and
# the secure profile uses it as the certificate common name. It is not derived
# from the host name — a renamed or rebuilt machine keeps its identity, and two
# hosts never share one — so give every host in the inventory its own:
#
#   executor1.example.com:
#     executor_id: 5fe02882-0410-416c-9935-235090bcba0d
#
# Generate one with `python3 -c 'import uuid; print(uuid.uuid4())'` or any
# other UUID source, and record it with the host's provisioning details.
#
# executor_id: set per host in the inventory

# Version string the executor reports; follows the release being deployed.
executor_version: "{{ deploy_version }}"

# Bandwidth capacity in bits per second (default 1 Gbps).
executor_capacity: 1_000_000_000
executor_max_debuglets: 20

# TESLA epoch length in seconds: each chain key signs for one epoch. An
# inventory that still sets the deprecated tesla_delay keeps that value.
tesla_epoch_seconds: 10

# TESLA disclosure delay in epochs: the key of epoch i is disclosed once epoch
# i+d starts. 0 derives the smallest d covering 15 minutes (90 epochs at 10 s);
# an explicit value must be at least 2. See docs/operations/configuration.md.
tesla_disclosure_delay_epochs: 0

# Number of epochs the TESLA hash chain covers. 0 derives it from tesla_epoch_seconds
# so the chain lasts 7 days (tesla.DefaultChainHorizon). Once the chain runs
# out the executor keeps tagging with a key it never discloses, and those
# packets can no longer be verified — so this has to outlast the executor's
# uptime between restarts.
tesla_chain_length: 0

# TESLA seed. Empty auto-generates one at startup. A configured seed yields a
# different chain at every start, derived from the seed and the start's
# generation, and a chain already recorded is refused. The rendered file
# carries it, which is why the role keeps that file out of task output and diffs.
executor_tesla_seed: ""

# Egress interface the eBPF TC tagger attaches to. Auto-detected from the
# host's default IPv4 route; override per host when a node probes out of a
# different interface. An empty value disables packet tagging altogether,
# which makes probe attribution unverifiable.
executor_interface: "{{ ansible_default_ipv4.interface | default('') }}"

# The executor's public address, set per host in the inventory: the literal
# IPv4 address its probes leave from (check with `curl -4s ifconfig.co` on the
# host, or `ip -4 route get 192.0.2.1` where it is the interface address and no
# NAT is involved). The executor advertises it in its hello, which is what the
# dispatcher's advertised-address lookup in ip_metadata reads; empty reports
# no_address. Do not put a private or NAT-internal address here.
#
# On its own it opens nothing. Run listeners (debuglets that request TCP/UDP
# listeners) also need executor_public_ports, the inbound port pool the
# executor binds guest listeners from (see socket.NewPortManager); leave it
# empty unless the host's firewall admits exactly that range from the
# Internet, since a listener nobody can reach only fails runs that ask for one.
executor_public_host: ""
executor_public_ports: ""

# The executor's IPv4 egress check (the connectivity object in GET /executors):
# a literal address:port of this executor's own dispatcher, which reflects the
# source address it sees over the existing authenticated control channel. It
# defaults to the gRPC endpoint the executor already dials whenever that is an
# IPv4 literal, so it needs no port or firewall rule beyond the control
# channel's. A dispatcher reached by name leaves it unset (the check reports
# not_configured); set it explicitly, or to "" to turn the check off.
executor_connectivity_ipv4_reflector: >-
  {%- set dialled = executor_dispatcher_addr | default(dispatcher_addr) -%}
  {{ (dialled is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')) | ternary(dialled ~ ':' ~ dispatcher_grpc_port, '') }}

# Operator labels the dispatcher publishes for this executor in the display
# object of GET /executors, with source "operator". Set them per host; the
# dispatcher role renders one [executors."<executor_id>"] table for every
# executor in the inventory with at least one of them set. Each is printable
# text of at most 64 characters without leading or trailing space; the
# country is an upper-case ISO 3166-1 alpha-2 code. Take the network from the
# origin AS of executor_public_host, for example from RIPEstat
# (https://stat.ripe.net/data/prefix-overview/data.json?resource=ADDRESS), and
# write it as "SWITCH (AS559)". Labels are not verified against the executor.
executor_display_name: ""
executor_display_city: ""
executor_display_country: ""
executor_display_network: ""

# Log level: debug | info | warn | error
executor_log_level: info

# Enable eBPF TC egress tagging (embedded in the binary). This grants the
# binary executor_capabilities below, without which the TC egress tagger
# cannot load and outgoing probes carry no attribution tag — so packet
# verification depends on it. Set to false on hosts where BPF is unavailable
# (restricted kernels, containers). When false, capabilities are not set and
# the systemd unit omits them.
executor_enable_bpf: true

# The file capabilities the executor binary runs with, exactly these:
#
#   cap_bpf       create the tagger's and packet counter's maps and programs
#   cap_perfmon   let the verifier accept the tagger's pointer comparisons;
#                 without it the load fails with "R2 pointer comparison
#                 prohibited" and the executor falls back (enforcement_reason
#                 not_permitted)
#   cap_net_admin attach the programs to the interface's TC egress hook
#   cap_net_raw   open the raw sockets of guest ICMP and of the pure-Go
#                 tagger used where the eBPF tagger does not load
#
# cap_sys_resource is not needed. Since Linux 5.11 BPF memory is charged to
# the memory cgroup rather than RLIMIT_MEMLOCK, and cilium/ebpf leaves the
# limit alone when its probe map, created under cap_bpf, succeeds. On an
# older kernel the unit lifts the limit itself (LimitMEMLOCK=infinity, set by
# systemd before the executor starts) rather than granting the capability. A
# "map create: operation not permitted (MEMLOCK may be too low ...)" error on
# a newer kernel means cap_bpf is missing, not the limit.
executor_capabilities:
  - cap_net_admin
  - cap_net_raw
  - cap_perfmon
  - cap_bpf

# Packet-counter mode rendered into the daemon configuration. `auto` tries
# eBPF and falls back only after a confirmed clean rollback. Hosts whose
# kernels reject the bundled BPF program should explicitly use `fallback` and
# disable executor_enable_bpf so startup remains deterministic.
executor_packet_counter: "{{ (executor_enable_bpf | bool) | ternary('auto', 'fallback') }}"

# Whether the systemd unit grants capabilities through the ambient set. Off by
# default: with BPF enabled the binary already gets its capabilities from
# setcap (file capabilities, applied by the executor role), so the ambient set
# is redundant — while on restricted environments systemd cannot manipulate it
# at all and exec fails with 203/EXEC, taking the executor down entirely. Turn
# it on per host to have the unit carry a CapabilityBoundingSet as well. Only
# meaningful when executor_enable_bpf is true.
executor_ambient_caps: false

# TLS for the executor's connection to the dispatcher. The executor pins the
# deployment CA in credentials.ca_cert and verifies what the dispatcher
# presents against it: a certificate that does not chain to that CA, or that
# does not carry the name the executor dialled in its subjectAltName, ends the
# connection. Nothing is skipped and nothing is trusted on first use, so this
# is what the certificate has to be issued for — see dispatcher_disable_tls in
# group_vars/all.yml, which is the other half of the same decision.
#
# deploy-certs.yml installs the CA and this host's client certificate from
# deploy/certs before the executor starts; deploy/scripts/generate-certs.sh
# issues both.
#
# Set this to true only for a dispatcher the executor reaches at a literal
# loopback address such as 127.0.0.1 on the same machine: a name is not
# accepted, not even localhost, because what a name resolves to is a property
# of the machine rather than of the file. A remote control channel in
# cleartext is not a supported configuration, and the preflight refuses it.
executor_disable_tls: false

# Name to verify the dispatcher's certificate against on both control
# channels, when that is not the address the executor dials — dispatcher_addr
# holding an IP address while the certificate names the host, for example.
# Empty verifies the host part of the dialled addresses, which is what a
# certificate carrying dispatcher_addr supports. It needs a verifying channel,
# so it cannot be combined with executor_disable_tls, and it is rendered only
# when set.
executor_tls_server_name: ""

# A single-use enrollment token from `debuglet-dispatcher -enroll-executor
# <executor_id>`, for an executor the deployment does not bind from a
# certificate it holds (see dispatcher_bind_inventory_executors). Rendered as
# credentials.enrollment_token only when set; the first connection spends it
# and binds the certificate the executor presents. It is a secret: keep it in
# a vault or a private host_vars file, never in a committed inventory. A spent
# token buys nothing, so it may stay until the next configuration change.
executor_enrollment_token: ""

# Payments. The deployment runs without a wallet: the executor prices work in
# TEST units and names no chain account. Fill in a currency and wallet only
# together with the dispatcher's payment configuration.
executor_price_per_bw_s: 1
executor_currency: "TEST"
executor_sui_wallet: ""
executor_trial_price_limit: 0
executor_trial_time_limit: 0
