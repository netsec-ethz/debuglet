---
# =============================================================================
# Executor-specific defaults (applies to all hosts in the 'executors' group)
# =============================================================================
# Override per-host in hosts.yml using host_vars if needed.

# ---------------------------------------------------------------------------
# Per-environment namespacing
# ---------------------------------------------------------------------------
# Every filesystem and systemd name an executor owns carries the environment
# (see debuglet_env in group_vars/all.yml), so a prod and a dev executor can
# run side by side on the same machine — which ordroid-ethz does. Nothing is
# shared between the two but /etc/debuglet itself and the SSH login used to
# deploy: separate service users, separate config dirs (so separate TLS
# credentials, TESLA seed and executor.db), separate binaries, separate units.
executor_user: "{{ debuglet_user }}-{{ debuglet_env }}"
executor_group: "{{ debuglet_group }}-{{ debuglet_env }}"
executor_config_dir: "{{ config_dir }}/executor-{{ debuglet_env }}"
executor_binary: "{{ install_prefix }}/bin/debuglet-executor-{{ debuglet_env }}"
executor_service: "debuglet-executor-{{ debuglet_env }}"

# The pre-split install: one unsuffixed user/dir/binary/unit shared by both
# environments. The executor role stops and disables the legacy unit and
# carries its executor.db over to whichever environment claims the machine
# first, so a redeploy migrates a node instead of leaving two executors
# racing for the same executor_id. Set to false once every node has been
# through a post-split deploy.
executor_retire_legacy_install: true
executor_legacy_config_dir: "{{ config_dir }}/executor"
executor_legacy_binary: "{{ install_prefix }}/bin/debuglet-executor"
executor_legacy_service: "debuglet-executor"

# Bandwidth capacity in bits/sec (default: 1 Gbps)
executor_capacity: 1_000_000_000

# TESLA epoch duration in seconds
tesla_delay: 10

# Number of epochs the TESLA hash chain covers. 0 derives it from tesla_delay
# so the chain lasts 7 days (tesla.DefaultChainHorizon). Once the chain runs
# out the executor keeps tagging with a key it never discloses, and those
# packets can no longer be verified — so this has to outlast the executor's
# uptime between restarts.
tesla_chain_length: 0

# Egress interface the eBPF TC tagger attaches to. Auto-detected from the
# host's default IPv4 route; override per-host in hosts.yml when a node
# probes out of a different interface. An empty value disables packet
# tagging altogether, which makes probe attribution unverifiable.
executor_interface: "{{ ansible_default_ipv4.interface | default('') }}"

# Public endpoint for debuglets that request TCP/UDP listeners. Empty
# disables listening; set both to enable it (see socket.NewPortManager).
executor_public_host: ""
executor_public_ports: ""

# Log level: debug | info | warn | error
executor_log_level: info

# Enable eBPF TC egress tagging (embedded in binary).
# This grants the binary cap_net_admin,cap_bpf, without which the TC egress
# tagger cannot attach and outgoing probes carry no attribution tag — so
# packet verification depends on it.
# Set to false on hosts where BPF is unavailable (PlanetLab, restricted kernels).
# When false: capabilities are not set and the systemd unit omits BPF caps.
executor_enable_bpf: true

# Whether the systemd unit grants capabilities via the AmbientCapabilities set.
# Off by default: with BPF enabled the binary already gets its capabilities
# from setcap (file caps, applied by the executor role), so the ambient set is
# redundant — while on restricted environments (some containers / EdgeNet)
# systemd cannot manipulate it at all and exec fails with 203/EXEC, taking the
# executor down entirely. Turn it on per-host if you want the unit to carry a
# CapabilityBoundingSet as well. Only meaningful when executor_enable_bpf.
executor_ambient_caps: false

# TLS for the executor → dispatcher connection. Disabled, because nothing
# terminates TLS in front of the dispatcher's gRPC/yamux ports any more:
# executors dial dispatcher_grpc_port/dispatcher_http_port directly (the
# firewall exposes them — see group_vars/all.yml), and the dispatcher itself
# runs with dispatcher_disable_tls, so the far end speaks cleartext. nginx
# only fronts the REST API and the web origins now. This matches what every
# deployed executor already runs with.
#
# Turning this on requires putting a TLS terminator back in front of the gRPC
# port first; a TLS client against a cleartext listener just fails to connect.
# Server cert verification is skipped executor-side anyway (InsecureSkipVerify,
# see internal/executor/executor.go).
executor_disable_tls: true

# TESLA seed (leave empty to auto-generate; set per-host for deterministic keys)
executor_tesla_seed: ""

# Executor identity (override per-host in hosts.yml host_vars)
executor_id: "{{ inventory_hostname }}"
executor_version: "{{ deploy_version }}"
executor_max_debuglets: 20
