---
# =============================================================================
# Global deployment variables (applies to EVERY host: dispatcher + executors)
# =============================================================================
#
# Dispatcher-only settings (nothing here that an executor template or
# group_vars/executors.yml reads) live in group_vars/dispatcher.yml instead.
#
# dispatcher_addr differs per environment (prod vs dev), so it's NOT set
# here — the deploy CI job passes it as an -e extra-var, sourced from the
# DISPATCHER_ADDR/DISPATCHER_ADDR_DEV CI/CD variables (branch picks which
# one). See .gitlab-ci.yml. The default below is only hit for a
# manual/local run, e.g.:
#   ansible-playbook -i hosts.yml site.yml -e "dispatcher_addr=my-dispatcher.example.com"
#
# To update the dispatcher address on ALL executors at once:
#   1. Run: make deploy-update-addr DISPATCHER_ADDR=new-dispatcher.example.com
#      or:  cd deploy/ansible && ansible-playbook update-dispatcher-addr.yml -e "dispatcher_addr=..."

# Dispatcher endpoint — executors point here. A bare hostname or IP, no port:
# the executor config appends dispatcher_grpc_port/dispatcher_http_port below.
# Prod resolves to the dispatcher host, dev to the dev dispatcher's ETH-internal
# address; both are dialled directly, with no nginx in between.
dispatcher_addr: "localhost"

# Ports the dispatcher listens on and executors dial directly: gRPC on
# dispatcher_grpc_port, cmux HTTP/yamux on dispatcher_http_port. The firewall
# exposes these directly, so executors connect straight to them (no nginx in
# the executor path).
dispatcher_grpc_port: 9001
dispatcher_http_port: 9000

# The dispatcher's own listeners run WITHOUT TLS. Nothing terminates TLS in
# front of the gRPC/yamux ports any more — nginx only fronts the REST API and
# the web origins — so executors dial them in cleartext too; see
# executor_disable_tls in executors.yml, which has to stay in step with this.
dispatcher_disable_tls: true

# Deploy version — injected by CI from commit message; overridable via -e
deploy_version: "unknown"

# Filesystem layout on remote machines
install_prefix: /usr/local
config_dir: /etc/debuglet
log_dir: /var/log/debuglet

# Service account used to run both services
debuglet_user: debuglet
debuglet_group: debuglet

# Paths to local build artifacts (relative to deploy/)
dist_dir: "{{ playbook_dir }}/../dist"
certs_dir: "{{ playbook_dir }}/../certs"
