---
# =============================================================================
# Global deployment variables
# =============================================================================
#
# To update the dispatcher address on ALL executors at once:
#   1. Edit dispatcher_addr below
#   2. Run: make deploy-update-addr
#      or:  cd deploy/ansible && ansible-playbook update-dispatcher-addr.yml

# Dispatcher endpoint — executors point here. This is a bare hostname (no port):
# executors reach the nginx reverse proxy over HTTPS, and the gRPC client's dns
# resolver dials the default port 443.
dispatcher_addr: "db-dispatch.netsec.ethz.ch"

# Ports the dispatcher listens on and executors dial directly: gRPC on
# dispatcher_grpc_port, cmux HTTP/yamux on dispatcher_http_port. The firewall
# exposes these directly, so executors connect straight to them (no nginx in
# the executor path).
dispatcher_grpc_port: 9001
dispatcher_http_port: 9000

# The dispatcher runs WITHOUT TLS because nginx terminates it in front of the
# gRPC port (nginx -> dispatcher is localhost cleartext). Executors, however,
# must speak TLS to nginx — see executor_disable_tls in executors.yml.
dispatcher_disable_tls: true

# Dispatcher service defaults
dispatcher_log_level: info
dispatcher_executor_timeout: 60
dispatcher_scheduler_granularity_ms: 30000
dispatcher_tls_ca_file: "{{ config_dir }}/dispatcher/ca.crt"

# Deploy version — injected by CI from commit message; overridable via -e
deploy_version: "unknown"

# Filesystem layout on remote machines
install_prefix: /usr/local
config_dir: /etc/debuglet
log_dir: /var/log/debuglet

# Service account used to run both services
debuglet_user: debuglet
debuglet_group: debuglet

# Paths to local build artifacts (relative to deploy/)
dist_dir: "{{ playbook_dir }}/../dist"
certs_dir: "{{ playbook_dir }}/../certs"
