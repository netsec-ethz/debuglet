---
# =============================================================================
# Dispatcher-only variables (hosts in the 'dispatcher' group)
# =============================================================================
#
# Only variables nothing outside the dispatcher role reads belong here. If an
# executor template or group_vars/executors.yml reads it too — dispatcher_addr,
# dispatcher_grpc_port, dispatcher_http_port, dispatcher_disable_tls — it
# belongs in group_vars/all.yml: this file is invisible to executor hosts.

# =============================================================================
# Required: supplied by vars/prod.yml or vars/dev.yml, or set explicitly
# =============================================================================
#
# dispatcher_base_url is the public origin the HTTP API is served from: a bare
# domain, with no scheme and no port. It is the only origin allowed to send
# credentials to the API, so it differs per environment and is deliberately
# not defaulted here. The selected vars/<env>.yml supplies the official
# origin. Override it on the command line for another deployment:
#
#   ansible-playbook -i hosts.yml -e @vars/prod.yml site.yml \
#       -e dispatcher_addr=dispatcher.example.com \
#       -e dispatcher_base_url=debuglet.example.com
#
# dispatcher_base_url: set per environment

# Origins allowed to make credentialed (cookie-based) requests to the API.
# Browser clients need their own origin listed here; without it the session
# cookie is never sent cross-origin. A "*" entry is refused by the daemon: a
# wildcard cannot carry credentials.
dispatcher_cors_allowed_origins: ["https://{{ dispatcher_base_url }}"]

# Dispatcher service defaults.
dispatcher_log_level: info
dispatcher_executor_timeout: 60
dispatcher_scheduler_granularity_ms: 30000

# GitHub OAuth credentials stay in the ignored, owner-only file selected by
# the environment. The OAuth applications must use the callback URL rendered
# below. A fixed success URL prevents a caller-controlled open redirect.
dispatcher_github_oauth_enabled: true
dispatcher_github_oauth_env_file: "{{ playbook_dir }}/secrets/{{ debuglet_env }}/github-oauth.env"
dispatcher_github_oauth_callback_url: "https://{{ dispatcher_base_url }}/api/auth/github/callback"
dispatcher_github_oauth_success_url: "https://{{ dispatcher_base_url }}/console/"

# CILogon sign-in. CILOGON_CLIENT_ID and CILOGON_CLIENT_SECRET stay in their
# own ignored, owner-only file, which the unit loads only when this is on. The
# client registered at CILogon must list exactly the callback URL below; a
# client approved on cilogon.org does not work against test.cilogon.org.
dispatcher_cilogon_oidc_enabled: false
dispatcher_cilogon_oidc_env_file: "{{ playbook_dir }}/secrets/{{ debuglet_env }}/cilogon_oidc.env"
dispatcher_cilogon_oidc_issuer: "https://cilogon.org"
dispatcher_cilogon_oidc_callback_url: "https://{{ dispatcher_base_url }}/api/auth/cilogon/callback"
dispatcher_cilogon_oidc_success_url: "https://{{ dispatcher_base_url }}/console/"

# Set both URLs to enable browser-approved CLI credentials.
dispatcher_authentication_public_url: ""
dispatcher_authentication_device_verification_url: ""

# Whether the dispatcher requires a client certificate on its own listeners.
# Only meaningful when dispatcher_disable_tls is false, and off by default:
# turning it on refuses every executor that does not yet present a client
# certificate from the deployment CA, so run deploy-certs.yml on every
# executor first. It is rendered only when it is on.
dispatcher_require_client_cert: false

# The authority the dispatcher checks client certificates against. It is read
# only when client certificates are required, and deploy-certs.yml installs it
# next to the server keypair.
dispatcher_tls_ca_file: "{{ config_dir }}/dispatcher/ca.crt"
# Local source for that public trust bundle. Keep all still-valid client
# issuers trusted during a rotation; deploy-certs.yml copies this file verbatim.
dispatcher_tls_ca_source: "{{ certs_dir }}/ca.crt"

# Self-service enrollment is opt-in. Preprovision a dedicated intermediate
# issuer on the deployment controller, never the deployment root's private key.
# Only deploy-certs.yml copies its material; site.yml renders the configuration.
dispatcher_executor_onboarding_enabled: false
dispatcher_executor_onboarding_ca_cert: ""
dispatcher_executor_onboarding_ca_key: ""
dispatcher_executor_onboarding_dispatcher_url: ""
dispatcher_executor_onboarding_grpc_address: ""
dispatcher_executor_onboarding_yamux_address: ""

# Executor ASN and announced prefix from RIPE RIS, the method RIPE Atlas uses
# for its probes: the origin AS of the longest prefix that at least
# dispatcher_ris_asn_min_peers RIS peers see. The debuglet-ris-asn timer
# rebuilds the database daily from RIPE's public dumps (about 15 MB of
# downloads, under a minute and 0.5 GB of memory), verifies it and renames it
# into place; the dispatcher picks the new file up within a minute without a
# restart. The first build runs during deployment, before the configuration
# names the file, so the dispatcher host needs HTTPS access to
# www.ris.ripe.net and ftp.ripe.net. Enabled per environment in vars/.
dispatcher_ris_asn_enabled: false
dispatcher_ris_asn_database: "{{ state_dir }}/dispatcher/ris-asn.mmdb"
dispatcher_ris_asn_min_peers: 10
# RIS regenerates the dumps shortly after midnight UTC.
dispatcher_ris_asn_schedule: "*-*-* 04:30:00 UTC"

# Blockchain payments. The deployment runs without a wallet: the dispatcher
# constructs no chain client and rejects USDC/SUI payment actions, while TEST
# payments keep working. Nothing is inferred from the empty fields; set
# dispatcher_sui_disabled to false and fill them in to enable payments.
dispatcher_sui_disabled: true
dispatcher_sui_network: ""
dispatcher_sui_grpc_endpoint: ""
dispatcher_sui_graphql_url: ""
dispatcher_sui_address: ""
dispatcher_sui_payment_registry_id: ""
dispatcher_sui_payment_kit_package: ""
dispatcher_sui_keystore_path: ""
