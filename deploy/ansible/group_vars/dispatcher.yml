---
# =============================================================================
# Dispatcher-only variables (applies to hosts in the 'dispatcher' group)
# =============================================================================
#
# Only put vars here that NOTHING outside the dispatcher role reads. If an
# executor template or group_vars/executors.yml references it too (e.g.
# dispatcher_addr, dispatcher_grpc_port/http_port, dispatcher_disable_tls),
# it belongs in group_vars/all.yml instead — group_vars/dispatcher.yml is
# invisible to executor hosts.

# Public origin the HTTP API will eventually sit behind (bare domain, no
# scheme/port). Differs per environment (prod vs dev), so it's NOT set here
# — the deploy CI job passes it as an -e extra-var, sourced from the
# DISPATCHER_BASE_URL/DISPATCHER_BASE_URL_DEV CI/CD variables (branch picks
# which one). See .gitlab-ci.yml. The default below is only hit for a
# manual/local run.
#
# Used to compute dispatcher_cors_allowed_origins below — the origin
# allowed to make credentialed (cookie-based, session_token) requests to
# the dispatcher API. Browser clients need this to authenticate: without
# it, the session cookie is never sent cross-origin and endpoints like /me
# always 401.
dispatcher_base_url: "localhost"
dispatcher_cors_allowed_origins: ["https://{{ dispatcher_base_url }}"]

# Dispatcher service defaults
dispatcher_log_level: info
dispatcher_executor_timeout: 60
dispatcher_scheduler_granularity_ms: 30000
dispatcher_tls_ca_file: "{{ config_dir }}/dispatcher/ca.crt"
