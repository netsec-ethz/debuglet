---
# =============================================================================
# Dispatcher-only variables (applies to hosts in the 'dispatcher' group)
# =============================================================================
#
# Only put vars here that NOTHING outside the dispatcher role reads. If an
# executor template or group_vars/executors.yml references it too (e.g.
# dispatcher_addr, dispatcher_grpc_port/http_port, dispatcher_disable_tls),
# it belongs in group_vars/all.yml instead — group_vars/dispatcher.yml is
# invisible to executor hosts.

# Public origin the HTTP API sits behind (bare domain, no scheme/port).
# Differs per environment, so the real value lives in the committed
# deploy/ansible/vars/<env>.yml that the CI deploy job passes as
# -e @vars/<env>.yml (see .gitlab-ci.yml). The default below is only hit for
# a manual/local run.
#
# Used to compute dispatcher_cors_allowed_origins below — the origins
# allowed to make credentialed (cookie-based, session_token) requests to
# the dispatcher API. A browser client on a different origin needs this to
# authenticate: without it the session cookie is never sent cross-origin and
# endpoints like /me always 401.
#
# Both deployed consoles are same-origin with their API
# (debuglet.netsec.ethz.ch/console -> /api, and dev.debuglet.netsec.ethz.ch
# likewise), so CORS is not on their critical path — it matters for clients
# served from somewhere else, e.g. a local `npm run dev` of the website or
# console pointed at a deployed dispatcher.
dispatcher_base_url: "localhost"

# Guard the derived value: an empty or placeholder base URL used to render as
# the literal origin ["https://"], which is worse than no config at all. An
# empty list leaves echo's CORS middleware at its permissive default ("*"
# without credentials) instead of a credentialed allow-list matching nothing.
dispatcher_cors_allowed_origins: "{{ ['https://' ~ dispatcher_base_url] if (dispatcher_base_url | default('', true)) not in ['', 'localhost'] else [] }}"

# Dispatcher service defaults
dispatcher_log_level: info
dispatcher_executor_timeout: 60
dispatcher_scheduler_granularity_ms: 30000
dispatcher_tls_ca_file: "{{ config_dir }}/dispatcher/ca.crt"
