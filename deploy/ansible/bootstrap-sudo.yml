---
# One-time bootstrap: grant passwordless sudo to the SSH user on the
# dispatcher and executor nodes. Run this once with -K (ask for the current
# sudo password), then all subsequent deploys work without interaction.
#
# Usage:
#   cd deploy/ansible && ansible-playbook -i hosts.yml bootstrap-sudo.yml -K [--limit host]
#   or: make bootstrap-sudo [LIMIT=hostname]

- name: Bootstrap passwordless sudo on dispatcher and executor nodes
  hosts: dispatcher:executors
  become: true

  tasks:
    - name: Grant passwordless sudo to the SSH user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_user }}-nopasswd"
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
