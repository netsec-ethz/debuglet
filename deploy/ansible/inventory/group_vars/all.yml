---
# =============================================================================
# Global deployment variables
# =============================================================================
#
# To update the dispatcher address on ALL executors at once:
#   1. Edit dispatcher_addr below
#   2. Run: make deploy-update-addr
#      or:  cd deploy/ansible && ansible-playbook playbooks/update-dispatcher-addr.yml

# Dispatcher endpoint (gRPC) — executors point here
dispatcher_addr: "db-dispatch.netsec.ethz.ch"

# Ports on the dispatcher machine
dispatcher_grpc_port: 9001
dispatcher_http_port: 9000

# Set to true when a reverse proxy (e.g. nginx grpc_pass) handles TLS
# termination in front of the gRPC port. Executors then connect through
# the proxy on port 443 without specifying a port.
dispatcher_disable_tls: true

# Filesystem layout on remote machines
install_prefix:   /usr/local
config_dir:       /etc/debuglet
bpf_dir:          /etc/debuglet/bpf
log_dir:          /var/log/debuglet

# Service account used to run both services
debuglet_user:  debuglet
debuglet_group: debuglet

# Paths to local build artifacts (relative to this file → deploy/)
dist_dir:  "{{ playbook_dir }}/../../dist"
certs_dir: "{{ playbook_dir }}/../../certs"
