---
# Debuglet deployment inventory
#
# Edit this file to add your machines.
# executor_id must be unique per node and must match the CN in the TLS client
# certificate you generated with deploy/scripts/generate-certs.sh.
#
# Run certificate generation first:
#   make deploy-certs EXECUTOR_IDS="executor-node1 executor-node2 ..."

all:
  children:

    # ------------------------------------------------------------------
    # Dispatcher — one machine
    # ------------------------------------------------------------------
    dispatcher:
      hosts:
        dispatcher-ethz:
          ansible_user: ubuntu

    # ------------------------------------------------------------------
    # Executors — all executor machines
    # ------------------------------------------------------------------
    executors:
      children:

        # Regular SSH-accessible machines
        ssh_machines:
          hosts:
            ordroid-ethz:
              ansible_user: ordroid
              executor_id: ordroid-ethz
            # kisti-ams:
            #   ansible_user: anapaya
            #   executor_id: kisti-ams

            # kisti-chg:
            #   ansible_user: anapaya
            #   executor_id: kisti-chg

        # PlanetLab / EdgeNet nodes
        # SSH user is typically your slice name (e.g. eth_debuglet).
        # edgenet:
        #   vars:
        #     ansible_user: eth_debuglet     # <-- update to your slice name
        #   hosts:
        #     planetlab1.example.eu:
        #       executor_id: executor-pl1

        #     planetlab2.example.eu:
        #       executor_id: executor-pl2
