---
# Install the TLS material deploy/scripts/generate-certs.sh issued: the
# dispatcher's server keypair, and on every executor the CA it verifies the
# dispatcher with plus that host's own client certificate. The dispatcher gets
# the CA too, so requiring client certificates later needs no second run.
#
# With dispatcher_require_client_cert on and a dispatcher already enforcing it,
# it also binds every inventory executor ID to its client certificate on the
# dispatcher before the executors install it, so a reissued certificate is
# admitted rather than refused (tasks/bind-executors.yml).
#
#   DISPATCHER_SANS="DNS:dispatcher.example.com" ./deploy/scripts/generate-certs.sh <uuid> ...
#   cd deploy/ansible && ../scripts/provisioner.sh ansible-playbook -i hosts.yml -e @vars/prod.yml deploy-certs.yml
#
# It runs before site.yml, which renders paths to this material.

- import_playbook: preflight.yml

- name: Deploy TLS certificates to dispatcher
  hosts: dispatcher
  become: true
  # This runs before site.yml on a fresh host, so the service account and the
  # directory skeleton the copies below need are created here too.
  roles:
    - common
  tasks:
    - name: Create dispatcher config directory
      ansible.builtin.file:
        path: "{{ config_dir }}/dispatcher"
        state: directory
        owner: "{{ debuglet_user }}"
        group: "{{ debuglet_group }}"
        mode: "0700"

    - name: Deploy dispatcher TLS certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/dispatcher/server.crt"
        dest: "{{ config_dir }}/dispatcher/server.crt"
        owner: "{{ debuglet_user }}"
        mode: "0640"
      register: dispatcher_cert_copy

    - name: Deploy dispatcher TLS key
      ansible.builtin.copy:
        src: "{{ certs_dir }}/dispatcher/server.key"
        dest: "{{ config_dir }}/dispatcher/server.key"
        owner: "{{ debuglet_user }}"
        mode: "0600"
      no_log: true
      register: dispatcher_key_copy

    # Read only when dispatcher_require_client_cert is on, and installed
    # either way so that turning it on is a configuration change alone.
    - name: Deploy the authority for client certificates
      ansible.builtin.copy:
        src: "{{ dispatcher_tls_ca_source }}"
        dest: "{{ dispatcher_tls_ca_file }}"
        owner: "{{ debuglet_user }}"
        mode: "0644"
      register: dispatcher_ca_copy

    - name: Deploy the dedicated executor enrollment issuer
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ config_dir }}/dispatcher/{{ item.name }}"
        owner: "{{ debuglet_user }}"
        group: "{{ debuglet_group }}"
        mode: "0600"
      loop:
        - { src: "{{ dispatcher_executor_onboarding_ca_cert }}", name: enrollment-ca.crt }
        - { src: "{{ dispatcher_executor_onboarding_ca_key }}", name: enrollment-ca.key }
      no_log: true
      when: dispatcher_executor_onboarding_enabled | bool
      register: dispatcher_issuer_copy

    # A dispatcher that requires client certificates admits an executor only
    # over the certificate bound to its ID, so a certificate generate-certs.sh
    # issued or reissued is bound here, before the executors below install
    # it. On a host where the dispatcher is not installed yet, or whose
    # installed configuration does not require client certificates yet,
    # site.yml or update-config.yml binds them before enabling the requirement.
    - name: Inspect the installed dispatcher for executor binding
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ payload_prefix }}/bin/debuglet-dispatcher"
        - "{{ config_dir }}/dispatcher/dispatcher.toml"
        - "{{ state_dir }}/dispatcher/dispatcher.db"
      register: dispatcher_bind_installed
      when:
        - dispatcher_require_client_cert | bool
        - dispatcher_bind_inventory_executors | bool

    - name: Read whether the installed configuration requires client certificates
      ansible.builtin.command:
        argv: [grep, -qxF, "require_client_cert = true", "{{ config_dir }}/dispatcher/dispatcher.toml"]
      register: dispatcher_bind_enforced
      changed_when: false
      check_mode: false
      failed_when: dispatcher_bind_enforced.rc not in [0, 1]
      when:
        - dispatcher_require_client_cert | bool
        - dispatcher_bind_inventory_executors | bool
        - dispatcher_bind_installed.results | map(attribute='stat.exists') | min

    - name: Bind the inventory executors to their client certificates
      ansible.builtin.include_tasks: tasks/bind-executors.yml
      when:
        - dispatcher_require_client_cert | bool
        - dispatcher_bind_inventory_executors | bool
        - dispatcher_bind_enforced.rc | default(1) == 0

    - name: Report executor binding left to the deployment
      ansible.builtin.debug:
        msg: >-
          The dispatcher here is not installed or does not require client
          certificates yet, so no executor was bound now. site.yml or
          update-config.yml binds the inventory executors before it enables
          the requirement.
      when:
        - dispatcher_require_client_cert | bool
        - dispatcher_bind_inventory_executors | bool
        - dispatcher_bind_enforced.rc | default(1) != 0

    - name: Inspect the dispatcher unit
      ansible.builtin.stat:
        path: "{{ systemd_unit_dir }}/debuglet-dispatcher.service"
      register: dispatcher_unit

    # site.yml installs the units, and this playbook runs before it, so a
    # first deployment has no service to restart.
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: debuglet_manage_services | bool and dispatcher_unit.stat.exists

    # Only new material needs a restart: the daemon reads it at startup.
    - name: Restart dispatcher
      ansible.builtin.systemd:
        name: debuglet-dispatcher
        state: restarted
      when:
        - debuglet_manage_services | bool and dispatcher_unit.stat.exists
        - dispatcher_cert_copy is changed or dispatcher_key_copy is changed
          or dispatcher_ca_copy is changed or dispatcher_issuer_copy is changed

# Credentials land in the environment's own config dir, so a machine that is
# an executor in both prod and dev holds one client cert per environment
# (their executor_ids differ, so the certs do too).
- name: Deploy TLS certificates to executors
  hosts: executors
  serial: 1
  become: true
  roles:
    - common
  tasks:
    - name: Create executor config directory
      ansible.builtin.file:
        path: "{{ executor_config_dir }}"
        state: directory
        owner: "{{ executor_user }}"
        group: "{{ executor_group }}"
        mode: "0700"

    - name: Deploy CA certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/ca.crt"
        dest: "{{ executor_config_dir }}/ca.crt"
        owner: "{{ executor_user }}"
        group: "{{ executor_group }}"
        mode: "0644"
      register: executor_ca_copy

    - name: Deploy executor client certificate
      ansible.builtin.copy:
        src: "{{ certs_dir }}/executors/{{ executor_id }}/client.crt"
        dest: "{{ executor_config_dir }}/client.crt"
        owner: "{{ executor_user }}"
        group: "{{ executor_group }}"
        mode: "0640"
      register: executor_cert_copy

    - name: Deploy executor client key
      ansible.builtin.copy:
        src: "{{ certs_dir }}/executors/{{ executor_id }}/client.key"
        dest: "{{ executor_config_dir }}/client.key"
        owner: "{{ executor_user }}"
        group: "{{ executor_group }}"
        mode: "0600"
      no_log: true
      register: executor_key_copy

    - name: Inspect the executor unit
      ansible.builtin.stat:
        path: "{{ systemd_unit_dir }}/{{ executor_service }}.service"
      register: executor_unit

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: debuglet_manage_services | bool and executor_unit.stat.exists

    # Only new material needs a restart. An executor restart starts a new
    # TESLA chain, and the last disclosure delay's worth of keys of the old
    # one is never disclosed, so the packets it sent then cannot be verified.
    - name: Restart executor
      ansible.builtin.systemd:
        name: "{{ executor_service }}"
        state: restarted
      when:
        - debuglet_manage_services | bool and executor_unit.stat.exists
        - executor_ca_copy is changed or executor_cert_copy is changed
          or executor_key_copy is changed
