---
# Environment-wide values selected with -e @vars/prod.yml and the matching
# inventory. Make passes these via DEPLOY_ENV=prod. Host-specific settings
# belong in the inventory because extra-vars take precedence over host_vars.
# dispatcher_addr remains an explicit inventory or command-line input.

debuglet_env: prod

# Public origin the dispatcher API is served from. Drives
# dispatcher_cors_allowed_origins (see group_vars/dispatcher.yml), which is
# what lets the console authenticate with its session cookie.
dispatcher_base_url: debuglet.netsec.ethz.ch
