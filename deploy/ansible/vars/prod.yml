---
# Environment-wide values selected with -e @vars/prod.yml and the matching
# inventory. Make passes these via DEPLOY_ENV=prod. Host-specific settings
# belong in the inventory because extra-vars take precedence over host_vars.
# dispatcher_addr remains an explicit inventory or command-line input.

debuglet_env: prod

# Public origin the dispatcher API is served from. Drives
# dispatcher_cors_allowed_origins (see group_vars/dispatcher.yml), which is
# what lets the console authenticate with its session cookie.
dispatcher_base_url: debuglet.netsec.ethz.ch

# CILogon client cilogon:/client_id/f8b81eedbc869260bc6eefee48cb9be is approved
# for https://debuglet.netsec.ethz.ch/api/auth/cilogon/callback.
dispatcher_cilogon_oidc_enabled: true

# Executor ASN and prefix from RIPE RIS; see group_vars/dispatcher.yml.
dispatcher_ris_asn_enabled: true
# Browser-approved CLI credentials (dbl login, docs/operations/authentication.md).
dispatcher_authentication_public_url: "https://{{ dispatcher_base_url }}/api"
dispatcher_authentication_device_verification_url: "https://{{ dispatcher_base_url }}/console/device"
