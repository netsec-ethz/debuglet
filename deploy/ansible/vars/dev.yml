---
# Environment-wide values selected with -e @vars/dev.yml and the matching
# inventory. Make passes these via DEPLOY_ENV=dev. Host-specific settings
# belong in the inventory because extra-vars take precedence over host_vars.
# dispatcher_addr remains an explicit inventory or command-line input.

debuglet_env: dev

# Public origin the dev dispatcher API is served from — debuglet-jump proxies
# https://dev.debuglet.netsec.ethz.ch/api/ to the dev dispatcher's port 9000,
# and serves the dev website and console from the same origin. Drives
# dispatcher_cors_allowed_origins (see group_vars/dispatcher.yml).
#
# This is committed rather than read from a CI/CD variable because it is not
# secret and an unset variable is silently destructive: an empty value renders
# allowed_origins as the literal ["https://"], which switches echo's CORS
# middleware into credentialed mode with an allow-list that matches nothing.
dispatcher_base_url: dev.debuglet.netsec.ethz.ch
